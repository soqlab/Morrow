# Nightly fuzzing of every parser that reads attacker-controlled bytes (backend/fuzz/).
#
# The pull-request run (tests.yml) already replays the regression corpus and runs the Hypothesis
# properties with a small, derandomized budget. This workflow goes further each night:
#   * hypothesis: the same tests with MORROW_FUZZ_EXAMPLES raised and fresh random inputs;
#   * atheris: coverage-guided libFuzzer runs, one job per target, FUZZ_SECONDS each.
# A failure is raised as an annotation (scripts/ci-annotate.sh), visible on the checks list without
# signing in, and the crashing input is uploaded as an artifact. To keep a finding: minimize it,
# put it in backend/fuzz/corpus/<target>/regressions/ and fix the parser in the same change.

name: Fuzz

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: "Seconds of Atheris fuzzing per target"
        default: "900"
      examples:
        description: "Hypothesis examples per property"
        default: "20000"

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: .
  MORROW_MAIN_DB_BACKEND: sqlite
  MORROW_ENVIRONMENT: local
  MORROW_AUTH_REQUIRED: "0"
  MORROW_LLM_DISABLED: "1"

jobs:
  hypothesis:
    name: Hypothesis (long budget)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: backend
    env:
      MORROW_FUZZ_EXAMPLES: ${{ github.event.inputs.examples || '20000' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run the fuzz properties
        shell: bash
        run: >
          bash ../scripts/ci-annotate.sh hypothesis-fuzz
          pytest -q --tb=short -p no:cacheprovider test_fuzz_*.py

  atheris:
    name: Atheris ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [tls_server_hello, tls_flight, tls_flight_small_records, x509, ike, ikev1, ssh, ssh_kexinit,
                 passive, sbom, cbom, cbom_ingest, cert_inventory]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt atheris==3.0.0

      - name: Fuzz ${{ matrix.target }}
        shell: bash
        env:
          FUZZ_SECONDS: ${{ github.event.inputs.seconds || '900' }}
        run: |
          mkdir -p work/corpus artifacts
          seeds="fuzz/corpus/${{ matrix.target }}"
          [ "${{ matrix.target }}" = tls_flight_small_records ] && seeds="fuzz/corpus/tls_flight"
          bash ../scripts/ci-annotate.sh "atheris ${{ matrix.target }}" \
            python -m fuzz.atheris_targets "${{ matrix.target }}" \
              -max_total_time="$FUZZ_SECONDS" -timeout=20 -rss_limit_mb=2048 -max_len=65536 \
              -artifact_prefix=artifacts/ -print_final_stats=1 work/corpus "$seeds"

      - name: Upload the crashing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: backend/artifacts/
          if-no-files-found: ignore
