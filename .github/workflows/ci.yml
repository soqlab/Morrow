name: CI

on:
  pull_request:
  push:
    branches: [main, Sprint*]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: morrow
          POSTGRES_PASSWORD: morrow
          POSTGRES_DB: morrow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U morrow -d morrow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PYTHONPATH: .
      MORROW_MAIN_DB_BACKEND: postgres
      DATABASE_URL: postgresql://morrow:morrow@localhost:5432/morrow
      MORROW_PRODUCT_DATABASE_URL: postgresql://morrow:morrow@localhost:5432/morrow
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/1
      # Must be a valid Fernet key: 32 raw bytes, url-safe base64 encoded. The previous value
      # ("ci-test-master-key-32-bytes-long!!") is 34 characters of non-base64 text, so
      # Fernet() rejected it with "Fernet key must be 32 url-safe base64-encoded bytes" — and
      # because backend/conftest.py sets its key with os.environ.setdefault, this invalid value
      # won over the valid one, failing vault-backed tests in CI while they passed locally.
      # This is base64url of b"pqc-scanner-test-only-key-32byte" — a throwaway, never a real key.
      MORROW_VAULT_MASTER_KEY: cHFjLXNjYW5uZXItdGVzdC1vbmx5LWtleS0zMmJ5dGU=
      MORROW_AUTH_REQUIRED: "0"
      MORROW_DEFAULT_ROLE: admin
      # Runs the dual-backend feature-store tests against the postgres service
      # above instead of skipping them. Without this the tests that prove a
      # migrated module behaves identically on both engines skip silently, and CI
      # goes green on exactly the bug they exist to catch (a constraint failure
      # aborts the transaction on Postgres but not on SQLite).
      # See docs/FEATURE_STORE_POSTGRES_MIGRATION.md.
      MORROW_TEST_PG_DSN: postgresql://morrow:morrow@localhost:5432/morrow

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reject generated runtime artifacts
        run: |
          tracked="$(git -C .. ls-files 'backend/*.db' 'backend/*.db-shm' 'backend/*.db-wal' 'backend/celerybeat-schedule' 'demo/video/*.mp4')"
          if [ -n "$tracked" ]; then
            echo "Generated runtime artifacts must not be tracked:"
            echo "$tracked"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.lock

      - name: Install dependencies
        run: |
          # The hashed locks, the same files the images install (Linux, Python 3.11).
          python -m pip install --require-hashes --only-binary :all: --no-deps -r requirements-bootstrap.lock
          pip install --require-hashes --only-binary :all: --no-deps -r requirements-dev.lock

      - name: Validate Python syntax
        run: |
          python - <<'PY'
          import subprocess
          import pathlib
          files = subprocess.check_output(["git", "-C", "..", "ls-files", "backend/*.py"], text=True).splitlines()
          for rel in files:
              path = pathlib.Path("..") / rel
              compile(path.read_text(encoding="utf-8-sig"), str(path), "exec")
          PY

      - name: Check whitespace and conflict markers
        working-directory: .
        run: git diff --check

      - name: Run Alembic migrations
        run: |
          # The baseline revision is a stamp; later revisions require core tables.
          python -c "import db; db.init_db()"
          alembic upgrade head

      - name: Run tests
        # Each failure is also raised as an annotation: the job log needs a sign-in, the checks
        # list does not.
        shell: bash
        run: |
          set +e
          pytest -x -q --tb=short -rfE 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          grep -E '^(FAILED|ERROR) ' pytest.log | cut -c1-900 | sed 's/^/::error title=pytest::/'
          exit $status

      - name: Run platform admin readiness tests
        run: pytest -q test_platform_admin_readiness.py -o "filterwarnings=default"

      - name: Exercise real vault storage and Redis rate limits
        env:
          MORROW_MAIN_DB_BACKEND: sqlite
          MORROW_FEATURE_STORE_BACKEND: sqlite
          MORROW_TEST_REDIS_URL: redis://localhost:6379/1
        run: |
          pytest -q test_integration_secrets.py test_redis_integration.py --junitxml=service-tests.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = ET.parse("service-tests.xml").findall(".//testcase")
          assert cases and all(case.find("skipped") is None for case in cases), "Service integrations must run, not skip"
          PY

  browser-smoke:
    name: Browser smoke
    # Pinned: `playwright install --with-deps` installs system packages by name, and the Ubuntu 26
    # image that ubuntu-latest moved to renamed some of them, so the step failed before the app started.
    # Move back to ubuntu-latest once Playwright lists Ubuntu 26 as supported.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: .

    env:
      MORROW_PLATFORM_ADMIN_KEY: ci-platform-admin-key-32-chars-min
      MORROW_E2E_PLATFORM_KEY: ci-platform-admin-key-32-chars-min
      MORROW_ALLOW_PLATFORM_KEY_QUERY: "0"
      MORROW_ENVIRONMENT: local
      MORROW_AUTH_REQUIRED: "0"
      MORROW_DEFAULT_ROLE: admin
      # One browser drives every console view from one IP, well past the per-IP limit of 240 a
      # minute, and then fails on 429s instead of on the UI. The limiter has its own tests.
      MORROW_RATE_LIMIT_MAX_REQUESTS: "100000"
      MORROW_RATE_LIMIT_DEFAULT: 100000/minute

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.lock

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install Python dependencies
        working-directory: backend
        run: |
          # The hashed locks, the same files the images install (Linux, Python 3.11).
          python -m pip install --require-hashes --only-binary :all: --no-deps -r requirements-bootstrap.lock
          pip install --require-hashes --only-binary :all: --no-deps -r requirements-dev.lock

      - name: Install Playwright
        run: |
          mkdir -p .tools/video
          npm install --prefix .tools/video playwright@1.60.0
          npx --prefix .tools/video playwright install --with-deps chromium

      - name: Start local API
        working-directory: backend
        run: |
          python -m uvicorn app:app --host 127.0.0.1 --port 8001 > ../uvicorn.log 2>&1 &
          echo $! > ../uvicorn.pid
          for i in {1..45}; do
            if curl -fsS http://127.0.0.1:8001/status >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat ../uvicorn.log
          exit 1

      - name: Run E2E browser smoke
        env:
          MORROW_E2E_BASE_URL: http://127.0.0.1:8001
        timeout-minutes: 15
        run: bash scripts/ci-annotate.sh e2e-smoke.js node scripts/e2e-smoke.js

      - name: Verify the live instrument (no ambient motion, this origin only)
        env:
          MORROW_E2E_BASE_URL: http://127.0.0.1:8001
        timeout-minutes: 10
        run: bash scripts/ci-annotate.sh instrument-smoke.js node scripts/instrument-smoke.js

      - name: Verify sign-up, joining and recovery without email
        env:
          MORROW_E2E_BASE_URL: http://127.0.0.1:8001
        timeout-minutes: 10
        run: bash scripts/ci-annotate.sh signup-smoke.js node scripts/signup-smoke.js

      - name: Verify console workspace and public experience
        env:
          MORROW_E2E_BASE_URL: http://127.0.0.1:8001
        timeout-minutes: 10
        run: bash scripts/ci-annotate.sh console-workspace-smoke.js node scripts/console-workspace-smoke.js

      - name: Verify customer AI data controls
        env:
          MORROW_TEST_PYTHON: python
        timeout-minutes: 10
        run: bash scripts/ci-annotate.sh test-data-control-ui.cjs node scripts/test-data-control-ui.cjs

      - name: Verify admin workspace behavior
        env:
          MORROW_E2E_BASE_URL: http://127.0.0.1:8001
        timeout-minutes: 10
        run: bash scripts/ci-annotate.sh admin-workspace-smoke.js node scripts/admin-workspace-smoke.js

      - name: Verify gateway workspace and customer journey runner
        env:
          MORROW_E2E_BASE_URL: http://127.0.0.1:8001
        timeout-minutes: 15
        run: |
          bash scripts/ci-annotate.sh gateway-workspace-smoke.js node scripts/gateway-workspace-smoke.js
          bash scripts/ci-annotate.sh gateway-journeys-smoke.js node scripts/gateway-journeys-smoke.js

      - name: Verify nothing moves on its own on any surface
        env:
          MORROW_E2E_BASE_URL: http://127.0.0.1:8001
        timeout-minutes: 10
        run: bash scripts/ci-annotate.sh motion-smoke.js node scripts/motion-smoke.js

      - name: Verify local launch guardrails
        shell: pwsh
        run: ./scripts/verify-cloud-deployment.ps1 -BaseUrl http://127.0.0.1:8001 -PlatformKey $env:MORROW_PLATFORM_ADMIN_KEY -ExpectLocalNoGo

      - name: Upload API log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-smoke-uvicorn-log
          path: uvicorn.log

  gateway:
    name: Real gateway WAF and reverse proxy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum
      - name: Verify formatting and module checksums
        run: |
          test -z "$(gofmt -l *.go)"
          go mod verify
      - name: Exercise actual Coraza, TLS proxy, expiry, rollback, and failure modes
        run: go test -race -p 2 -timeout 180s ./...
      - name: Validate deployment manifest and build hardened image
        run: |
          docker compose config --quiet
          docker build -t airlock-website-gateway:ci .
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Verify the built image, signed protocol, and HAProxy failover
        working-directory: .
        run: |
          python -m pip install cryptography
          python scripts/gateway-runtime-smoke.py --image airlock-website-gateway:ci

  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.lock

      # Fails fast when a requirements*.txt pin changes without the hashed lock the images and CI
      # install (fix: sh scripts/release/lock-requirements.sh). Standard library only.
      - name: Lock files agree with the requirement files
        working-directory: .
        run: python -I scripts/release/check_locks.py

      - name: Install lint tools
        run: pip install ruff

      # Rules and exclusions live in backend/ruff.toml so the same command runs locally and in CI.
      # Passing --select/--ignore here overrode that file, and the resulting ruleset reported 441
      # violations, so this job failed on every commit and signalled nothing.
      - name: Ruff check
        run: ruff check .
