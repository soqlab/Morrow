name: Security

on:
  pull_request:
  push:
    branches: [main, Sprint*]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  python-security:
    name: Python security checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install scanners
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit

      - name: Bandit static analysis
        run: |
          bandit -r . \
            -x ".venv,tests,__pycache__,alembic/versions" \
            -ll \
            -f json \
            -o bandit-report.json

      - name: pip-audit dependency scan
        run: |
          pip-audit -r requirements.txt -f json -o pip-audit-report.json

      - name: Upload security artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-security-reports
          path: |
            backend/bandit-report.json
            backend/pip-audit-report.json

  image-dependencies:
    name: Built image startup and Python dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Build the actual production image
        run: docker build -t pq-security-check backend
      - name: Verify isolated image startup and fail-closed production entrypoint
        run: python scripts/test-production-image.py --image pq-security-check --output-dir image-smoke
      - name: Inventory the complete installed environment
        run: |
          docker run --rm --network none pq-security-check python -m pip check
          docker run --rm --network none pq-security-check python -m pip list --format=json > image-packages.json
          python - <<'PY'
          import json
          from pathlib import Path
          packages = json.loads(Path("image-packages.json").read_text())
          assert packages, "The image package inventory must not be empty"
          Path("image-requirements.txt").write_text(
              "\n".join(f"{item['name']}=={item['version']}" for item in packages) + "\n"
          )
          PY
      - name: Audit base-image tools and all runtime transitives
        run: |
          python -m pip install --upgrade pip pip-audit
          # This is the complete image inventory, not just direct requirements.
          pip-audit --no-deps --disable-pip -r image-requirements.txt -f json -o image-audit.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: production-image-python-audit
          path: |
            image-packages.json
            image-requirements.txt
            image-audit.json
            image-smoke/

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The gitleaks CLI rather than gitleaks/gitleaks-action: the action requires a paid
      # GITLEAKS_LICENSE secret for repositories owned by an organization and failed without one.
      # The binary is MIT licensed, pinned and checksum-verified. It scans the full history;
      # reviewed false positives are allowlisted, each with a reason, in .gitleaks.toml.
      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          rm "$archive"

      - name: Run Gitleaks
        run: |
          "$RUNNER_TEMP/gitleaks" git . --config .gitleaks.toml --redact --verbose

  dockerfile-scan:
    name: Dockerfile and IaC scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Trivy config scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          # Reviewed false positives, each scoped to one file with the reason.
          trivyignores: .trivyignore.yaml
