name: Security

on:
  pull_request:
  push:
    branches: [main, Sprint*]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  python-security:
    name: Python security checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install scanners
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit

      - name: Bandit static analysis
        run: |
          bandit -r . \
            -x ".venv,tests,__pycache__,alembic/versions" \
            -ll \
            -f json \
            -o bandit-report.json

      - name: pip-audit dependency scan
        run: |
          pip-audit -r requirements.txt -f json -o pip-audit-report.json

      - name: Upload security artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-security-reports
          path: |
            backend/bandit-report.json
            backend/pip-audit-report.json

  image-dependencies:
    name: Built image startup and Python dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build the actual production image
        run: docker build -t pq-security-check backend
      - name: Verify isolated image startup and fail-closed production entrypoint
        run: python scripts/test-production-image.py --image pq-security-check --output-dir image-smoke
      - name: Inventory the complete installed environment
        run: |
          docker run --rm --network none pq-security-check python -m pip check
          docker run --rm --network none pq-security-check python -m pip list --format=json > image-packages.json
          python - <<'PY'
          import json
          from pathlib import Path
          packages = json.loads(Path("image-packages.json").read_text())
          assert packages, "The image package inventory must not be empty"
          Path("image-requirements.txt").write_text(
              "\n".join(f"{item['name']}=={item['version']}" for item in packages) + "\n"
          )
          PY
      - name: Audit base-image tools and all runtime transitives
        run: |
          python -m pip install --upgrade pip pip-audit
          # This is the complete image inventory, not just direct requirements.
          pip-audit --no-deps --disable-pip -r image-requirements.txt -f json -o image-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-image-python-audit
          path: |
            image-packages.json
            image-requirements.txt
            image-audit.json
            image-smoke/

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dockerfile-scan:
    name: Dockerfile and IaC scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy config scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: config
          scan-ref: .
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
