# Production Morrow runs on Render (render.yaml), not on GCP. This workflow and the Terraform in
# infra/gcp are kept for a self-hosted Cloud Run deployment, so it runs only when started by hand.
# It used to run on every push to main and failed within seconds because this repository has no
# GCP credentials configured.
name: Deploy to GCP Cloud Run

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: production
        type: choice
        options: [production, staging]

env:
  REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  ARTIFACT_REGISTRY: ${{ vars.GCP_ARTIFACT_REGISTRY }}
  IMAGE_NAME: morrow

jobs:
  preflight:
    name: Check GCP configuration
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require the GCP secrets and variables
        env:
          WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          ARTIFACT_REGISTRY: ${{ vars.GCP_ARTIFACT_REGISTRY }}
        run: |
          missing=""
          [ -n "$WIF_PROVIDER" ] || missing="$missing secret:GCP_WORKLOAD_IDENTITY_PROVIDER"
          [ -n "$SERVICE_ACCOUNT" ] || missing="$missing secret:GCP_SERVICE_ACCOUNT"
          [ -n "$PROJECT_ID" ] || missing="$missing variable:GCP_PROJECT_ID"
          [ -n "$ARTIFACT_REGISTRY" ] || missing="$missing variable:GCP_ARTIFACT_REGISTRY"
          if [ -n "$missing" ]; then
            echo "::error::GCP deployment is not configured for this repository. Missing:$missing. Production runs on Render (render.yaml); set these under Settings > Secrets and variables > Actions only to deploy to your own Cloud Run project."
            exit 1
          fi

  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: preflight
    permissions:
      contents: read
      id-token: write

    outputs:
      image: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Authenticate to GCP
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.ARTIFACT_REGISTRY }} --quiet

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.ARTIFACT_REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  migrate:
    name: Run DB Migrations
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Run migrations via Cloud Run Job
        run: |
          gcloud run jobs execute ${{ vars.GCP_MIGRATE_JOB_NAME || 'pq-migrate' }} \
            --region=${{ env.REGION }} \
            --update-env-vars=APP_COMPONENT=migrate \
            --wait

  deploy:
    name: Deploy API
    runs-on: ubuntu-latest
    needs: [build-and-push, migrate]
    permissions:
      contents: read
      id-token: write

    environment:
      name: ${{ github.event.inputs.environment || 'production' }}
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3.0.1
        with:
          service: ${{ vars.GCP_API_SERVICE_NAME || 'morrow-api' }}
          region: ${{ env.REGION }}
          image: ${{ needs.build-and-push.outputs.image }}

      - name: Verify liveness probe
        run: |
          STATUS=$(curl -fsS -o /dev/null -w "%{http_code}" "${{ steps.deploy.outputs.url }}/healthz")
          echo "Health check returned: $STATUS"
          test "$STATUS" = "200"
