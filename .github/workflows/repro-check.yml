# Two independent builds of the same commit, compared byte for byte.
#
# Each `build` job runs on its own fresh runner with no cache and builds everything a release
# publishes, without pushing: both images (scripts/release/build-image.sh), their SBOMs and the
# Python SBOM (scripts/release/sboms.sh), and the offline bundle (deploy/internal/make-bundle.sh).
# The `compare` job then checks that both runs produced the same digests and checksums. A match is
# a ::notice with the digest (so the result is public in the run's annotations); a mismatch is an
# ::error, and for an image scripts/release/diff_oci.py prints exactly which layer and file differ.
#
# This checks reproducibility of the build itself before a release; reproduce.yml checks a
# published release against its assets.

name: Reproducibility check

on:
  push:
    branches: [reproducible-release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repro-check-${{ github.ref }}
  cancel-in-progress: true

env:
  VERSION: 0.0.0-repro

jobs:
  build:
    name: Build ${{ matrix.run }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        run: [a, b]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Images
        env:
          OUT_DIR: out
        run: |
          sh scripts/release/build-image.sh api "$VERSION"
          sh scripts/release/build-image.sh all-in-one "$VERSION"

      - name: SBOMs
        run: |
          sh scripts/release/sboms.sh image "out/morrow-$VERSION.oci.tar" ghcr.io/soqlab/morrow "$VERSION" \
            "out/morrow-$VERSION-image.cdx.json"
          sh scripts/release/sboms.sh image "out/morrow-$VERSION-api.oci.tar" ghcr.io/soqlab/morrow "$VERSION-api" \
            "out/morrow-$VERSION-api-image.cdx.json"
          sh scripts/release/sboms.sh python "$VERSION" "out/morrow-$VERSION-python.cdx.json"

      - name: Offline bundle
        run: |
          MORROW_OCI_ARCHIVE="out/morrow-$VERSION.oci.tar" MORROW_BUNDLE_VERSION="$VERSION" \
            sh deploy/internal/make-bundle.sh
          mv "dist/morrow-offline-$VERSION.tar.gz" out/

      - name: Digests and checksums
        run: |
          cd out
          {
            echo "image:all-in-one $(cat digest-all-in-one.txt)"
            echo "image:api $(cat digest-api.txt)"
          } > DIGESTS
          sha256sum -- *.cdx.json morrow-offline-*.tar.gz *.oci.tar > SHA256SUMS
          cat DIGESTS SHA256SUMS | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repro-${{ matrix.run }}
          path: |
            out/DIGESTS
            out/SHA256SUMS
            out/*.cdx.json
            out/*.metadata.json
          if-no-files-found: error

      # Only needed to explain a mismatch; kept for a short while.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repro-${{ matrix.run }}-archives
          path: |
            out/*.oci.tar
            out/morrow-offline-*.tar.gz
          retention-days: 3
          compression-level: 0

  compare:
    name: Compare the two builds
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: repro-*
          path: runs

      - name: Compare
        run: |
          fail=0
          compare() {  # compare <file> <what>
            awk '{print $2, $1}' "runs/repro-a/$1" | sort > a.txt
            awk '{print $2, $1}' "runs/repro-b/$1" | sort > b.txt
            join -a1 -a2 -e MISSING -o 0,1.2,2.2 a.txt b.txt | while read -r name x y; do
              if [ "$x" = "$y" ]; then
                echo "::notice title=Reproducible $2::$name $x"
              else
                echo "::error title=Not reproducible $2::$name: build a $x, build b $y"
                echo "$name" >> mismatches.txt
              fi
            done
          }
          # DIGESTS is "<what> <digest>"; swap so both files are "<digest> <name>" like SHA256SUMS.
          for r in a b; do awk '{print $2, $1}' "runs/repro-$r/DIGESTS" > "runs/repro-$r/DIGESTS.swapped"; done
          compare DIGESTS.swapped "image"
          compare SHA256SUMS "file"
          if [ -s mismatches.txt ]; then
            echo "Mismatches:"; cat mismatches.txt
            exit 1
          fi
          echo "Both builds are byte-identical."

      - name: Download the archives to explain the mismatch
        if: failure()
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: repro-*-archives
          path: archives

      - name: Where the images differ
        if: failure()
        run: |
          for f in archives/repro-a-archives/*.oci.tar; do
            n="$(basename "$f")"
            echo "== $n"
            python3 -I scripts/release/diff_oci.py "$f" "archives/repro-b-archives/$n" | tee -a "$GITHUB_STEP_SUMMARY" || true
          done
          for n in $(cd runs/repro-a && ls *.cdx.json); do
            diff -u "runs/repro-a/$n" "runs/repro-b/$n" | head -60 || true
          done
