# The workflow that must pass on a clean checkout with no secrets configured.
#
# ci.yml is the full matrix: Postgres and Redis services, Playwright browser smokes, the Go
# gateway, a Docker build. It is thorough and slow, and it needs services to be up.
#
# This one is the contract for a contributor's fork: it clones the repository, installs
# dependencies and runs the suite and the linter with no credentials, no database server and
# no network services. Nothing here reads a GitHub secret, so it runs identically on a pull
# request from a fork, where secrets are unavailable by design. If this goes red, the project
# is broken for newcomers.
#
# Tests that need a real Postgres, Redis or third-party API must skip cleanly rather than
# fail -- MORROW_TEST_PG_DSN and MORROW_TEST_REDIS_URL are deliberately not set here.

name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12"]
        include:
          # One Windows run: the project is developed on Windows and several paths
          # (SQLite file handling, path separators in the scanners) differ there.
          - os: windows-latest
            python-version: "3.11"
    defaults:
      run:
        working-directory: backend

    env:
      PYTHONPATH: .
      # SQLite needs nothing installed. backend/conftest.py redirects the database to a
      # temporary file per session, so no repository file is written.
      MORROW_MAIN_DB_BACKEND: sqlite
      MORROW_ENVIRONMENT: local
      MORROW_AUTH_REQUIRED: "0"
      MORROW_DEFAULT_ROLE: admin
      # No external model is contacted: with no provider credential the AI layer falls back
      # to its offline rule engine, and this forbids an outbound call outright.
      MORROW_LLM_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Reject generated runtime artifacts
        shell: bash
        working-directory: .
        run: |
          # A committed database or rendered video would bloat every clone forever, and the
          # demo database is reproducible from demo/video/seed-demo-data.py.
          tracked="$(git ls-files \
            'backend/*.db' 'backend/*.db-shm' 'backend/*.db-wal' \
            'backend/celerybeat-schedule' \
            'demo/video/*.mp4' 'demo/video/*.wav' 'demo/video/*.webm' 'demo/video/demo.db*')"
          if [ -n "$tracked" ]; then
            echo "::error::Generated runtime artifacts must not be tracked:"
            echo "$tracked"
            exit 1
          fi

      - name: Reject committed secrets
        shell: bash
        working-directory: .
        run: |
          # A real .env must never be tracked. Templates are, and must stay placeholders.
          leaked="$(git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.' | grep -v '\.example' || true)"
          if [ -n "$leaked" ]; then
            echo "::error::Environment files must not be tracked (only *.example):"
            echo "$leaked"
            exit 1
          fi

      - name: Validate Python syntax
        shell: bash
        run: |
          python - <<'PY'
          import pathlib, subprocess, sys
          files = subprocess.check_output(["git", "ls-files", "*.py"], text=True).splitlines()
          bad = 0
          for rel in files:
              p = pathlib.Path(rel)
              try:
                  compile(p.read_text(encoding="utf-8-sig"), rel, "exec")
              except SyntaxError as e:
                  print(f"::error file={rel},line={e.lineno}::{e.msg}")
                  bad += 1
          sys.exit(1 if bad else 0)
          PY

      - name: Check whitespace and conflict markers
        working-directory: .
        run: git diff --check

      - name: Run tests
        # No -x: a contributor is better served by the full list of what failed.
        run: pytest -q --tb=short -rf

      - name: Confirm the server starts with no configuration at all
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          # The first-run contract from the README: a clean clone with no .env must serve,
          # fall back to SQLite, and report what is missing instead of crashing.
          python -m uvicorn app:app --host 127.0.0.1 --port 8052 > /tmp/firstrun.log 2>&1 &
          pid=$!
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8052/status >/dev/null 2>&1; then ok=1; break; fi
            if ! kill -0 $pid 2>/dev/null; then break; fi
            sleep 2
          done
          if [ "${ok:-0}" != "1" ]; then
            echo "::error::An unconfigured server did not come up"
            cat /tmp/firstrun.log
            exit 1
          fi
          curl -fsS http://127.0.0.1:8052/status
          # /health/deep must name the missing settings rather than reporting a bare failure.
          curl -fsS http://127.0.0.1:8052/health/deep | tee /tmp/deep.json
          grep -q security_warnings /tmp/deep.json || {
            echo "::error::/health/deep did not report configuration warnings"; exit 1; }
          for path in / /ui/ /launch; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8052$path")
            [ "$code" = "200" ] || { echo "::error::$path returned $code"; exit 1; }
          done
          kill $pid 2>/dev/null || true

      - name: Upload startup log
        if: failure() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: firstrun-log-${{ matrix.python-version }}
          path: /tmp/firstrun.log
          if-no-files-found: ignore

  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Pinned so a new ruff release cannot turn a green pull request red without a commit.
      - name: Install ruff
        run: pip install ruff==0.16.3

      # Rules and per-file exclusions live in backend/ruff.toml so the same command runs
      # locally and here. Passing --select/--ignore on the command line overrides that file.
      - name: Ruff check
        run: ruff check --output-format=github .

  quickstart:
    name: Quick start (docker compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The README's first instruction. If this breaks, nobody gets as far as the product.
      - name: docker compose up, from a clean checkout with no .env
        run: |
          test ! -f backend/.env || { echo "::error::backend/.env must not exist in a clone"; exit 1; }
          docker compose up -d --build --wait --wait-timeout 420

      - name: Probe the console
        run: |
          for path in /status /health/deep / /ui/ /launch; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8001$path")
            echo "$code $path"
            [ "$code" = "200" ] || { echo "::error::$path returned $code"; exit 1; }
          done

      - name: Seed the example workspace
        run: docker compose run --rm seed

      - name: Confirm the seeded estate is readable
        run: |
          assets=$(curl -fsS -H 'x-user-role: admin' 'http://localhost:8001/assets?limit=200')
          echo "$assets" | head -c 300
          echo "$assets" | grep -q 'example.com' || {
            echo "::error::Seeded assets missing after the seed step"; exit 1; }
          curl -fsS -H 'x-user-role: admin' 'http://localhost:8001/cbom' -o /dev/null

      - name: Container logs
        if: always()
        run: docker compose logs --no-color | tail -120

      - name: Tear down
        if: always()
        run: docker compose down -v
