# Production compose — requires a managed Postgres URL (Railway, Supabase, Neon, etc.)
# Copy .env.prod.example → .env.prod, fill in secrets, then:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# Services: api (HTTP), worker (Celery), beat (scheduler), redis (broker).
# The worker and beat run the same image with APP_COMPONENT switched — see
# backend/entrypoint.sh. Without them the API still serves, but scans and remediation
# jobs fall back to running in-process, which is not restart-safe.
#
# Verify a filled-in .env.prod before deploying:
#   set -a && . ./.env.prod && set +a
#   python -c "import app; print(app._production_startup_blockers() or 'config OK')"

x-api-env: &api-env
  # Runtime. PQC_ENVIRONMENT is what activates the production safety checks in
  # app.py; an earlier revision of this file set PRODUCTION_ENVIRONMENT, which the
  # application never reads, so those checks silently never ran.
  PQC_ENVIRONMENT: "${PQC_ENVIRONMENT:-production}"
  HOST: "0.0.0.0"
  # PORT is what uvicorn binds inside the container. The published mapping and the healthcheck below
  # must use this same value: the mapping was previously "${PORT:-8000}:8000" with the container port
  # hardcoded, so setting PORT to anything but 8000 published to a port nothing listened on. The API
  # was unreachable from outside and the healthcheck (also hardcoded to 8000) never passed, leaving
  # the container permanently unhealthy — which an orchestrator answers by restarting it forever.
  PORT: "${PORT:-8000}"
  AUTO_MIGRATE: "${AUTO_MIGRATE:-0}"
  PQC_API_REPLICA_COUNT: "${PQC_API_REPLICA_COUNT:-1}"
  PQC_AUXILIARY_STATE_MIGRATED: "${PQC_AUXILIARY_STATE_MIGRATED:-0}"

  # Database — managed Postgres required in production
  DATABASE_URL: "${DATABASE_URL}"
  PQC_PRODUCT_DATABASE_URL: "${PQC_PRODUCT_DATABASE_URL:-${DATABASE_URL}}"
  PQC_MAIN_DB_BACKEND: "postgres"
  # Auxiliary feature tables. Unset it follows PQC_MAIN_DB_BACKEND; set it
  # explicitly while migrating modules. See
  # docs/FEATURE_STORE_POSTGRES_MIGRATION.md.
  PQC_FEATURE_STORE_BACKEND: "${PQC_FEATURE_STORE_BACKEND:-}"

  # Task queue — durable scans and remediation jobs
  CELERY_BROKER_URL: "${CELERY_BROKER_URL:-redis://:${REDIS_PASSWORD}@redis:6379/0}"
  CELERY_RESULT_BACKEND: "${CELERY_RESULT_BACKEND:-redis://:${REDIS_PASSWORD}@redis:6379/1}"

  # Auth. These must be PQC_-prefixed: AUTH_JWT_ISSUER / AUTH_JWT_AUDIENCE /
  # AUTH_JWT_JWKS_URL / CORS_ORIGINS are not read by the application, and a
  # deployment using those names had no JWT verification and wildcard CORS.
  PQC_AUTH_MODE: "jwt"
  PQC_AUTH_REQUIRED: "1"
  PQC_AUTH_JWT_ALGORITHMS: "${PQC_AUTH_JWT_ALGORITHMS:-RS256}"
  PQC_AUTH_JWT_ISSUER: "${PQC_AUTH_JWT_ISSUER}"
  PQC_AUTH_JWT_AUDIENCE: "${PQC_AUTH_JWT_AUDIENCE}"
  PQC_AUTH_JWT_JWKS_URL: "${PQC_AUTH_JWT_JWKS_URL}"
  PQC_AUTH_USER_ID_CLAIM: "${PQC_AUTH_USER_ID_CLAIM:-sub}"
  PQC_AUTH_ROLE_CLAIM: "${PQC_AUTH_ROLE_CLAIM:-role}"
  PQC_AUTH_ORG_ID_CLAIM: "${PQC_AUTH_ORG_ID_CLAIM:-org_id}"
  PQC_AUTH_CLOCK_SKEW_SECONDS: "${PQC_AUTH_CLOCK_SKEW_SECONDS:-60}"
  PQC_AUTH_ISSUER_ENABLED: "${PQC_AUTH_ISSUER_ENABLED:-0}"
  # Signing key for tokens this server issues (built-in password sign-in, refresh tokens). It was
  # documented in .env.prod.example but never passed through, so entrypoint.sh generated an ephemeral
  # key on every start: every restart or redeploy invalidated every issued token and signed users
  # out, and two replicas would reject each other's tokens outright.
  PQC_AUTH_JWT_SECRET: "${PQC_AUTH_JWT_SECRET:-}"
  # Documented escape hatches. Both were absent here too, so an operator who set them in .env.prod
  # saw no effect and had no way to override the check they are meant to override.
  PQC_ALLOW_HS256_IN_PRODUCTION: "${PQC_ALLOW_HS256_IN_PRODUCTION:-0}"
  PQC_ALLOW_UNSAFE_PRODUCTION_STARTUP: "${PQC_ALLOW_UNSAFE_PRODUCTION_STARTUP:-0}"
  PQC_AUTH_LOGIN_URL: "${PQC_AUTH_LOGIN_URL:-}"
  PQC_AUTH_LOGOUT_URL: "${PQC_AUTH_LOGOUT_URL:-}"
  PQC_AUTH_PROVIDER_NAME: "${PQC_AUTH_PROVIDER_NAME:-}"
  # Unmapped identities must remain viewers in production. Elevated access comes
  # from verified role claims, not the default role.
  PQC_DEFAULT_ROLE: "${PQC_DEFAULT_ROLE:-viewer}"
  PQC_ADMIN_EMAIL: "${PQC_ADMIN_EMAIL:-}"
  PQC_ADMIN_PASSWORD: "${PQC_ADMIN_PASSWORD:-}"

  # Operator SSO is separate from customer JWT verification. Do not require a
  # shared-key break-glass exception merely to open the production admin console.
  PQC_PUBLIC_BASE_URL: "${PQC_PUBLIC_BASE_URL}"
  PQC_ADMIN_OIDC_ISSUER: "${PQC_ADMIN_OIDC_ISSUER}"
  PQC_ADMIN_OIDC_CLIENT_ID: "${PQC_ADMIN_OIDC_CLIENT_ID}"
  PQC_ADMIN_OIDC_CLIENT_SECRET: "${PQC_ADMIN_OIDC_CLIENT_SECRET:-}"
  PQC_ADMIN_OIDC_REDIRECT_URI: "${PQC_ADMIN_OIDC_REDIRECT_URI:-}"
  PQC_ADMIN_OIDC_SCOPES: "${PQC_ADMIN_OIDC_SCOPES:-openid email profile}"
  PQC_ADMIN_OIDC_EMAIL_CLAIM: "${PQC_ADMIN_OIDC_EMAIL_CLAIM:-email}"
  PQC_ADMIN_OIDC_REQUIRE_EMAIL_VERIFIED: "1"
  PQC_ADMIN_OPERATOR_ROLES: "${PQC_ADMIN_OPERATOR_ROLES}"
  PQC_ADMIN_OIDC_ALLOWED_DOMAINS: "${PQC_ADMIN_OIDC_ALLOWED_DOMAINS:-}"
  PQC_ADMIN_OIDC_DOMAIN_ROLE: "${PQC_ADMIN_OIDC_DOMAIN_ROLE:-auditor}"
  PQC_ADMIN_REQUIRE_MFA: "1"
  PQC_ALLOW_BREAK_GLASS_KEY: "0"
  PQC_ADMIN_SESSION_ABSOLUTE_SECONDS: "${PQC_ADMIN_SESSION_ABSOLUTE_SECONDS:-28800}"
  PQC_ADMIN_SESSION_IDLE_SECONDS: "${PQC_ADMIN_SESSION_IDLE_SECONDS:-1800}"
  PQC_ADMIN_STEP_UP_SECONDS: "${PQC_ADMIN_STEP_UP_SECONDS:-900}"
  PQC_PLATFORM_OPERATORS: "${PQC_PLATFORM_OPERATORS:-}"
  PQC_PLATFORM_ADMIN_KEY_ROLE: "${PQC_PLATFORM_ADMIN_KEY_ROLE:-auditor}"

  # Security
  PQC_VAULT_MASTER_KEY: "${PQC_VAULT_MASTER_KEY}"
  PQC_PLATFORM_ADMIN_KEY: "${PQC_PLATFORM_ADMIN_KEY}"
  PQC_CORS_ALLOW_ALL: "0"
  PQC_CORS_ORIGINS: "${PQC_CORS_ORIGINS}"
  PQC_ALLOWED_HOSTS: "${PQC_ALLOWED_HOSTS}"
  PQC_CSP_ENABLED: "1"
  PQC_CSP_VALUE: "${PQC_CSP_VALUE:-default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'}"
  PQC_ALLOW_PLATFORM_KEY_QUERY: "0"
  PQC_ALLOW_DEMO_IN_PRODUCTION: "0"
  PQC_AIRLOCK_SIGNING_KEY: "${PQC_AIRLOCK_SIGNING_KEY}"
  PQC_AIRLOCK_REQUIRE_AGENT_SIGNATURE: "${PQC_AIRLOCK_REQUIRE_AGENT_SIGNATURE:-1}"
  PQC_AIRLOCK_MAX_CLOCK_SKEW_SECONDS: "${PQC_AIRLOCK_MAX_CLOCK_SKEW_SECONDS:-600}"
  PQC_TRAFFIC_MONITOR_ENABLED: "${PQC_TRAFFIC_MONITOR_ENABLED:-1}"
  PQC_TRAFFIC_PERSIST_TO_DB: "${PQC_TRAFFIC_PERSIST_TO_DB:-1}"
  PQC_TRAFFIC_EVENTS_MAX: "${PQC_TRAFFIC_EVENTS_MAX:-5000}"
  PQC_TRAFFIC_IP_MAX: "${PQC_TRAFFIC_IP_MAX:-2000}"
  PQC_TRUST_PROXY_HEADERS: "${PQC_TRUST_PROXY_HEADERS:-0}"
  PQC_AUTH_LOG_RETENTION_DAYS: "${PQC_AUTH_LOG_RETENTION_DAYS:-90}"
  PQC_TRAFFIC_RETENTION_DAYS: "${PQC_TRAFFIC_RETENTION_DAYS:-7}"
  PQC_TOKEN_REVOCATION_CACHE_SECONDS: "${PQC_TOKEN_REVOCATION_CACHE_SECONDS:-10}"
  PQC_API_KEY_CACHE_SECONDS: "${PQC_API_KEY_CACHE_SECONDS:-15}"
  PQC_MAINTENANCE_CACHE_SECONDS: "${PQC_MAINTENANCE_CACHE_SECONDS:-5}"

  # Observability — required in production
  SENTRY_DSN: "${SENTRY_DSN}"

  # AI is optional and off per organization until an admin explicitly approves it.
  ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
  # Agent tuning. Passed through so an operator who sets these in .env.prod sees
  # an effect -- the defaults live in services/ai_agent.py.
  ANTHROPIC_AGENT_MODEL: "${ANTHROPIC_AGENT_MODEL:-}"
  ANTHROPIC_AGENT_EFFORT: "${ANTHROPIC_AGENT_EFFORT:-}"
  ANTHROPIC_AGENT_MAX_TOKENS: "${ANTHROPIC_AGENT_MAX_TOKENS:-}"
  AGENT_TIMEOUT: "${AGENT_TIMEOUT:-}"
  OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
  OPENAI_MODEL: "${OPENAI_MODEL:-}"
  OPENAI_AGENT_MODEL: "${OPENAI_AGENT_MODEL:-}"
  PQC_AI_DEPLOYMENT_LOCATION: "${PQC_AI_DEPLOYMENT_LOCATION:-platform}"
  PQC_AI_LOCAL_URL: "${PQC_AI_LOCAL_URL:-}"
  PQC_AI_LOCAL_MODEL: "${PQC_AI_LOCAL_MODEL:-}"
  PQC_AI_LOCAL_API_KEY: "${PQC_AI_LOCAL_API_KEY:-}"

  # GitHub OAuth (optional)
  GITHUB_CLIENT_ID: "${GITHUB_CLIENT_ID:-}"
  GITHUB_CLIENT_SECRET: "${GITHUB_CLIENT_SECRET:-}"
  GITHUB_CALLBACK_URL: "${GITHUB_CALLBACK_URL:-}"

x-logging: &logging
  driver: "json-file"
  options:
    max-size: "20m"
    max-file: "5"

x-runtime-hardening: &runtime-hardening
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

# The core tables (assets, scans, scan_results, remediations, organizations, audit_logs, ...) live
# in Postgres. A number of later features — the TLS observatory, canaries, QTISN, maturity model,
# regulatory filings, autopilot, ZK proofs, and built-in password accounts among them — are still
# SQLite-backed and open the path in PQC_SCANNER_DB.
#
# db._default_db_path() prefers /data/pqc_scanner.db when /data exists, so mounting this volume is
# what keeps that state across a redeploy. Without it the file sits on the container filesystem and
# every one of those features is silently reset when the container is replaced.
#
# Note the consequence for scaling: this volume is shared by api/worker/beat in a single-host
# deployment, but SQLite is not a network database. Do not run multiple api replicas against it —
# use one replica until those features are moved to Postgres.
x-sqlite-state: &sqlite-state
  - pqc-sqlite-state:/data

services:
  api:
    <<: *runtime-hardening
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: pqc-scanner:latest
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      # Same value on both sides: the container binds PORT (see x-api-env), so the container side of
      # the mapping cannot be hardcoded.
      - "${PQC_LISTEN_ADDRESS:-127.0.0.1}:${PORT:-8000}:${PORT:-8000}"
    environment:
      <<: *api-env
      APP_COMPONENT: "api"
      # WORKER_ROLE, not ENABLE_INPROCESS_SCHEDULER, is what app.py reads to disable the legacy
      # in-process schedule loop (_start_scheduler). backend/compose.yml sets it and this file did
      # not, so the API container here ran its own schedule loop alongside celery beat: every
      # scheduled scan fired twice, once per replica plus once from beat.
      WORKER_ROLE: "api"
    volumes: *sqlite-state   # volume for api
    healthcheck:
      # Must probe the port the app actually binds, not a hardcoded 8000.
      test: ["CMD-SHELL", "curl -sf http://localhost:${PORT:-8000}/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging: *logging

  worker:
    <<: *runtime-hardening
    image: pqc-scanner:latest
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_started
    environment:
      <<: *api-env
      APP_COMPONENT: "worker"
      WORKER_ROLE: "worker"
    volumes: *sqlite-state   # volume for worker
    healthcheck:
      test: ["CMD-SHELL", "celery -A tasks.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 40s
    logging: *logging

  beat:
    <<: *runtime-hardening
    image: pqc-scanner:latest
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      <<: *api-env
      APP_COMPONENT: "beat"
      WORKER_ROLE: "beat"
      BEAT_SCHEDULE_PATH: "/tmp/celerybeat-schedule"
    volumes: *sqlite-state   # volume for beat
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # requirepass, so the broker URL is never credential-free (a passwordless broker
    # raises a security advisory at startup).
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging: *logging

volumes:
  redis-data:
  pqc-sqlite-state:
