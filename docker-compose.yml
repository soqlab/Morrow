# Quick start. Runs the whole platform from a clean clone with no configuration:
#
#     docker compose up --build          # console on http://localhost:8001
#     docker compose run --rm seed       # optional: fill it with an example estate
#
# There is deliberately no .env to create and no Postgres or Redis to start. The
# API falls back to SQLite in a named volume, scans run in-process, and the two
# settings that would be unsafe on a network (header auth, default admin role)
# are set explicitly here so GET /health/deep reports them rather than hiding
# them. This file is for trying the product and developing against it.
#
# For a real deployment use docker-compose.prod.yml with .env.prod.example,
# which brings managed Postgres, Redis, external SSO and a strict CSP.

services:
  app:
    build:
      context: ./backend
    image: airlock-command:local
    ports:
      - "8001:8000"
    environment:
      # The Dockerfile defaults this to postgres for production. Override it:
      # the point of this file is that nothing else has to be running.
      PQC_MAIN_DB_BACKEND: sqlite
      PQC_SCANNER_DB: /data/pqc_scanner.db
      PQC_ENVIRONMENT: local

      # Local-only auth. Any caller can claim any role via request headers, so
      # never expose this port to a network you do not control. /health/deep
      # warns about both of these on purpose.
      PQC_AUTH_MODE: headers
      PQC_AUTH_REQUIRED: "0"
      PQC_DEFAULT_ROLE: admin
      PQC_CORS_ALLOW_ALL: "1"

      # Creates a signed-in account on first start so the console has a real
      # workspace and the seeder below can log in. Throwaway credentials for a
      # throwaway local database.
      PQC_ADMIN_EMAIL: avery.chen@example.com
      PQC_ADMIN_PASSWORD: Airlock-Demo-Recording-8049

      # Applies the Alembic revisions on boot. Convenient here, never in prod.
      AUTO_MIGRATE: "1"
      ENABLE_INPROCESS_SCHEDULER: "1"
      PORT: "8000"
      HOST: 0.0.0.0
    volumes:
      - airlock_data:/data
    healthcheck:
      # /status is unauthenticated and does not touch the scan tables, so it
      # reports ready as soon as the app can serve.
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/status').read()\""]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
    restart: unless-stopped

  # Fills the workspace with "Example Financial Group", an invented company:
  # ~40 assets on reserved example.com hostnames, five scans of history, a CBOM,
  # an HNDL model, canaries and a policy. Every row is generated by the
  # platform's own evaluation pipeline, so the dashboards are internally
  # consistent rather than hand-written numbers.
  #
  # Not a default service -- `docker compose up` leaves you an empty workspace
  # with honest empty states, which is the real first-run experience.
  seed:
    image: airlock-command:local
    profiles: ["seed"]
    depends_on:
      app:
        condition: service_healthy
    environment:
      # Must match the app service. The seeder imports backend/db.py directly for
      # the few rows that have no API, and the Dockerfile defaults this to
      # postgres -- so without it the seeder authenticated fine over HTTP and then
      # raised "PQC_PRODUCT_DATABASE_URL is required for Postgres cutover" on its
      # first direct write.
      PQC_MAIN_DB_BACKEND: sqlite
      PQC_SCANNER_DB: /data/pqc_scanner.db
      # The backend is at /app in the image, with no repo root above it.
      PQC_BACKEND_DIR: /app
      PQC_DEMO_DB: /data/pqc_scanner.db
      PQC_DEMO_BASE: http://app:8000
      PQC_DEMO_EMAIL: avery.chen@example.com
      PQC_DEMO_PASSWORD: Airlock-Demo-Recording-8049
    volumes:
      - airlock_data:/data
      # The image contains only backend/, so the seeder is mounted from the
      # checkout rather than baked in.
      - ./demo:/seed/demo:ro
    entrypoint: ["python", "/seed/demo/video/seed-demo-data.py"]
    restart: "no"

volumes:
  airlock_data:
