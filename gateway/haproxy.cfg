global
    maxconn 1024

defaults
    mode tcp
    timeout connect 2s
    timeout client 65s
    timeout server 65s

frontend https
    bind :8443
    default_backend gateways

backend gateways
    balance roundrobin
    option tcp-check
    retries 2
    option redispatch 1
    server gateway-a gateway-a:8443 check inter 2s fall 2 rise 2
    server gateway-b gateway-b:8443 check inter 2s fall 2 rise 2
