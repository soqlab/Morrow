# Hosted Morrow at morrow.soqlab.com (Render web service morrow-app). The public demo that used to
# answer there was removed: self sign-up gives anyone their own workspace in a minute.
# demo mode (backend/services/demo_mode.py) is still available for anyone who wants to run one.
services:
  # Hosted Morrow (morrow.soqlab.com): real accounts and saved scans, self sign-up.
  #
  # One Starter service runs the API, the Celery worker with beat embedded, and Redis on
  # localhost (deploy/render-hosted). All data is SQLite on the service's disk (WAL mode), so the
  # API and the worker share one file. Render snapshots the disk daily. Customer separation is
  # enforced by the application's organization scoping; Postgres row-level security, the second
  # layer, applies only on Postgres. See deploy/render-hosted/README.md.
  #
  # MORROW_ENVIRONMENT is staging, not production, until customers sign in through an external
  # identity provider: the production startup check requires an RS256 issuer with a JWKS URL, and
  # the built-in password sign-in only issues HS256 tokens. Staging keeps the operator rules
  # strict (MFA required, shared platform key refused). docs/LAUNCH_CHECKLIST.md lists the rest.
  - type: web
    name: morrow-app
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./deploy/render-hosted/Dockerfile
    dockerContext: .
    autoDeploy: true
    disk:
      name: morrow-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: MORROW_ENVIRONMENT
        value: staging
      - key: MORROW_MAIN_DB_BACKEND
        value: sqlite
      - key: MORROW_FEATURE_STORE_BACKEND
        value: sqlite
      - key: MORROW_SCANNER_DB
        value: /data/morrow.db
      - key: MORROW_DATA_DIR
        value: /data
      - key: MORROW_PUBLIC_BASE_URL
        value: https://morrow.soqlab.com
      # app.morrow.soqlab.com, the first address, forwards here.
      - key: MORROW_CANONICAL_HOST
        value: morrow.soqlab.com
      - key: MORROW_ALLOWED_HOSTS
        value: morrow.soqlab.com,app.morrow.soqlab.com,morrow-app.onrender.com
      - key: MORROW_CORS_ORIGINS
        value: https://morrow.soqlab.com,https://app.morrow.soqlab.com
      # Render's proxy sets X-Forwarded-For; without this every visitor is Render's address.
      - key: MORROW_TRUST_PROXY_HEADERS
        value: "1"
      - key: MORROW_AUTH_MODE
        value: jwt
      - key: MORROW_AUTH_REQUIRED
        value: "1"
      - key: MORROW_DEFAULT_ROLE
        value: viewer
      - key: MORROW_AUTH_ISSUER_ENABLED
        value: "1"
      - key: MORROW_AUTH_JWT_ALGORITHMS
        value: HS256
      - key: MORROW_AUTH_JWT_SECRET
        generateValue: true
      # First customer-side account (org owner). Set in the dashboard; never committed.
      - key: MORROW_ADMIN_EMAIL
        sync: false
      - key: MORROW_ADMIN_PASSWORD
        sync: false
      # Operator portal (/vendor-admin): a named key or passphrase plus an authenticator app. Set in
      # the dashboard, never here: the value holds the key's SHA-256, and for a passphrase a hash in
      # a public repository can be guessed offline. scripts/set-admin-passphrase.py prints the value.
      - key: MORROW_PLATFORM_OPERATORS
        sync: false
      - key: MORROW_ADMIN_REQUIRE_MFA
        value: "1"
      # A named key stays verified this long after its last authenticator code (default 8 hours).
      - key: MORROW_ADMIN_SESSION_ABSOLUTE_SECONDS
        value: "3600"
      - key: MORROW_ALLOW_BREAK_GLASS_KEY
        value: "0"
      - key: MORROW_PLATFORM_ADMIN_KEY
        generateValue: true
      # Decrypts stored customer credentials and MFA secrets. It must be a Fernet key
      # (Fernet.generate_key()), which generateValue does not produce, so it is set in the
      # dashboard. Keep a copy in a password manager: without it a restored backup cannot be read.
      - key: MORROW_VAULT_MASTER_KEY
        sync: false
      - key: MORROW_AIRLOCK_SIGNING_KEY
        generateValue: true
      - key: MORROW_AIRLOCK_REQUIRE_AGENT_SIGNATURE
        value: "1"
      - key: MORROW_ALLOW_PLATFORM_KEY_QUERY
        value: "0"
      - key: MORROW_CSP_ENABLED
        value: "1"
      - key: MORROW_TRAFFIC_MONITOR_ENABLED
        value: "1"
      - key: MORROW_TRAFFIC_PERSIST_TO_DB
        value: "1"
      - key: MORROW_TRIAL_API_CALLS_PER_MIN
        value: "60"
      - key: MORROW_TRIAL_SCANS_PER_HOUR
        value: "10"
      # The free checker scans hosts the requester may not own: off until the abuse mailbox and
      # legal review in docs/LAUNCH_CHECKLIST.md part 3 exist.
      - key: MORROW_PUBLIC_CHECK_ENABLED
        value: "0"
      # Email (invitations, password reset, new trial request notices) through Resend's SMTP
      # relay; soqlab.com is already verified there. MORROW_SMTP_PASSWORD is a Resend API key.
      # Plain address only: the sender is also the SMTP envelope sender.
      - key: MORROW_SMTP_HOST
        value: smtp.resend.com
      - key: MORROW_SMTP_PORT
        value: "587"
      - key: MORROW_SMTP_USER
        value: resend
      - key: MORROW_SMTP_FROM
        value: noreply@soqlab.com
      - key: MORROW_SMTP_PASSWORD
        sync: false
      # Where new trial requests are announced. Set in the dashboard.
      - key: MORROW_TRIAL_NOTIFY_EMAIL
        sync: false
      # Self sign-up: a request creates the organization and emails the invitation at once. Only
      # safe because scans are limited to domains the organization verified with a DNS record;
      # self sign-up switches itself off unless that, mail and MORROW_PUBLIC_BASE_URL are set.
      # List organizations that may scan any host in MORROW_SCAN_UNRESTRICTED_ORGS.
      - key: MORROW_SCAN_REQUIRE_VERIFIED_DOMAINS
        value: "1"
      - key: MORROW_SELF_SIGNUP
        value: "1"
      # Customer sign-in screen: email and password only, no developer token options.
      - key: MORROW_SIGNIN_SIMPLE
        value: "1"
      # Admin dashboard figures are precomputed snapshots; at this size a minute is cheap.
      - key: MORROW_ANALYTICS_SNAPSHOT_INTERVAL_SECONDS
        value: "60"
