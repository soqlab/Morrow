# Public demo of Airlock Command (airlock.soqlab.com), on Render's free tier.
#
# Each visitor gets a private, throwaway workspace with fictional sample data. Nothing is kept:
# workspaces are deleted after an hour, and the SQLite file lives on the container's ephemeral disk,
# so it is wiped whenever the instance restarts or sleeps. Outbound network is locked to localhost,
# so the demo cannot scan or contact anything. See backend/services/demo_mode.py.
#
# This is NOT a production deployment: for real use, see deploy/single-host/README.md.
services:
  - type: web
    name: airlock-demo
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PQC_DEMO_MODE
        value: "1"
      - key: PQC_DEMO_TTL_SECONDS
        value: "3600"
      - key: PQC_DEMO_MAX_WORKSPACES
        value: "25"
      - key: PQC_DEMO_STARTS_PER_IP_HOUR
        value: "5"
      - key: PQC_ENVIRONMENT
        value: local
      - key: PQC_MAIN_DB_BACKEND
        value: sqlite
      - key: PQC_SCANNER_DB
        value: /data/demo.db
      - key: PQC_DATA_DIR
        value: /data
      - key: PQC_AUTH_MODE
        value: jwt
      - key: PQC_AUTH_REQUIRED
        value: "1"
      - key: PQC_DEFAULT_ROLE
        value: viewer
      - key: PQC_AUTH_JWT_SECRET
        generateValue: true
      - key: PQC_AUTH_TOKEN_TTL_SECONDS
        value: "3600"
      - key: PQC_PUBLIC_CHECK_ENABLED
        value: "0"
      - key: PQC_ALERT_DISPATCH_ENABLED
        value: "0"
