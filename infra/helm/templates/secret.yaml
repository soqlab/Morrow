apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pqc-scanner.fullname" . }}
  labels:
    {{- include "pqc-scanner.labels" . | nindent 4 }}
type: Opaque
stringData:
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
  PQC_VAULT_MASTER_KEY: {{ .Values.secrets.pqcVaultMasterKey | quote }}
  PQC_PLATFORM_ADMIN_KEY: {{ .Values.secrets.pqcPlatformAdminKey | quote }}
  PQC_AUTH_JWT_ISSUER: {{ .Values.secrets.jwtIssuer | quote }}
  PQC_AUTH_JWT_AUDIENCE: {{ .Values.secrets.jwtAudience | quote }}
  PQC_AUTH_JWT_JWKS_URL: {{ .Values.secrets.jwksUrl | quote }}
