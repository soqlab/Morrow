apiVersion: v1
kind: Secret
metadata:
  name: {{ include "morrow.fullname" . }}
  labels:
    {{- include "morrow.labels" . | nindent 4 }}
type: Opaque
stringData:
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
  MORROW_VAULT_MASTER_KEY: {{ .Values.secrets.pqVaultMasterKey | quote }}
  MORROW_PLATFORM_ADMIN_KEY: {{ .Values.secrets.pqPlatformAdminKey | quote }}
  MORROW_AUTH_JWT_ISSUER: {{ .Values.secrets.jwtIssuer | quote }}
  MORROW_AUTH_JWT_AUDIENCE: {{ .Values.secrets.jwtAudience | quote }}
  MORROW_AUTH_JWT_JWKS_URL: {{ .Values.secrets.jwksUrl | quote }}
