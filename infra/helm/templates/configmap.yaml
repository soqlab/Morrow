apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "morrow.fullname" . }}
  labels:
    {{- include "morrow.labels" . | nindent 4 }}
data:
  PYTHONPATH: /app
  MORROW_MAIN_DB_BACKEND: postgres
  {{- if .Values.postgresql.enabled }}
  MORROW_PRODUCT_DATABASE_URL: {{ include "morrow.postgresUrl" . | quote }}
  DATABASE_URL: {{ include "morrow.postgresUrl" . | quote }}
  {{- end }}
  {{- if .Values.redis.enabled }}
  CELERY_BROKER_URL: {{ include "morrow.redisUrl" . | quote }}
  CELERY_RESULT_BACKEND: {{ printf "%s" (include "morrow.redisUrl" .) | replace "/0" "/1" | quote }}
  {{- end }}
  {{- range $k, $v := .Values.env }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
