# Fluent Bit: tail the nginx TLS log and ship it to Morrow (docs/PASSIVE_DISCOVERY.md).
# Plain HTTP to the backend container inside the e2e network; production uses tls On.
[SERVICE]
    Flush        1
    Log_Level    info

[INPUT]
    Name             tail
    Path             /var/log/morrow/nginx_tls.log
    Tag              morrow.tls
    Read_from_Head   On
    Refresh_Interval 1
    DB               /fluent-bit-db/tail.db

[OUTPUT]
    Name        http
    Match       morrow.tls
    Host        backend
    Port        8000
    URI         /v1/runtime/passive/ingest?format=nginx
    Format      json_lines
    Header      Authorization Bearer ${MORROW_INGEST_TOKEN}
    Compress    gzip
    Retry_Limit 5
