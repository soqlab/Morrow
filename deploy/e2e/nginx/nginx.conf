# nginx for the Morrow e2e stack: one TLS server whose key-exchange groups come from
# state/nginx-groups.conf (classical first; the kill-switch step rewrites it to hybrid ML-KEM and
# reloads), and the access log format from docs/PASSIVE_DISCOVERY.md, tailed by Fluent Bit.
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
events { worker_connections 256; }

http {
  log_format morrow_tls escape=json
    '{"ssl_server_name":"$ssl_server_name","server_port":"$server_port",'
    '"ssl_protocol":"$ssl_protocol","ssl_cipher":"$ssl_cipher","ssl_curve":"$ssl_curve"}';

  server {
    listen 443 ssl;
    server_name nginx.e2e.morrow.test;
    ssl_certificate     /certs/nginx.pem;
    ssl_certificate_key /certs/nginx.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    include /state/nginx-groups.conf;
    access_log /var/log/morrow/nginx_tls.log morrow_tls if=$https;
    location / { return 200 "ok\n"; }
  }
}
