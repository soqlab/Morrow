[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "morrow-mcp"
version = "0.1.0"
description = "Read-only answers from your self-hosted Morrow, for your own AI assistant over MCP (stdio)."
readme = "README.md"
license = { text = "AGPL-3.0-only" }
requires-python = ">=3.10"
authors = [{ name = "SOQLAB", email = "contact@soqlab.com" }]
# The MCP SDK version 2 (mcp.server.mcpserver); httpx is what the tools read Morrow's API with.
dependencies = ["mcp>=2.3,<3", "httpx>=0.27"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Security :: Cryptography",
  "Environment :: Console",
]

[project.urls]
Homepage = "https://github.com/soqlab/Morrow/blob/main/docs/ASK_YOUR_ASSISTANT.md"
Source = "https://github.com/soqlab/Morrow/tree/main/tools/morrow_mcp"

[project.scripts]
morrow-mcp = "morrow_mcp.server:main"

[tool.setuptools]
packages = ["morrow_mcp"]
