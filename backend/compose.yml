services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "6379:6379"
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: morrow
      POSTGRES_PASSWORD: morrow
      POSTGRES_DB: morrow
    ports:
      - "5433:5432"
    volumes:
      - morrow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U morrow -d morrow"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  webhook_sink:
    image: python:3.11-slim
    working_dir: /app
    command: python -u /app/webhook_sink.py
    volumes:
      - ./:/app
    ports:
      - "9001:9001"

  api:
    build:
      context: .
      args:
        INSTALL_DEV_DEPS: "true"
    working_dir: /app
    # Keep reload disabled in Docker. On Windows/macOS bind mounts, WatchFiles can
    # crash with low-level filesystem watcher errors after restarts or edits.
    command: uvicorn app:app --host 0.0.0.0 --port 8000
    environment:
      - PYTHONPATH=/app
      - MORROW_MAIN_DB_BACKEND=postgres
      - MORROW_PRODUCT_DATABASE_URL=postgresql://morrow:morrow@postgres:5432/morrow
      - DATABASE_URL=postgresql://morrow:morrow@postgres:5432/morrow
      - MORROW_VAULT_MASTER_KEY=${MORROW_VAULT_MASTER_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL}
      - MORROW_AUTH_MODE=${MORROW_AUTH_MODE:-headers}
      - MORROW_AUTH_REQUIRED=${MORROW_AUTH_REQUIRED:-1}
      - MORROW_DEFAULT_ROLE=${MORROW_DEFAULT_ROLE:-viewer}
      - MORROW_AUTH_PROVIDER_NAME=${MORROW_AUTH_PROVIDER_NAME:-Hosted JWT}
      - MORROW_AUTH_LOGIN_URL=${MORROW_AUTH_LOGIN_URL:-}
      - MORROW_AUTH_LOGOUT_URL=${MORROW_AUTH_LOGOUT_URL:-}
      - MORROW_AUTH_TOKEN_HELP=${MORROW_AUTH_TOKEN_HELP:-}
      - MORROW_AUTH_JWT_ISSUER=${MORROW_AUTH_JWT_ISSUER:-}
      - MORROW_AUTH_JWT_AUDIENCE=${MORROW_AUTH_JWT_AUDIENCE:-}
      - MORROW_AUTH_JWT_JWKS_URL=${MORROW_AUTH_JWT_JWKS_URL:-}
      - MORROW_AUTH_JWT_ALGORITHMS=${MORROW_AUTH_JWT_ALGORITHMS:-RS256}
      - MORROW_AUTH_USER_ID_CLAIM=${MORROW_AUTH_USER_ID_CLAIM:-sub}
      - MORROW_AUTH_ROLE_CLAIM=${MORROW_AUTH_ROLE_CLAIM:-role}
      - MORROW_AUTH_ORG_ID_CLAIM=${MORROW_AUTH_ORG_ID_CLAIM:-}
      - MORROW_PLATFORM_ADMIN_KEY=${MORROW_PLATFORM_ADMIN_KEY:-}
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/1
      - ENABLE_INPROCESS_SCHEDULER=0
      - WORKER_ROLE=api
      - PER_TARGET_TIMEOUT=20
      - MORROW_CORS_ALLOW_ALL=1
    volumes:
      - ./:/app
      - pq_data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      webhook_sink:
        condition: service_started

  worker:
    build:
      context: .
      args:
        INSTALL_DEV_DEPS: "true"
    working_dir: /app
    command: celery -A tasks.celery_app worker --loglevel=INFO --concurrency=4
    environment:
      - PYTHONPATH=/app
      - MORROW_MAIN_DB_BACKEND=postgres
      - MORROW_PRODUCT_DATABASE_URL=postgresql://morrow:morrow@postgres:5432/morrow
      - DATABASE_URL=postgresql://morrow:morrow@postgres:5432/morrow
      - MORROW_VAULT_MASTER_KEY=${MORROW_VAULT_MASTER_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL}
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/1
      - WORKER_ROLE=worker
      - PER_TARGET_TIMEOUT=20
    volumes:
      - ./:/app
      - pq_data:/data
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      webhook_sink:
        condition: service_started

  beat:
    build:
      context: .
      args:
        INSTALL_DEV_DEPS: "true"
    working_dir: /app
    # Keep the beat schedule DB inside the Linux volume to avoid host/OS dbm incompatibilities.
    command: celery -A tasks.celery_app beat --loglevel=INFO --schedule /data/celerybeat-schedule
    environment:
      - PYTHONPATH=/app
      - MORROW_MAIN_DB_BACKEND=postgres
      - MORROW_PRODUCT_DATABASE_URL=postgresql://morrow:morrow@postgres:5432/morrow
      - DATABASE_URL=postgresql://morrow:morrow@postgres:5432/morrow
      - MORROW_VAULT_MASTER_KEY=${MORROW_VAULT_MASTER_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL}
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/1
      - WORKER_ROLE=beat
    volumes:
      - ./:/app
      - pq_data:/data
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      webhook_sink:
        condition: service_started

volumes:
  pq_data:
  morrow_pgdata:
  redis_data:
