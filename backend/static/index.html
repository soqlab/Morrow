<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Morrow - Quantum Readiness Console</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
/* ============================================================
   MORROW — Design tokens
   ============================================================ */
:root{
  --bg:#f1f2ef; --bg2:#e7e9e5; --surface:#ffffff; --surface2:#fafbf8; --surface3:#f0f1ee;
  --line:#dcdfd8; --line2:#c3c8bf;
  /* Graph edges get their own tokens rather than borrowing --line2. A border
     colour is tuned for a solid hairline against a panel edge; graph edges carry
     meaning (the topology of the risk map) and are only ~40% inked by the dash
     pattern, so --line2 measured 1.52:1 here and read as invisible. WCAG 1.4.11
     wants 3:1 for meaningful graphics. --edge 3.35:1, --edge-flow 3.68:1. */
  --edge:#79879d; --edge-flow:#1a5b86;   /* 3.64:1 and 7.28:1 on white */
  /* --ink3 is the muted/secondary text colour. It must clear WCAG AA 4.5:1 against every surface
     it sits on, including the lightest (--surface3). The previous #76839c measured 3.26–3.82:1. */
  --ink:#12161a; --ink2:#41474c; --ink3:#585f66;   /* --ink3 5.71:1 on --surface3 */
  /* --brand doubles as text on its own 13% tint (active sidebar item, active guide TOC entry).
     Verified against that tint over every base it appears on — the darkest, --bg2, is the binding
     case at 4.61:1. #0e7490 measured 4.33-4.48:1 there, just under AA. This also lifts
     white-on-brand for primary buttons to 6.5:1. */
  --brand:#1a5b86; --brand2:#8a5a12; --accent:#1a5b86;   /* brand 4.95:1 on its own 13% tint */
  --ok:#15803d; --okbg:#e8f7ee; --warn:#b45309; --warnbg:#fdf4e3; --bad:#be123c; --badbg:#fdeef1;
  --info:#1d4ed8; --infobg:#eaf0fe;
  --glow:0 0 0 1px rgba(8,145,178,.16);
  --shadow-sm:0 1px 2px rgba(13,21,38,.06),0 1px 3px rgba(13,21,38,.04);
  --shadow:0 4px 12px -2px rgba(13,21,38,.10),0 2px 6px -2px rgba(13,21,38,.06);
  --shadow-lg:0 24px 48px -12px rgba(13,21,38,.20),0 8px 20px -8px rgba(13,21,38,.12);
  --sans:"Inter","Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono","Cascadia Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --r:0px; --r-sm:0px; --r-lg:0px;
  --side:264px; --top:62px;
  --grid-line:rgba(13,21,38,.045);
}
html[data-theme="dark"]{
  --bg:#070b16; --bg2:#0a1120; --surface:#0e1524; --surface2:#131b2d; --surface3:#1a2338;
  --line:#1e2740; --line2:#2b3752;
  /* See the light palette: --line2 measured 1.54:1 against --surface here. */
  --edge:#5b6f9c; --edge-flow:#38bdf8;
  /* Same AA requirement as the light palette; #6b7c9b measured 3.71:1 on --surface3. */
  --ink:#eef3fb; --ink2:#9fb0cc; --ink3:#7c8ba6;
  --brand:#22d3ee; --brand2:#a78bfa; --accent:#38bdf8;
  --ok:#34d399; --okbg:rgba(52,211,153,.11); --warn:#fbbf24; --warnbg:rgba(251,191,36,.11);
  --bad:#fb7185; --badbg:rgba(251,113,133,.11); --info:#60a5fa; --infobg:rgba(96,165,250,.11);
  --glow:0 0 0 1px rgba(34,211,238,.14);
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow:0 4px 16px -4px rgba(0,0,0,.5),0 2px 6px -2px rgba(0,0,0,.4);
  --shadow-lg:0 32px 64px -16px rgba(0,0,0,.7),0 8px 24px -8px rgba(0,0,0,.5);
  --grid-line:rgba(160,180,220,.045);
}
*{box-sizing:border-box}
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:var(--line2);border-radius:0;border:3px solid transparent;background-clip:content-box}
*::-webkit-scrollbar-thumb:hover{background:var(--ink3);background-clip:content-box}
html,body{height:100%}
body{
  margin:0;color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;
  background:var(--bg);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  font-feature-settings:"cv11","ss01";
}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:-.02em;line-height:1.2}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:0}

/* ---------- ambient background ---------- */
.bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bgfx::before{
  content:"";position:absolute;inset:0;
  background-image:linear-gradient(var(--grid-line) 1px,transparent 1px),linear-gradient(90deg,var(--grid-line) 1px,transparent 1px);
  background-size:46px 46px;mask-image:radial-gradient(ellipse 90% 60% at 50% 0%,#000 30%,transparent 78%);
}

/* ---------- layout ---------- */
.app{position:relative;z-index:1;display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh}
.app.collapsed{--side:70px}

/* ---------- sidebar ---------- */
.side{
  position:sticky;top:0;height:100vh;display:flex;flex-direction:column;
  background:color-mix(in srgb,var(--surface) 78%,transparent);
  backdrop-filter:blur(20px) saturate(1.5);
  border-right:1px solid var(--line);z-index:40;
}
.brand{display:flex;align-items:center;gap:11px;padding:0 16px;height:var(--top);flex:none;border-bottom:1px solid var(--line)}
.logo{
  width:32px;height:32px;flex:none;border-radius:0;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--brand),var(--brand2));color:var(--bg);
  box-shadow:0 4px 14px -2px color-mix(in srgb,var(--brand) 55%,transparent);
}
.logo svg{width:18px;height:18px}
.brandTxt{min-width:0;overflow:hidden}
.brandTxt b{display:block;font-size:14px;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.brandTxt small{display:block;font-size:10px;color:var(--ink3);letter-spacing:.1em;text-transform:uppercase;font-weight:600;white-space:nowrap}
.collapsed .brandTxt{display:none}
.navScroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px 10px 18px}
.navGroup+.navGroup{margin-top:14px}
.navLabel{
  font-size:9.5px;text-transform:uppercase;letter-spacing:.14em;color:var(--ink3);
  font-weight:700;padding:0 10px 6px;white-space:nowrap;
}
.collapsed .navLabel{opacity:0;height:8px;padding:0;overflow:hidden}
.nav{
  display:flex;align-items:center;gap:11px;width:100%;padding:8px 10px;border:0;border-radius:var(--r-sm);
  background:transparent;color:var(--ink2);cursor:pointer;font-size:13px;font-weight:530;
  text-align:left;position:relative;transition:background .14s,color .14s;
}
.nav:hover{background:var(--surface3);color:var(--ink)}
.nav.on{background:color-mix(in srgb,var(--brand) 13%,transparent);color:var(--brand);font-weight:640}
.nav.on::before{content:"";position:absolute;left:-10px;top:50%;transform:translateY(-50%);width:3px;height:17px;border-radius:0;background:var(--brand)}
.nav svg{width:17px;height:17px;flex:none;stroke-width:1.7}
.nav span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.nav .cnt{
  font-family:var(--mono);font-size:10px;padding:1px 6px;border-radius:0;flex:none;
  background:var(--surface3);color:var(--ink3);font-weight:600;
}
/* Solid brand with white text: a 22% brand tint is too dark for brand-coloured text to reach
   AA at this size (measured 3.86:1). White on solid brand is 6.5:1. */
.nav.on .cnt{background:var(--brand);color:#fff}
html[data-theme="dark"] .nav.on .cnt{color:#08131a}
.collapsed .nav span,.collapsed .nav .cnt{display:none}
.collapsed .nav{justify-content:center;padding:9px}
.sideFoot{flex:none;border-top:1px solid var(--line);padding:10px}

/* ---------- topbar ---------- */
.main{min-width:0;display:flex;flex-direction:column}
.top{
  position:sticky;top:0;z-index:30;height:var(--top);flex:none;
  display:flex;align-items:center;gap:12px;padding:0 20px;
  background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:blur(18px) saturate(1.4);border-bottom:1px solid var(--line);
}
.iconBtn{
  width:33px;height:33px;flex:none;display:grid;place-items:center;border:1px solid var(--line);
  border-radius:var(--r-sm);background:var(--surface);color:var(--ink2);cursor:pointer;
  transition:background .14s,color .14s,border-color .14s;
}
.iconBtn:hover{background:var(--surface3);color:var(--ink);border-color:var(--line2)}
.iconBtn svg{width:16px;height:16px;stroke-width:1.8}
.crumb{display:flex;align-items:baseline;gap:9px;min-width:0;flex:1}
.crumb h1{font-size:16px;font-weight:670;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb p{margin:0;font-size:11.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.cmdBtn{
  display:flex;align-items:center;gap:8px;height:33px;padding:0 10px 0 11px;border:1px solid var(--line);
  border-radius:var(--r-sm);background:var(--surface);color:var(--ink3);cursor:pointer;font-size:12.5px;
  min-width:190px;transition:border-color .14s,background .14s;
}
.cmdBtn:hover{border-color:var(--brand);background:var(--surface2)}
.cmdBtn svg{width:14px;height:14px;flex:none;stroke-width:2}
.cmdBtn kbd{
  margin-left:auto;font-family:var(--sans);font-size:10px;font-weight:600;padding:2px 5px;
  border:1px solid var(--line);border-radius:0;background:var(--surface3);color:var(--ink3);
}
.healthDot{
  display:flex;align-items:center;gap:7px;height:33px;padding:0 11px;border:1px solid var(--line);
  border-radius:0;background:var(--surface);font-size:11.5px;font-weight:600;color:var(--ink2);white-space:nowrap;
}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ink3);flex:none;position:relative}
.dot.ok{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent)}
.dot.bad{background:var(--bad);box-shadow:0 0 0 3px color-mix(in srgb,var(--bad) 22%,transparent)}
.dot.ok::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--ok);animation:ping 2.4s cubic-bezier(0,0,.2,1) infinite}
@keyframes ping{75%,100%{transform:scale(2.6);opacity:0}}
select.orgSel{
  height:33px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);
  padding:0 8px;font-size:12.5px;max-width:180px;cursor:pointer;color:var(--ink2);
}

/* ---------- view canvas ---------- */
.view{padding:22px 24px 60px;max-width:1680px;width:100%;margin:0 auto;animation:rise .3s cubic-bezier(.2,.7,.3,1)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.sec{margin-bottom:22px}
.secHead{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.secHead h2{font-size:13px;font-weight:680;letter-spacing:.01em}
.secHead .rule{flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent);min-width:20px}

/* ---------- cards ---------- */
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow-sm);position:relative;
  /* clip, not hidden: purely decorative corner/accent clipping, and it avoids making every
     card an accidental scroll container (which zeroes its automatic minimum size in grids). */
  overflow:clip;
  transition:box-shadow .2s,border-color .2s,transform .2s;
}
.card.lift:hover{box-shadow:var(--shadow);border-color:var(--line2);transform:translateY(-2px)}
.cardHead{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.cardHead.plain{border-bottom:0;padding-bottom:0}
.cardHead h3{font-size:13.5px;font-weight:660;display:flex;align-items:center;gap:8px}
.cardHead h3 svg{width:15px;height:15px;color:var(--ink3);stroke-width:1.8}
.cardHead p{margin:3px 0 0;font-size:11.5px;color:var(--ink3);line-height:1.45}
.cardHead .act{margin-left:auto;display:flex;gap:6px;align-items:center;flex:none}
.cardBody{padding:16px}
.cardBody.flush{padding:0}
.cardBody.tight{padding:12px}

/* ---------- grid utils ---------- */
.g{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.gAuto{grid-template-columns:repeat(auto-fill,minmax(258px,1fr))}
.gWide{grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
.g-2-1{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g.alignTop{align-items:start}   /* NB: do not name this ".top" — that class is the topbar */
.g-1-2{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.g-3-2{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.tight{gap:6px}
.col{display:grid;gap:10px}
.spread{display:flex;align-items:center;justify-content:space-between;gap:12px}
.grow{flex:1;min-width:0}

/* ---------- KPI tiles ---------- */
.kpi{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;
  position:relative;overflow:clip;transition:border-color .2s,transform .2s,box-shadow .2s;
}
.kpi.lift:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--line2)}
.kpi::after{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--tone,var(--brand));opacity:.85}
.kpi .kh{display:flex;align-items:center;gap:7px;margin-bottom:9px}
.kpi .kh svg{width:14px;height:14px;color:var(--tone,var(--brand));flex:none;stroke-width:2}
.kpi .kh small{font-size:9.5px;text-transform:uppercase;letter-spacing:.13em;color:var(--ink3);font-weight:700}
.kpi b{display:block;font-size:29px;font-weight:680;letter-spacing:-.035em;line-height:1;font-variant-numeric:tabular-nums}
.kpi b .unit{font-size:14px;font-weight:600;color:var(--ink3);letter-spacing:0;margin-left:2px}
.kpi .sub{margin-top:7px;font-size:11px;color:var(--ink3);display:flex;align-items:center;gap:6px;min-height:16px}
.kpi .spark{margin-top:9px;height:26px}
.trend{display:inline-flex;align-items:center;gap:3px;font-weight:650;font-size:10.5px;padding:1px 5px;border-radius:0}
.trend.up{color:var(--ok);background:var(--okbg)}
.trend.dn{color:var(--bad);background:var(--badbg)}
.trend.flat{color:var(--ink3);background:var(--surface3)}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;height:33px;padding:0 13px;
  border:1px solid var(--line2);border-radius:var(--r-sm);background:var(--surface);color:var(--ink);
  font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;
  transition:background .14s,border-color .14s,transform .1s,box-shadow .14s;
}
.btn:hover:not(:disabled){background:var(--surface3);border-color:var(--ink3)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:14px;height:14px;flex:none;stroke-width:2}
.btn.pri{
  background:linear-gradient(140deg,var(--brand),color-mix(in srgb,var(--brand) 62%,var(--brand2)));
  border-color:transparent;color:#03121a;font-weight:670;
  box-shadow:0 3px 12px -3px color-mix(in srgb,var(--brand) 62%,transparent);
}
html[data-theme="light"] .btn.pri{color:#fff}
.btn.pri:hover:not(:disabled){filter:brightness(1.09);border-color:transparent;background:linear-gradient(140deg,var(--brand),color-mix(in srgb,var(--brand) 62%,var(--brand2)))}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink2)}
.btn.ghost:hover:not(:disabled){background:var(--surface3);color:var(--ink);border-color:transparent}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 34%,transparent);background:var(--badbg)}
.btn.danger:hover:not(:disabled){background:color-mix(in srgb,var(--bad) 17%,transparent);border-color:var(--bad)}
.btn.sm{height:27px;padding:0 9px;font-size:11.5px;border-radius:0}
.btn.sm svg{width:12px;height:12px}
.btn.xs{height:23px;padding:0 7px;font-size:10.5px;border-radius:0;font-weight:600}
.btn.xs svg{width:11px;height:11px}
.btn.block{width:100%}
.btn.load{position:relative;color:transparent!important;pointer-events:none}
.btn.load::after{
  content:"";position:absolute;width:13px;height:13px;border-radius:50%;
  border:2px solid color-mix(in srgb,var(--ink) 30%,transparent);border-top-color:var(--ink);
  animation:spin .6s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- form ---------- */
.field{display:grid;gap:5px}
.field>label{font-size:10px;text-transform:uppercase;letter-spacing:.11em;color:var(--ink3);font-weight:700}
.inp,textarea.inp,select.inp{
  width:100%;height:34px;border:1px solid var(--line2);border-radius:var(--r-sm);
  background:var(--surface2);padding:0 11px;outline:none;font-size:13px;
  transition:border-color .14s,box-shadow .14s,background .14s;
}
select.inp{cursor:pointer;padding-right:26px;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink3) 50%),linear-gradient(135deg,var(--ink3) 50%,transparent 50%);
  background-position:calc(100% - 14px) 14px,calc(100% - 9px) 14px;background-size:5px 5px;background-repeat:no-repeat}
textarea.inp{height:auto;min-height:108px;padding:10px 11px;font-family:var(--mono);font-size:12.5px;line-height:1.6;resize:vertical}
.inp:focus,textarea.inp:focus,select.inp:focus{
  border-color:var(--brand);background:var(--surface);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 15%,transparent);
}
.inp::placeholder{color:var(--ink3);opacity:.75}
.chk{display:flex;align-items:center;gap:8px;font-size:12.5px;cursor:pointer;user-select:none}
.chk input{width:15px;height:15px;accent-color:var(--brand);cursor:pointer;flex:none}

/* ---------- chips / pills ---------- */
.pill{
  display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:0;
  font-size:10.5px;font-weight:670;letter-spacing:.02em;white-space:nowrap;
  border:1px solid transparent;background:var(--surface3);color:var(--ink2);
}
.pill.ok{background:var(--okbg);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 26%,transparent)}
.pill.warn{background:var(--warnbg);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 26%,transparent)}
.pill.bad{background:var(--badbg);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 26%,transparent)}
.pill.info{background:var(--infobg);color:var(--info);border-color:color-mix(in srgb,var(--info) 26%,transparent)}
.pill.mono{font-family:var(--mono);font-weight:550;font-size:10px}
.pill .pd{width:5px;height:5px;border-radius:50%;background:currentColor;flex:none}
.chipRow{display:flex;gap:6px;flex-wrap:wrap}
.chip{
  display:inline-flex;align-items:center;gap:6px;height:27px;padding:0 10px;border-radius:0;
  border:1px solid var(--line2);background:var(--surface);font-size:11.5px;font-weight:590;
  cursor:pointer;color:var(--ink2);transition:all .14s;white-space:nowrap;
}
.chip:hover{border-color:var(--brand);color:var(--ink)}
.chip.on{background:color-mix(in srgb,var(--brand) 14%,transparent);border-color:var(--brand);color:var(--brand)}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:2px;padding:3px;background:var(--surface3);border-radius:0;overflow-x:auto;flex-wrap:nowrap}
.tabs::-webkit-scrollbar{height:0}
.tab{
  border:0;background:transparent;padding:6px 12px;border-radius:0;cursor:pointer;
  font-size:12.5px;font-weight:600;color:var(--ink3);white-space:nowrap;transition:all .14s;
}
.tab:hover{color:var(--ink)}
.tab.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}

/* ---------- table ---------- */
.tw{overflow:auto;max-height:var(--tmax,none)}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px}
thead th{
  position:sticky;top:0;z-index:2;text-align:left;padding:9px 13px;font-size:9.5px;font-weight:700;
  text-transform:uppercase;letter-spacing:.12em;color:var(--ink3);
  background:var(--surface2);border-bottom:1px solid var(--line);white-space:nowrap;
}
tbody td{padding:10px 13px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{transition:background .1s}
tbody tr:hover{background:var(--surface2)}
tbody tr:last-child td{border-bottom:0}
tbody tr.clik{cursor:pointer}
td .m,.mono{font-family:var(--mono);font-size:11.5px}
td b{font-weight:640}
td .sub{display:block;font-size:10.5px;color:var(--ink3);margin-top:2px}
.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono)}

/* ---------- misc blocks ---------- */
.empty{padding:38px 20px;text-align:center;color:var(--ink3)}
.empty svg{width:30px;height:30px;margin-bottom:9px;opacity:.4;stroke-width:1.5}
.empty b{display:block;font-size:13px;color:var(--ink2);margin-bottom:3px;font-weight:620}
.empty p{margin:0;font-size:11.5px;max-width:340px;margin-inline:auto;line-height:1.5}
.sk{background:linear-gradient(90deg,var(--surface3) 25%,var(--surface2) 50%,var(--surface3) 75%);
  background-size:200% 100%;animation:shim 1.4s ease-in-out infinite;border-radius:0}
@keyframes shim{to{background-position:-200% 0}}
pre.out{
  margin:0;padding:14px;background:var(--bg2);border:1px solid var(--line);border-radius:var(--r-sm);
  font-family:var(--mono);font-size:11.5px;line-height:1.65;overflow:auto;max-height:var(--pmax,460px);
  white-space:pre-wrap;word-break:break-word;color:var(--ink2);
}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 16px;font-size:12.5px;align-items:baseline}
.kv dt{color:var(--ink3);font-size:11px;white-space:nowrap;font-weight:600}
.kv dd{margin:0;font-weight:560;min-width:0;overflow-wrap:anywhere}
.bar{height:6px;border-radius:0;background:var(--surface3);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:0;background:linear-gradient(90deg,var(--brand),var(--brand2));
  transition:width .6s cubic-bezier(.2,.8,.2,1)}
.stack{display:grid;gap:9px}
.lrow{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.lrow:first-child{padding-top:0}
.mark{width:8px;height:8px;border-radius:0;flex:none}
.banner{
  display:flex;gap:11px;padding:12px 14px;border-radius:var(--r-sm);font-size:12.5px;
  border:1px solid var(--line);background:var(--surface2);align-items:flex-start;line-height:1.5;
}
.banner svg{width:16px;height:16px;flex:none;margin-top:1px;stroke-width:2}
.banner.warn{background:var(--warnbg);border-color:color-mix(in srgb,var(--warn) 30%,transparent);color:var(--warn)}
.banner.bad{background:var(--badbg);border-color:color-mix(in srgb,var(--bad) 30%,transparent);color:var(--bad)}
.banner.info{background:var(--infobg);border-color:color-mix(in srgb,var(--info) 30%,transparent);color:var(--info)}
.banner.ok{background:var(--okbg);border-color:color-mix(in srgb,var(--ok) 30%,transparent);color:var(--ok)}
.banner b{font-weight:670;display:block;margin-bottom:2px}
.banner .bx{color:var(--ink2)}

/* ---------- hero (overview) ---------- */
.hero{
  border-radius:var(--r-lg);padding:24px;position:relative;overflow:hidden;
  border:1px solid var(--line);
  background:
    radial-gradient(900px 380px at 8% -30%,color-mix(in srgb,var(--brand) 22%,transparent),transparent 70%),
    radial-gradient(700px 340px at 96% 130%,color-mix(in srgb,var(--brand2) 20%,transparent),transparent 70%),
    var(--surface);
  box-shadow:var(--shadow);
}
.hero::before{
  content:"";position:absolute;inset:0;opacity:.35;pointer-events:none;
  background-image:linear-gradient(var(--grid-line) 1px,transparent 1px),linear-gradient(90deg,var(--grid-line) 1px,transparent 1px);
  background-size:34px 34px;
}
.heroIn{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:26px;align-items:center}
.heroL{min-width:0}
.eyebrow{display:inline-flex;align-items:center;gap:7px;font-size:10px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--brand);margin-bottom:11px}
.eyebrow .pd{width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
.hero h2{font-size:clamp(21px,2.4vw,30px);font-weight:700;letter-spacing:-.035em;line-height:1.12}
.hero p{margin:9px 0 0;font-size:13px;color:var(--ink2);max-width:60ch;line-height:1.6}
.heroStats{display:flex;gap:22px;margin-top:18px;flex-wrap:wrap}
.heroStat small{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.13em;color:var(--ink3);font-weight:700;margin-bottom:4px}
.heroStat b{font-size:18px;font-weight:680;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.ring{position:relative;width:196px;height:196px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .rc{fill:none;stroke-linecap:round}
.ringTxt{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:1px}
.ringTxt b{font-size:31px;font-weight:700;letter-spacing:-.045em;line-height:1;font-variant-numeric:tabular-nums}
.ringTxt small{font-size:9.5px;text-transform:uppercase;letter-spacing:.13em;color:var(--ink3);font-weight:700}
.ringTxt .cd{font-family:var(--mono);font-size:10.5px;color:var(--ink3);margin-top:5px;font-variant-numeric:tabular-nums}

/* ---------- mission control / copilot ---------- */
.copilotBtn{
  display:flex;align-items:center;gap:8px;height:33px;padding:0 12px;border:1px solid color-mix(in srgb,var(--brand) 42%,var(--line));
  border-radius:0;background:linear-gradient(135deg,color-mix(in srgb,var(--brand) 18%,var(--surface)),color-mix(in srgb,var(--brand2) 13%,var(--surface)));
  color:var(--ink);cursor:pointer;font-size:12.5px;font-weight:680;box-shadow:var(--glow);
}
.copilotBtn svg{width:15px;height:15px;stroke-width:2;color:var(--brand)}
.missionBoard{
  display:grid;grid-template-columns:minmax(0,1.12fr) minmax(340px,.88fr);gap:18px;margin:20px 0 0;
  border:1px solid var(--line);border-radius:0;padding:18px;
  background:
    linear-gradient(135deg,color-mix(in srgb,var(--brand) 14%,transparent),transparent 44%),
    linear-gradient(315deg,color-mix(in srgb,var(--brand2) 13%,transparent),transparent 50%),
    var(--surface);
  box-shadow:var(--shadow);overflow:hidden;position:relative;
}
.missionBoard::before{content:"";position:absolute;inset:0;opacity:.18;pointer-events:none;background-image:linear-gradient(var(--grid-line) 1px,transparent 1px);background-size:100% 42px}
.missionNarrative,.missionDeck{position:relative}
.missionNarrative small,.capabilityLane small,.metricRow small{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.14em;color:var(--brand);font-weight:780}
.missionNarrative h3{font-size:clamp(24px,3vw,38px);line-height:1.02;letter-spacing:-.055em;margin:8px 0 10px}
.missionNarrative p{font-size:13px;color:var(--ink2);line-height:1.65;max-width:72ch;margin:0}
.missionDeck{display:grid;gap:10px}
.missionDeck .line{
  display:grid;grid-template-columns:minmax(110px,.48fr) minmax(0,1fr) auto;gap:12px;align-items:center;
  padding:12px 14px;border:1px solid var(--line);border-radius:0;background:color-mix(in srgb,var(--surface2) 72%,transparent);
}
.missionDeck b{font-size:17px;letter-spacing:-.03em}.missionDeck span{font-size:11.5px;color:var(--ink3);line-height:1.45}
.metricRiver{display:grid;gap:10px;margin:18px 0}
.metricRow{
  display:grid;grid-template-columns:170px minmax(0,1fr) auto;gap:14px;align-items:center;
  border:1px solid var(--line);border-radius:0;padding:12px 14px;background:var(--surface);
}
.metricRow b{font-size:22px;letter-spacing:-.045em;font-variant-numeric:tabular-nums}
.metricRow p{font-size:11.5px;color:var(--ink3);line-height:1.45;margin:0}
.metricRow .meter{height:8px;border-radius:0;background:var(--surface3);overflow:hidden}
.metricRow .meter i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--brand),var(--brand2))}
.capabilityTheater{display:grid;gap:14px}
.capabilityLane{
  display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:16px;align-items:center;position:relative;overflow:hidden;
  min-height:132px;border:1px solid var(--line);border-radius:0;padding:18px;
  background:linear-gradient(135deg,color-mix(in srgb,var(--surface3) 42%,transparent),var(--surface));
}
.capabilityLane::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--cap,var(--brand))}
.capabilityGlyph{width:58px;height:58px;border-radius:0;display:grid;place-items:center;color:var(--cap,var(--brand));background:color-mix(in srgb,var(--cap,var(--brand)) 13%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--cap,var(--brand)) 28%,transparent)}
.capabilityGlyph svg{width:28px;height:28px}
.capabilityLane h3{font-size:18px;letter-spacing:-.035em;margin:4px 0 6px}
.capabilityLane p{margin:0;font-size:12.5px;color:var(--ink2);line-height:1.55;max-width:80ch}
.capabilityMeta{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap;min-width:160px}
.capabilityMeta .big{font-size:20px;font-weight:760;letter-spacing:-.04em;color:var(--ink)}
.riskBands{display:grid;gap:8px}
.riskBand{display:grid;grid-template-columns:112px minmax(0,1fr) 58px;gap:10px;align-items:center;border:1px solid var(--line);border-radius:0;padding:9px 11px;background:var(--surface2)}
.riskBand small{font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink3);font-weight:750}
.riskBand .bar{height:8px}.riskBand b{font-size:14px;text-align:right;font-variant-numeric:tabular-nums}
.warRoom{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(320px,.8fr);gap:14px;align-items:start}
.nextAction{
  display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px;
  border:1px solid var(--line);border-radius:0;background:var(--surface2);
}
.nextAction .rank{width:28px;height:28px;border-radius:0;display:grid;place-items:center;background:var(--brand);color:#04131a;font-weight:800;font-size:12px}
.nextAction b{font-size:12.5px}.nextAction p{margin:3px 0 0;font-size:11.5px;color:var(--ink3);line-height:1.5}
.storyFrames{display:grid;gap:10px}
.storyFrame{display:grid;grid-template-columns:110px minmax(0,1fr);gap:14px;align-items:start;border:1px solid var(--line);border-radius:0;background:var(--surface2);padding:14px}
.storyFrame small{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.13em;color:var(--brand);font-weight:780}
.storyFrame b{display:block;font-size:15px;margin-bottom:5px}.storyFrame p{margin:0;font-size:12px;color:var(--ink3);line-height:1.55}
.copilotDrawer{width:min(760px,100%)}
.chatLog{display:grid;gap:10px;align-content:start;min-height:280px;max-height:48vh;overflow:auto;padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg2)}
.chatBubble{max-width:88%;padding:11px 13px;border-radius:0;font-size:12.5px;line-height:1.6;white-space:pre-wrap}
.chatBubble.user{justify-self:end;background:var(--brand);color:#04131a;border-radius:0}
.chatBubble.bot{justify-self:start;background:var(--surface);border:1px solid var(--line);border-radius:0}
.chatBubble.bot.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 42%,var(--line));background:var(--badbg)}
.promptGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:10px 0}
.promptBtn{border:1px solid var(--line);background:var(--surface2);border-radius:0;padding:9px 10px;text-align:left;cursor:pointer;color:var(--ink2);font-size:11.5px;line-height:1.35}
.promptBtn:hover{border-color:var(--brand);color:var(--ink);background:color-mix(in srgb,var(--brand) 9%,var(--surface))}

/* ---------- charts ---------- */
.chart{width:100%;display:block;overflow:visible}
.chart .gl{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}
.chart .ax{fill:var(--ink3);font-size:9.5px;font-family:var(--mono);font-weight:500}
.chart .pt{stroke:var(--surface);stroke-width:2}
.chart .bl{fill:var(--ink2);font-size:10px;font-weight:600}

/* -- chart entrance animation ------------------------------------------------
   The charts were emitted as finished SVG and injected with innerHTML, so they
   simply appeared. gauge() even carried a transition on stroke-dashoffset, which
   could never fire: a transition needs a change, and the markup arrives already
   at its final value.

   These are keyframes rather than transitions for that reason — they run once on
   the freshly-inserted element. Because a view swap replaces the nodes, every
   render animates without any JS bookkeeping. The global prefers-reduced-motion
   rule further down collapses all of this to near-zero duration. */

/* Line charts draw themselves. pathLength="1" normalises the geometry so the
   dash values are the same regardless of the path's real length, which avoids
   measuring anything at runtime. */
.chart .ln{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:1;stroke-dashoffset:1;animation:drawLine 1.1s cubic-bezier(.25,.8,.3,1) forwards}
@keyframes drawLine{to{stroke-dashoffset:0}}

/* The area under the line follows the stroke rather than arriving with it. */
.chart .fillArea{opacity:0;animation:fadeIn .7s ease-out .45s forwards}
@keyframes fadeIn{to{opacity:1}}

/* Bars grow from their baseline. transform-box:fill-box makes the SVG rect's own
   box the reference, so the origin is the foot of the bar and not the viewport. */
.chart .barRect{transform-box:fill-box;transform-origin:50% 100%;
  animation:growBar .6s cubic-bezier(.25,.9,.3,1) backwards}
@keyframes growBar{from{transform:scaleY(0)}to{transform:scaleY(1)}}

/* Horizontal bars are plain elements; scaleX keeps the inline percentage width
   authoritative, so the animation cannot disagree with the data. */
.bar>i{transform-origin:left center;animation:growRow .7s cubic-bezier(.25,.9,.3,1) backwards}
@keyframes growRow{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* Donut segments sweep in. --dash and --gap carry the arc the data produced, so
   the end state is exactly what was computed. */
.chart .arcSeg{animation:sweepArc .95s cubic-bezier(.25,.8,.3,1) backwards}
@keyframes sweepArc{from{stroke-dasharray:0 var(--circ)}to{stroke-dasharray:var(--dash) var(--gap)}}

/* The gauge needle sweeps up to its reading from empty. */
.chart .gaugeArc{animation:sweepGauge 1s cubic-bezier(.25,.8,.3,1) backwards}
@keyframes sweepGauge{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:var(--off)}}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:11px;font-size:11px;color:var(--ink2)}
.legend i{display:inline-flex;align-items:center;gap:6px}
.legend .mark{width:9px;height:9px;border-radius:0}
.donutWrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.gaugeWrap{position:relative;text-align:center}
.gaugeTxt{position:absolute;left:0;right:0;bottom:6px}
.gaugeTxt b{display:block;font-size:26px;font-weight:700;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.gaugeTxt small{font-size:10px;color:var(--ink3);font-weight:640}
.heat{display:grid;gap:3px}
.hcell{aspect-ratio:1;border-radius:0;background:var(--surface3);transition:transform .12s}
.hcell:hover{transform:scale(1.28);z-index:2;position:relative}
.gnode{cursor:pointer;transition:opacity .15s}
.gnode:hover{opacity:.82}
/* -- graph edges -------------------------------------------------------------
   Edge motion is data-driven: only relationships touching high-risk nodes move.
   It is risk pressure, not packet flow. */
.gedge{stroke:var(--edge);stroke-width:1.15;opacity:.55;fill:none}
/* A link under measured pressure switches to the accent, so risk is legible in a
   still screenshot and not only to someone watching it move. --edge-flow was
   declared in both palettes but never referenced by anything. */
.gedge.flow{stroke:var(--edge-flow);stroke-linecap:round;
  stroke-width:1.7;stroke-dasharray:7 9;opacity:var(--edge-opacity,.65);
  animation:dataEdge var(--edge-speed,3.2s) linear infinite}
@keyframes dataEdge{to{stroke-dashoffset:-32}}

/* Nodes settle in, then the risky ones keep breathing. --riskPulse is set only
   on nodes above the risk threshold, so a calm graph stays calm and attention
   goes where the risk actually is. */
.gnode circle{transform-box:fill-box;transform-origin:50% 50%;
  animation:nodePop .5s cubic-bezier(.2,1.3,.4,1) backwards}
@keyframes nodePop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
.gnode.hot circle{animation:nodePop .5s cubic-bezier(.2,1.3,.4,1) backwards,
  riskPulse var(--node-pulse,2.6s) ease-in-out infinite}
@keyframes riskPulse{0%,100%{filter:none}50%{filter:drop-shadow(0 0 var(--node-glow,7px) currentColor)}}


/* ---------- timeline ---------- */
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:6px;top:5px;bottom:5px;width:2px;background:var(--line);border-radius:0}
.tli{position:relative;padding-bottom:16px}
.tli:last-child{padding-bottom:0}
.tli::before{
  content:"";position:absolute;left:-24px;top:4px;width:10px;height:10px;border-radius:50%;
  background:var(--surface);border:2px solid var(--line2);
}
.tli.done::before{background:var(--ok);border-color:var(--ok)}
.tli.now::before{background:var(--warn);border-color:var(--warn);box-shadow:0 0 0 4px var(--warnbg)}
.tli.next::before{background:var(--surface);border-color:var(--brand)}
.tli .ty{font-family:var(--mono);font-size:11px;font-weight:670;color:var(--brand)}
.tli .te{font-size:12.5px;margin-top:2px;line-height:1.45}

/* ---------- command palette ---------- */
.scrim{
  position:fixed;inset:0;z-index:90;background:color-mix(in srgb,#040810 62%,transparent);
  backdrop-filter:blur(5px);display:grid;place-items:start center;padding:11vh 18px 18px;
  animation:fade .16s ease;
}
@keyframes fade{from{opacity:0}}
.cmd{
  width:min(620px,100%);background:var(--surface);border:1px solid var(--line2);border-radius:var(--r);
  box-shadow:var(--shadow-lg);overflow:hidden;animation:pop .2s cubic-bezier(.2,.8,.3,1);
}
@keyframes pop{from{opacity:0;transform:translateY(-12px) scale(.98)}}
.cmdIn{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.cmdIn svg{width:17px;height:17px;color:var(--ink3);flex:none;stroke-width:2}
.cmdIn input{flex:1;border:0;background:transparent;outline:none;font-size:15px}
.cmdList{max-height:min(52vh,420px);overflow-y:auto;padding:7px}
.cmdItem{
  display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:var(--r-sm);cursor:pointer;
  font-size:13px;color:var(--ink2);
}
.cmdItem svg{width:16px;height:16px;flex:none;color:var(--ink3);stroke-width:1.8}
.cmdItem.on{background:color-mix(in srgb,var(--brand) 13%,transparent);color:var(--brand)}
.cmdItem.on svg{color:var(--brand)}
.cmdItem .cg{margin-left:auto;font-size:10px;color:var(--ink3);text-transform:uppercase;letter-spacing:.1em;font-weight:700}
.cmdFoot{padding:8px 14px;border-top:1px solid var(--line);font-size:10.5px;color:var(--ink3);display:flex;gap:14px;background:var(--surface2)}
.cmdFoot kbd{font-family:var(--sans);border:1px solid var(--line2);border-radius:0;padding:1px 4px;font-size:9.5px;font-weight:650}

/* ---------- drawer ---------- */
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(620px,100%);z-index:95;display:flex;flex-direction:column;
  background:var(--surface);border-left:1px solid var(--line2);box-shadow:var(--shadow-lg);
  animation:slide .24s cubic-bezier(.2,.8,.3,1);
}
@keyframes slide{from{transform:translateX(24px);opacity:.6}}
.drawerHead{display:flex;align-items:flex-start;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line);flex:none}
.drawerHead h3{font-size:15px;font-weight:670}
.drawerHead p{margin:3px 0 0;font-size:11.5px;color:var(--ink3);font-family:var(--mono)}
.drawerBody{flex:1;overflow-y:auto;padding:18px}

/* ---------- full-screen auth gate ---------- */
.gate{
  position:fixed;inset:0;z-index:80;display:grid;grid-template-columns:1fr;place-items:center;
  padding:24px;overflow-y:auto;background:var(--bg);
}
.gate::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(900px 420px at 12% -10%,color-mix(in srgb,var(--brand) 20%,transparent),transparent 70%),
    radial-gradient(760px 380px at 88% 110%,color-mix(in srgb,var(--brand2) 18%,transparent),transparent 70%);
}
.gateCard{
  position:relative;width:min(430px,100%);background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-lg);box-shadow:var(--shadow-lg);padding:26px;
  animation:pop .28s cubic-bezier(.2,.8,.3,1);
}
.gateBrand{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.gateBrand .logo{width:38px;height:38px;border-radius:0}
.gateBrand .logo svg{width:21px;height:21px}
.gateBrand b{display:block;font-size:16px;font-weight:700;letter-spacing:-.02em}
.gateBrand small{display:block;font-size:10px;color:var(--ink3);letter-spacing:.11em;text-transform:uppercase;font-weight:700}
.gateCard h2{font-size:19px;font-weight:680;margin-bottom:5px}
.gateCard .gsub{font-size:12.5px;color:var(--ink3);line-height:1.5;margin:0 0 18px}
.gateFoot{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);
  font-size:11px;color:var(--ink3);line-height:1.6;display:grid;gap:6px}
.gateFoot a{font-weight:600}
.orDiv{display:flex;align-items:center;gap:10px;margin:16px 0}
.orDiv i{flex:1;height:1px;background:var(--line)}
.orDiv span{font-size:9.5px;text-transform:uppercase;letter-spacing:.13em;color:var(--ink3);font-weight:700}

/* ---------- public demo entry: the estate radar beside the start card ---------- */
.gate.demo{place-items:stretch;padding:0;background:
  linear-gradient(var(--grid-line) 1px,transparent 1px) 0 0/44px 44px,
  linear-gradient(90deg,var(--grid-line) 1px,transparent 1px) 0 0/44px 44px,var(--bg)}

/* ============================================================

html[data-theme="dark"]{
  /* Aligned to the site palette (landing, doc pages, operator surfaces).
     Every pair below was measured, not assumed — see the ratios noted:
       --ink3 on --surface3  5.52:1   --ink2 on --surface  9.84:1
       --edge on --surface   3.83:1   --brand on own tint  7.11:1
     WCAG AA needs 4.5:1 for text and 3:1 for meaningful graphics. */
  --bg:#060708;
  --bg2:#0a0c0f;
  --surface:#0d1115;
  --surface2:#121820;
  --surface3:#171e28;
  --line:#27303a;
  --line2:#394554;
  --edge:#5f7288;
  --edge-flow:#7eb6ff;
  --ink:#eef0ec;
  --ink2:#b8bcb5;
  --ink3:#8f968d;
  --brand:#d9a24b;
  --brand2:#7eb6ff;
  --accent:#d9a24b;
  --ok:#53d39b; --okbg:rgba(83,211,155,.10);
  --warn:#d9a24b; --warnbg:rgba(217,162,75,.10);
  --bad:#ff6f6f; --badbg:rgba(255,111,111,.10);
  --info:#7eb6ff; --infobg:rgba(126,182,255,.10);
  --grid-line:rgba(216,226,238,.04);
  --shadow-sm:none;
  --shadow:none;
  --shadow-lg:0 36px 90px rgba(0,0,0,.5);
  /* Squared throughout: the reference has no rounded corner anywhere. */
  --r:0px;
  --r-sm:0px;
  --r-lg:0px;
  --side:292px;
  --top:70px;
}

/* ============================================================
   SITE UNIFICATION — console
   ------------------------------------------------------------
   Brings the console into the same visual language as the landing page, the
   document pages and the operator surfaces: flat bands instead of gradient
   washes, squared corners, display type set large at moderate weight with
   tight tracking, and tiny wide-tracked mono labels running the other way.

   Appended so the cascade order is explicit and the rules above stay readable
   as the file's own history. Colour is not touched here — it comes from the
   token blocks, where every pair was contrast-checked.
   ============================================================ */

/* The reference has no rounded corner anywhere. Circles stay circles: those are
   avatars and status dots, where the radius carries meaning. */
/* Radii are squared at source (the --r tokens are 0 and every literal was
   zeroed), so no blanket override is needed here — a universal selector with
   pseudo-elements would only add style-recalc cost on a DOM this large.
   Circles keep their own rules: status dots, orbs and the check glyph, where
   the radius carries meaning rather than style. */

/* Flat ground. The three stacked radial washes gave the page a direction of
   light, which fought the instrument reading the rest of the site now has. */
html[data-theme="dark"] body {
  background: var(--bg);
}
html[data-theme="dark"] .bgfx::before {
  mask-image: linear-gradient(to bottom, rgba(0,0,0,.8), transparent 44%);
}

/* ---- display type -------------------------------------------------------
   The view title is the page's headline, so it gets the same treatment the
   rest of the site uses: large, moderate weight, tight tracking. */
.crumb h1 {
  font-size: clamp(21px, 2.3vw, 31px);
  font-weight: 560;
  letter-spacing: -.032em;
  line-height: 1.08;
}
.crumb p {
  font-family: var(--mono);

/* ---------------------------------------------------------------- utils */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const H  = (v) => String(v ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const isObj = (v) => v && typeof v === "object" && !Array.isArray(v);

/* The API sends null for "we did not measure this". Number(null) is 0, so without
   this guard every unmeasured figure would render as a confident 0, $0 or 0%. */
const UNSET = (v) => v === null || v === undefined || v === "" ||
  (typeof v === "number" && !isFinite(v)) ||
  (typeof v === "string" && !isFinite(Number(v)));

const NUM = (v, d = 0) => {
  if (UNSET(v)) return "—";
  const n = Number(v);
  if (!isFinite(n)) return "—";
  return n.toLocaleString(undefined, { minimumFractionDigits: d, maximumFractionDigits: d });
};
const COMPACT = (v) => {
  if (UNSET(v)) return "—";
  const n = Number(v);
  if (!isFinite(n)) return "—";
  if (Math.abs(n) >= 1e9) return (n / 1e9).toFixed(1).replace(/\.0$/, "") + "B";
  if (Math.abs(n) >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, "") + "M";
  if (Math.abs(n) >= 1e4) return (n / 1e3).toFixed(1).replace(/\.0$/, "") + "k";
  return n.toLocaleString();
};
const USD = (v) => {
  if (UNSET(v)) return "—";
  const n = Number(v);
  if (!isFinite(n)) return "—";
  if (Math.abs(n) >= 1e6) return "$" + (n / 1e6).toFixed(2).replace(/\.00$/, "") + "M";
  if (Math.abs(n) >= 1e3) return "$" + (n / 1e3).toFixed(1).replace(/\.0$/, "") + "k";
  return "$" + n.toFixed(0);
};
const PCT = (v, d = 0) => (UNSET(v) ? "—" : Number(v).toFixed(d) + "%");
const DATE = (v) => {
  if (!v) return "—";
  const d = new Date(v);
  return isNaN(d) ? String(v).slice(0, 19) : d.toLocaleString(undefined, { year: "numeric", month: "short", day: "2-digit", hour: "2-digit", minute: "2-digit" });
};
const DAY = (v) => {
  if (!v) return "—";
  const d = new Date(v);
  return isNaN(d) ? String(v).slice(0, 10) : d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "2-digit" });

  if (!v) return "never";
  const t = new Date(v).getTime();
  if (isNaN(t)) return String(v);
  const s = (Date.now() - t) / 1000;
  if (s < 0) return "in " + AGO(new Date(Date.now() * 2 - t));
  if (s < 60) return Math.floor(s) + "s ago";
  if (s < 3600) return Math.floor(s / 60) + "m ago";
  if (s < 86400) return Math.floor(s / 3600) + "h ago";
  if (s < 2592000) return Math.floor(s / 86400) + "d ago";
  return DAY(v);

  "fips", "nist", "cnsa", "rbac", "rls", "cors", "csp", "iac", "cicd", "pr", "hs256", "rs256", "e2e"]);

/* ---------------------------------------------------------------- api */

/* ---------------------------------------------------------------- toasts */
let toastSeq = 0;

  const detail = [b.summary, b.as_of ? `As of ${b.as_of}` : "",

function sparkline(vals, { w = 200, h = 30, color = "var(--brand)", fill = true, id = "sp" + Math.random().toString(36).slice(2, 8) } = {}) {
  const v = (vals || []).map(Number).filter(n => isFinite(n));
  if (v.length < 2) return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="height:${h}px"></svg>`;
  const mn = Math.min(...v), mx = Math.max(...v), sp = (mx - mn) || 1;
  const X = i => (i / (v.length - 1)) * w;

  return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="height:${h}px">

      <stop offset="0%" stop-color="${color}" stop-opacity=".32"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs><path class="fillArea" d="${d}L${w},${h}L0,${h}Z" fill="url(#${id})"/>` : ""}
    <path class="ln" pathLength="1" d="${d}" stroke="${color}"/>

function areaChart(points, { h = 190, color = "var(--brand)", yFmt = COMPACT, label = "", zeroMsg = "" } = {}) {
  const pts = (points || []).filter(p => p && isFinite(Number(p.v)));
  if (pts.length < 2) return emptyBox("Not enough data points to plot", I.chart);
  const vs = pts.map(p => Number(p.v));
  /* an all-zero series carries no information — say so instead of drawing a fake axis */
  if (vs.every(v => v === 0)) {
    return emptyBox(zeroMsg || `Every point in this series is zero (${pts.length} intervals recorded). Nothing to plot yet.`,
      I.chart, "No activity recorded");
  }
  const w = 760, padL = 46, padR = 12, padT = 12, padB = 26;
  const rawMx = Math.max(...vs), rawMn = Math.min(...vs, 0);
  /* flat non-zero series: pad the range so the line sits mid-chart instead of on the axis */

  const mx = flat ? rawMx * 1.25 || 1 : rawMx, mn = flat ? 0 : rawMn, sp = (mx - mn) || 1;
  const X = i => padL + (i / (pts.length - 1)) * (w - padL - padR);
  const Y = n => padT + (1 - (n - mn) / sp) * (h - padT - padB);
  const line = pts.map((p, i) => `${i ? "L" : "M"}${X(i).toFixed(1)},${Y(p.v).toFixed(1)}`).join("");
  const gid = "ac" + Math.random().toString(36).slice(2, 8);
  const step = Math.max(1, Math.round(pts.length / 7));
  /* build ticks, dropping any whose formatted label repeats (avoids "$1 $1 $1") */
  const ticks = [];
  const seen = new Set();
  for (let i = 0; i <= 4; i++) {

    seen.add(lab); ticks.push({ val, lab });

    label, color, h, mn, mx,
    pts: pts.map(p => ({ k: String(p.k), v: Number(p.v), f: String(yFmt(p.v)) })),
    ticks: ticks.map(t => ({ v: t.val, lab: t.lab })),
  }, `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="${H(label || "Trend chart")}">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${color}" stop-opacity=".30"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>
    ${ticks.map(({ val, lab }) => {
      const y = Y(val).toFixed(1);
      return `<line class="gl" x1="${padL}" y1="${y}" x2="${w - padR}" y2="${y}"/>
              <text class="ax" x="${padL - 7}" y="${y}" text-anchor="end" dominant-baseline="middle">${H(lab)}</text>`;
    }).join("")}
    <path class="fillArea" d="${line}L${X(pts.length - 1).toFixed(1)},${h - padB}L${padL},${h - padB}Z" fill="url(#${gid})"/>
    <path class="ln" pathLength="1" d="${line}" stroke="${color}"/>
    ${pts.map((p, i) => `<circle class="pt" cx="${X(i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="${pts.length > 30 ? 0 : 3}" fill="${color}"><title>${H(p.k)} · ${yFmt(p.v)}</title></circle>`).join("")}
    ${pts.map((p, i) => (i % step === 0 || i === pts.length - 1)
      ? `<text class="ax" x="${X(i).toFixed(1)}" y="${h - 8}" text-anchor="middle">${H(String(p.k).slice(0, 10))}</text>` : "").join("")}
  </svg>`);
}

          <b class="mono" style="font-size:11.5px;flex:none">${fmt(x.v)}</b>
        </div>
        <div class="bar"><i style="width:${(Number(x.v) / mx * 100).toFixed(1)}%;background:${x.c || color || PALETTE[i % PALETTE.length]};animation-delay:${(i * 50)}ms"></i></div>
      </div>`).join("")}</div>`);
  }
  const w = 760, padL = 44, padR = 10, padT = 12, padB = 30;
  const bw = (w - padL - padR) / list.length;
  const seen = new Set();
  const ticks = Array.from({ length: 5 }, (_, i) => ({ i, lab: String(fmt(mx * i / 4)) }))
    .filter(({ i, lab }) => { if (seen.has(lab) && i !== 4) return false; seen.add(lab); return true; });
  return c3dWrap("bar", bars3d, `<svg class="chart" viewBox="0 0 ${w} ${h}">
    ${ticks.map(({ i, lab }) => {
      const y = (padT + (1 - i / 4) * (h - padT - padB)).toFixed(1);
      return `<line class="gl" x1="${padL}" y1="${y}" x2="${w - padR}" y2="${y}"/>
              <text class="ax" x="${padL - 7}" y="${y}" text-anchor="end" dominant-baseline="middle">${H(lab)}</text>`;
    }).join("")}
    ${list.map((x, i) => {
      const bh = (Number(x.v) / mx) * (h - padT - padB);
      const bx = padL + i * bw + bw * 0.18, by = h - padB - bh;
      return `<rect class="barRect" style="animation-delay:${(i * 45)}ms" x="${bx.toFixed(1)}" y="${by.toFixed(1)}" width="${(bw * 0.64).toFixed(1)}" height="${Math.max(1, bh).toFixed(1)}"
        rx="3" fill="${x.c || color || PALETTE[i % PALETTE.length]}" opacity=".9"><title>${H(TITLE(x.k))}: ${fmt(x.v)}</title></rect>
        <text class="ax" x="${(padL + i * bw + bw / 2).toFixed(1)}" y="${h - 10}" text-anchor="middle">${H(String(x.k).slice(0, 9))}</text>`;
    }).join("")}
  </svg>`);
}

function donut(segs, { size = 138, thick = 15, center = "", sub = "" } = {}) {
  const list = (segs || []).map(s => ({ ...s, v: Number(s.v) || 0 })).filter(s => s.v > 0);
  const total = list.reduce((a, b) => a + b.v, 0);
  const r = (size - thick) / 2, C = 2 * Math.PI * r, cx = size / 2;
  let acc = 0;
  const arcs = total ? list.map((s, i) => {
    const frac = s.v / total, dash = `${(frac * C).toFixed(2)} ${(C - frac * C).toFixed(2)}`;
    const off = -acc * C; acc += frac;
    // --circ/--dash/--gap let the sweep keyframe end on exactly the arc computed here.
    return `<circle class="arcSeg" style="--circ:${C.toFixed(2)};--dash:${(frac * C).toFixed(2)};--gap:${(C - frac * C).toFixed(2)};animation-delay:${(i * 90)}ms"
      cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="${s.c || PALETTE[i % PALETTE.length]}"
      stroke-width="${thick}" stroke-dasharray="${dash}" stroke-dashoffset="${off.toFixed(2)}" stroke-linecap="butt"
      transform="rotate(-90 ${cx} ${cx})"><title>${H(TITLE(s.k))}: ${NUM(s.v)} (${PCT(frac * 100)})</title></circle>`;
  }).join("") : `<circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="var(--surface3)" stroke-width="${thick}"/>`;
  return c3dWrap("donut", total ? {
    center: String(center || COMPACT(total)), sub,
    segs: list.map((s, i) => ({ k: TITLE(s.k), v: s.v, f: NUM(s.v), p: PCT(s.v / total * 100), c: s.c || PALETTE[i % PALETTE.length] })),
  } : null, `<div class="donutWrap">
    <div style="position:relative;flex:none;width:${size}px;height:${size}px">
      <svg class="chart" viewBox="0 0 ${size} ${size}" style="height:${size}px">${arcs}</svg>
      <div style="position:absolute;inset:0;display:grid;place-content:center;text-align:center">
        <b style="font-size:22px;font-weight:700;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums">${center || COMPACT(total)}</b>
        ${sub ? `<small style="font-size:9.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.12em;font-weight:700;margin-top:4px">${H(sub)}</small>` : ""}
      </div>
    </div>
    <div class="stack grow" style="min-width:130px">
      ${list.length ? list.map((s, i) => `<div class="spread" style="font-size:12px">
        <span class="row tight" style="min-width:0"><i class="mark" style="background:${s.c || PALETTE[i % PALETTE.length]}"></i>
        <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${H(TITLE(s.k))}</span></span>
        <b class="mono" style="font-size:11.5px;flex:none">${NUM(s.v)}</b></div>`).join("")
        : `<span style="font-size:12px;color:var(--ink3)">No distribution data</span>`}
    </div>
  </div>`);
}

function gauge(value, { label = "", max = 100, size = 168, tone } = {}) {
  const v = clamp(Number(value) || 0, 0, max), frac = v / max;
  const r = size / 2 - 14, cx = size / 2, cy = size / 2 + 6;
  const arc = (f) => {
    const a = Math.PI * (1 - f);
    return `${(cx + r * Math.cos(a)).toFixed(1)},${(cy - r * Math.sin(a)).toFixed(1)}`;
  };
  const col = tone || (frac >= .7 ? "var(--ok)" : frac >= .4 ? "var(--warn)" : "var(--bad)");
  const len = Math.PI * r;
  return c3dWrap("gauge", { frac, col, text: NUM(v, v % 1 ? 1 : 0), label, max }, `<div class="gaugeWrap" style="width:${size}px;height:${size * 0.66}px;margin-inline:auto">
    <svg class="chart" viewBox="0 0 ${size} ${size * 0.66}" style="height:${size * 0.66}px">
      <path d="M${arc(0)} A${r},${r} 0 0 1 ${arc(1)}" fill="none" stroke="var(--surface3)" stroke-width="12" stroke-linecap="round"/>
      <path class="gaugeArc" d="M${arc(0)} A${r},${r} 0 0 1 ${arc(1)}" fill="none" stroke="${col}" stroke-width="12" stroke-linecap="round"
        stroke-dasharray="${len.toFixed(1)}" stroke-dashoffset="${(len * (1 - frac)).toFixed(1)}"
        style="--len:${len.toFixed(1)};--off:${(len * (1 - frac)).toFixed(1)}"/>
    </svg>
    <div class="gaugeTxt"><b style="color:${col}">${NUM(v, v % 1 ? 1 : 0)}</b>${label ? `<small>${H(label)}</small>` : ""}</div>
  </div>`);
}

/* Crypto risk map — a real relationship map, built to be read.
 *
 * The first version was a scatter of bright balls with labels landing on top of
 * one another. This keeps the map: nodes sit in a sector per type, edges bundle
 * through the centre as hairline arcs, and the mark carries the risk. Only the
 * riskiest nodes are labelled, so nothing collides; everything else answers on
 * hover. */
const GRAPH_SECTORS = ["scan", "repository", "repo", "asset", "remediation", "fix", "next fix"];
function graphSectorRank(type) {
  const i = GRAPH_SECTORS.indexOf(String(type || "").toLowerCase());
  return i < 0 ? GRAPH_SECTORS.length : i;
}
function graphRiskTone(risk) {
  return risk >= 70 ? "var(--bad)" : risk >= 45 ? "var(--warn)" : risk >= 20 ? "var(--info)" : "var(--ink3)";
}
function forceGraph(nodes, edges, { h = 400, colorBy = "type", labelTop = 7 } = {}) {
  const N = (nodes || []).slice(0, 160);
  if (!N.length) return emptyBox("Graph has no nodes yet — run a scan to populate it", I.network);

  const riskOf = {}, labelOf = {};
  N.forEach(n => {
    riskOf[n.id] = clamp(Number(n.risk_score ?? n.risk ?? 0) || 0, 0, 100);
    labelOf[n.id] = String(n.label || n.id).replace(/^[a-z]+:/, "");
  });

  const byType = new Map();
  N.forEach(n => {
    const t = String(n[colorBy] ?? "node");
    if (!byType.has(t)) byType.set(t, []);
    byType.get(t).push(n);
  });
  const sectors = [...byType.entries()]
    .sort((a, b) => graphSectorRank(a[0]) - graphSectorRank(b[0]) || a[0].localeCompare(b[0]))
    .map(([type, list]) => ({ type, list: list.sort((x, y) => (riskOf[y.id] || 0) - (riskOf[x.id] || 0)) }));

  const w = 900, height = Math.max(340, Math.min(h, 500));
  const cx = w / 2, cy = height / 2;
  // An ellipse, not a circle: labels run sideways, so the map needs a wide band
  // free horizontally and only a little vertically. A circle sized for the
  // horizontal reserve would waste most of the canvas.
  const rx = cx - 152, ry = cy - 44;
  const TAU = Math.PI * 2, gap = sectors.length > 1 ? .10 : 0;

  // Each type owns an arc of the circle; nodes spread along it, and a crowded
  // type steps onto a second ring rather than piling up.
  const pos = {};
  sectors.forEach((sec, si) => {
    const from = si / sectors.length * TAU + gap / 2;
    const to = (si + 1) / sectors.length * TAU - gap / 2;
    const perRing = Math.max(1, Math.ceil(sec.list.length / Math.ceil(sec.list.length / 12)));
    sec.mid = (from + to) / 2;
    sec.list.forEach((n, i) => {
      const step = Math.floor(i / perRing) * 0.14;
      const k = sec.list.length === 1 ? .5 : (i % perRing) / Math.max(1, Math.min(perRing, sec.list.length) - 1);
      const a = from + (to - from) * (Number.isFinite(k) ? k : .5);
      pos[n.id] = { x: cx + Math.cos(a) * rx * (1 - step), y: cy + Math.sin(a) * ry * (1 - step), a };
    });
  });

  const E = (edges || []).filter(e => pos[e.source ?? e.from] && pos[e.target ?? e.to]).slice(0, 500);
  const peak = N.reduce((m, n) => Math.max(m, riskOf[n.id] || 0), 0);
  const QUIET = 18;
  const flowAt = Math.max(QUIET, peak * 0.62);
  const motionOn = peak >= QUIET;

  // Edges bundle toward the middle, which keeps the centre readable instead of
  // filling it with straight lines crossing at every angle.
  const edgeMarkup = E.map(e => {
    const sid = e.source ?? e.from, tid = e.target ?? e.to;
    const a = pos[sid], b = pos[tid];
    const d = `M${a.x.toFixed(1)},${a.y.toFixed(1)} Q${cx.toFixed(1)},${cy.toFixed(1)} ${b.x.toFixed(1)},${b.y.toFixed(1)}`;
    const r = Math.max(riskOf[sid] || 0, riskOf[tid] || 0);
    const tip = `<title>${H(labelOf[sid] || sid)} → ${H(labelOf[tid] || tid)} · risk ${NUM(Math.round(r))}</title>`;
    if (!motionOn || r < flowAt) return `<path class="gedge" d="${d}">${tip}</path>`;
    const rel = peak > flowAt ? (r - flowAt) / (peak - flowAt) : 1;
    return `<path class="gedge flow" style="--edge-speed:${(3.6 - rel * 1.1).toFixed(2)}s" d="${d}">${tip}</path>`;
  }).join("");

  const sectorKey = sectors.map(sec =>
    `<i><span class="gSectorDot" aria-hidden="true"></span>${H(TITLE(sec.type))}<b>${sec.list.length}</b></i>`).join("");

  // Label only what the reader came for; everything else answers on hover.
  const named = new Set([...N].sort((a, b) => (riskOf[b.id] || 0) - (riskOf[a.id] || 0))
    .slice(0, labelTop).map(n => n.id));

  const nodeMarkup = N.map(n => {
    const p = pos[n.id], risk = riskOf[n.id] || 0;
    const rad = 4 + risk / 34;
    const hot = motionOn && risk >= flowAt ? " hot" : "";
    const label = named.has(n.id)
      ? (() => {
          const cos = Math.cos(p.a), lr = 13 + rad;
          const anchor = cos > .3 ? "start" : cos < -.3 ? "end" : "middle";
          const text = labelOf[n.id];
          return `<text class="gLabel" x="${(p.x + Math.cos(p.a) * lr).toFixed(1)}" y="${(p.y + Math.sin(p.a) * lr + 3).toFixed(1)}"
            text-anchor="${anchor}">${H(text.length > 22 ? text.slice(0, 21) + "…" : text)}</text>`;
        })()
      : "";
    return `<g class="gnode${hot}"><title>${H(labelOf[n.id])}${risk ? ` · risk ${NUM(risk)}` : ""} · ${H(TITLE(String(n[colorBy] ?? "node")))}</title>
      <circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${rad.toFixed(1)}" fill="${graphRiskTone(risk)}"/>
      ${label}</g>`;
  }).join("");

  const key = [["Critical", 70], ["High", 45], ["Elevated", 20], ["Low", 0]]
    .map(([k, v]) => `<i><span class="mark" style="background:${graphRiskTone(v)}"></span>${k}</i>`).join("");
  return c3dWrap("graph", {
    h: height, top: [...named],
    nodes: N.map(n => ({ id: n.id, label: labelOf[n.id], type: TITLE(String(n[colorBy] ?? "node")), risk: riskOf[n.id] || 0 })),
    edges: E.map(e => ({ s: e.source ?? e.from, t: e.target ?? e.to })),
  }, `<svg class="chart graphChart" viewBox="0 0 ${w} ${height}" style="height:${height}px" role="img" aria-label="Relationship graph">
    ${edgeMarkup}${nodeMarkup}
  </svg>`) + `
  <div class="legend sectorKey">${sectorKey}</div>
  <div class="legend">${key}</div>`;
}

/* ---------------------------------------------------------------- building blocks */
function emptyBox(msg, icon = I.inbox, title = "Nothing here yet") {
  return `<div class="empty">${icon}<b>${H(title)}</b><p>${H(msg)}</p></div>`;
}
/** True when an endpoint says it has not got enough of your data to answer. */
function unmeasured(d) { return !!d && d.available === false; }
/** The one way the console says "we have not measured this yet".
    It never shows a number, and it says what to do to get one. */
function notEnoughData(d, { title = "Not enough data yet", to = "scans", cta = "Start a TLS scan" } = {}) {
  const min = d?.minimum_data || {};
  const need = Object.entries(min)
    .filter(([k]) => k !== "how_to_get_it")
    .map(([k, v]) => `${NUM(v)} ${String(k).replace(/_/g, " ")}`)
    .join(", ");
  return `<div class="empty">${I.inbox}<b>${H(title)}</b>
    <p>${H(d?.reason || "This figure is measured from your own data, and there is none on record yet.")}</p>
    ${need ? `<p style="font-size:11.5px;color:var(--ink3)">Minimum needed: ${H(need)}. ${H(min.how_to_get_it || "")}</p>` : ""}
    <div class="row" style="justify-content:center;margin-top:10px">${actBtn(cta, "nav", { cls: "btn sm pri", data: { to } })}</div>
  </div>`;
}
function errBox(msg, path = "") {
  return `<div class="banner warn">${I.alert}<div><b>Endpoint unavailable</b>
    <span class="bx">${H(msg)}${path ? ` · <span class="mono">${H(path)}</span>` : ""}</span></div></div>`;
}
/** Render a safe() result: data ? fn(data), failure ? inline notice. */
function bind(r, fn, path = "") {
  if (!r) return errBox("No response", path);
  if (!r.ok) return errBox(r.err, path);
  try { return fn(r.data); }
  catch (e) { return errBox("Render error: " + e.message, path); }
}
function card(title, body, { sub = "", act = "", icon = "", flush = false, lift = true, tight = false } = {}) {
  return `<section class="card${lift ? " lift" : ""}">
    ${title ? `<div class="cardHead"><div class="grow"><h3>${icon}${H(title)}</h3>${sub ? `<p>${H(sub)}</p>` : ""}</div>${act ? `<div class="act">${act}</div>` : ""}</div>` : ""}
    <div class="cardBody${flush ? " flush" : ""}${tight ? " tight" : ""}">${body}</div>
  </section>`;
}
function kpi(label, value, { icon = I.activity, tone = "var(--brand)", sub = "", spark = null, unit = "" } = {}) {
  return `<div class="kpi lift" style="--tone:${tone}">
    <div class="kh">${icon}<small>${H(label)}</small></div>
    <b>${value}${unit ? `<span class="unit">${H(unit)}</span>` : ""}</b>
    ${sub ? `<div class="sub">${sub}</div>` : ""}
    ${spark ? `<div class="spark">${sparkline(spark, { color: tone })}</div>` : ""}
  </div>`;
}
function table(cols, list, { max = "", empty = "No records found", cls = "" } = {}) {
  if (!list || !list.length) return emptyBox(empty);
  /* A scroll container needs to be focusable, or keyboard-only users cannot scroll it
     (WCAG 2.1 "scrollable-region-focusable"). role/label keep it announced sensibly. */
  return `<div class="tw ${cls}" ${max ? `style="--tmax:${max}"` : ""}
    tabindex="0" role="region" aria-label="Scrollable table"><table>
    <thead><tr>${cols.map(c => `<th ${c.num ? 'class="num"' : ""} ${c.w ? `style="width:${c.w}"` : ""}>${H(c.h)}</th>`).join("")}</tr></thead>
    <tbody>${list.map((r, i) => `<tr ${r.__attrs || ""}>${cols.map(c => `<td ${c.num ? 'class="num"' : ""}>${c.f(r, i) ?? "—"}</td>`).join("")}</tr>`).join("")}</tbody>
  </table></div>`;
}
function kvList(pairs) {
  const list = pairs.filter(p => p && p[1] !== undefined && p[1] !== null && p[1] !== "");
  if (!list.length) return emptyBox("No attributes returned");
  return `<dl class="kv">${list.map(([k, v]) => `<dt>${H(k)}</dt><dd>${v}</dd>`).join("")}</dl>`;
}
/** Auto-render an unknown object as a readable key/value card. */
function autoKV(obj, { skip = [], limit = 40 } = {}) {
  if (!isObj(obj)) return `<pre class="out">${H(JSON.stringify(obj, null, 2))}</pre>`;
  const drop = new Set(["api_version", "generated_at", "org_id", "organization_id", ...skip]);
  const pairs = Object.entries(obj)
    .filter(([k, v]) => !drop.has(k) && v !== null && v !== "" && !(Array.isArray(v) && !v.length))
    .slice(0, limit)
    .map(([k, v]) => [TITLE(k), isObj(v) || Array.isArray(v)
      ? `<span class="mono" style="font-size:11px;color:var(--ink3)">${H(JSON.stringify(v).slice(0, 90))}</span>`
      : (typeof v === "number" ? `<span class="mono">${NUM(v, v % 1 ? 2 : 0)}</span>`
        : (TONE(v) ? rawPill(v) : `<span>${H(String(v).slice(0, 160))}</span>`))]);
  // Every field was null, blank or an empty list: say so once instead of drawing
  // a list of empty rows, which is what made several panels look broken.
  if (!pairs.length) return emptyBox("The endpoint answered, but every field was empty.", I.inbox, "Nothing reported");
  return kvList(pairs);
}
function skel(n = 3, h = 42) {
  return `<div class="stack" style="padding:14px">${Array.from({ length: n }, (_, i) =>
    `<div class="sk" style="height:${h}px;opacity:${1 - i * 0.14}"></div>`).join("")}</div>`;
}
function sec(title, body, act = "") {
  return `<section class="sec"><div class="secHead"><h2>${H(title)}</h2><i class="rule"></i>${act}</div>${body}</section>`;
}
function jsonCard(title, data, path) {
  return card(title, `<pre class="out">${H(JSON.stringify(data, null, 2))}</pre>`,
    { icon: I.terminal, sub: path, act: `<button class="btn xs" data-copy='${H(JSON.stringify(data))}'>Copy</button>` });
}
