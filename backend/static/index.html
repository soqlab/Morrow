/* ==========================================================================
   VIEW: HNDL — harvest-now-decrypt-later exposure
   ========================================================================== */
/* HNDL exposure is a question about time: what is captured now, and when it
 * becomes readable. So the view leads with the priority queue and then draws
 * the two curves that set it — exposure accumulating year by year, and the
 * modelled chance each algorithm is broken — against the model's Q-Day. */
const HNDL_CLASS = {
  rsa2048: "RSA-2048", rsa3072: "RSA-3072", rsa4096: "RSA-4096", ecc256: "ECC P-256", ecc384: "ECC P-384",
  x25519: "X25519", dh_classical: "Classical DH", pq_hybrid: "Post-quantum hybrid", pq_pure: "post-quantum", unknown_classical: "Unknown classical",
};
const hndlClass = k => HNDL_CLASS[k] || TITLE(String(k || "unknown"));
const hndlTone = tier => ({ critical: "tBad", high: "tWarn", medium: "tInfo", low: "tOk" })[String(tier || "").toLowerCase()] || "tNa";
const HNDL_TIER_COLOR = { critical: "var(--bad)", high: "var(--warn)", medium: "var(--info)", low: "var(--ok)" };

function hndlExposureChart(timeline, qYear) {
  const pts = (timeline || []).map(p => ({ yr: Number(p.year), v: Number(p.total_exposure_usd ?? p.exposure_usd ?? p.value) || 0 }))
    .filter(p => Number.isFinite(p.yr)).sort((a, b) => a.yr - b.yr);
  if (pts.length < 2) return emptyBox("Exposure accumulates once assets carry harvest windows and data-lifetime metadata.", I.chart, "No timeline yet");
  const W = 640, HT = 250, L = 58, R = 12, T = 26, B = 30;
  const max = Math.max(...pts.map(p => p.v), 1);
  const mag = 10 ** Math.floor(Math.log10(max));
  const top = Math.ceil(max / mag) * mag;
  const slot = (W - L - R) / pts.length, bw = slot * .58;
  const x = i => L + (i + .5) * slot, y = v => T + (HT - T - B) * (1 - v / top);
  const grid = [0, top / 2, top].map(v => `<line class="hxGrid" x1="${L}" x2="${W - R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/>
    <text class="hxAxis" x="${L - 8}" y="${(y(v) + 3).toFixed(1)}" text-anchor="end">${H(USD(v))}</text>`).join("");
  const peak = pts.reduce((m, p, i) => (p.v > pts[m].v ? i : m), 0);
  const bars = pts.map((p, i) => {
    const after = Number.isFinite(Number(qYear)) && p.yr >= Number(qYear);
    const h = Math.max(1, HT - B - y(p.v));
    return `<rect x="${(x(i) - bw / 2).toFixed(1)}" y="${(HT - B - h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" style="fill:${after ? "var(--bad)" : "var(--warn)"};opacity:${after ? .9 : .55}"><title>${p.yr}: ${H(USD(p.v))}</title></rect>
      <text class="hxAxis" x="${x(i).toFixed(1)}" y="${HT - B + 16}" text-anchor="middle">${p.yr}</text>
      ${i === peak || i === pts.length - 1 ? `<text class="hxValue" x="${x(i).toFixed(1)}" y="${(HT - B - h - 7).toFixed(1)}" text-anchor="middle">${H(USD(p.v))}</text>` : ""}`;
  }).join("");
  const qi = pts.findIndex(p => p.yr >= Number(qYear));
  const mark = qi > 0 ? (() => {
    const mx = (L + qi * slot).toFixed(1);
    return `<line class="hxMark" x1="${mx}" x2="${mx}" y1="${T - 12}" y2="${HT - B}"/><text class="hxMarkLabel" x="${(+mx + 6).toFixed(1)}" y="${T - 4}">MODEL Q-DAY ${H(qYear)}</text>`;
  })() : "";
  // The 3D timeline uses the same rounded scale, ticks and Q-Day split as the flat chart it replaces.
  return c3dWrap("timeline", {
    items: pts.map(p => ({ k: String(p.yr), v: p.v, f: USD(p.v) })),
    max: top, ticks: [0, top / 2, top].map(v => ({ v, lab: USD(v) })),
    qYear: qYear ?? null, qIndex: qi, before: "var(--warn)", after: "var(--bad)",
  }, `<svg class="hxChart" viewBox="0 0 ${W} ${HT}" role="img" aria-label="Modelled exposure by year, ${H(USD(pts[0].v))} in ${pts[0].yr} rising to ${H(USD(pts[pts.length - 1].v))} in ${pts[pts.length - 1].yr}">${grid}${mark}${bars}</svg>
    <div class="hxLegend"><span><i style="background:var(--warn);opacity:.55"></i>Captured, still sealed</span><span><i style="background:var(--bad)"></i>Readable after model Q-Day</span></div>`);
}

const HNDL_CURVES = [["rsa2048", "var(--bad)"], ["ecc256", "var(--warn)"], ["rsa4096", "var(--brand)"], ["unknown_classical", "var(--ink3)"]];
function hndlCurveChart(model, qYear) {
  const curves = model?.curves || {};
  const series = HNDL_CURVES.map(([k, color]) => ({
    k, color, pts: (curves[k] || []).map(p => ({ yr: Number(p.year), p: Number(p.probability) })).filter(p => Number.isFinite(p.yr) && Number.isFinite(p.p)),
  })).filter(s => s.pts.length > 1);
  if (!series.length) return emptyBox("The quantum model returned no probability curves.", I.chart, "No curves");
  const W = 640, HT = 250, L = 44, R = 14, T = 26, B = 30;
  const years = series.flatMap(s => s.pts.map(p => p.yr));
  const y0 = Math.min(...years), y1 = Math.max(...years);
  const x = yr => L + (yr - y0) / Math.max(1, y1 - y0) * (W - L - R), y = p => T + (1 - p) * (HT - T - B);
  const grid = [0, .25, .5, .75, 1].map(p => `<line class="${p === .5 ? "hxHalf" : "hxGrid"}" x1="${L}" x2="${W - R}" y1="${y(p).toFixed(1)}" y2="${y(p).toFixed(1)}"/>
    <text class="hxAxis" x="${L - 8}" y="${(y(p) + 3).toFixed(1)}" text-anchor="end">${p * 100}%</text>`).join("");
  const step = y1 - y0 > 10 ? 2 : 1;
  const ticks = [];
  for (let yr = y0; yr <= y1; yr += step) ticks.push(`<text class="hxAxis" x="${x(yr).toFixed(1)}" y="${HT - B + 16}" text-anchor="middle">${yr}</text>`);
  const q = Number(qYear);
  const mark = Number.isFinite(q) && q >= y0 && q <= y1
    ? `<line class="hxMark" x1="${x(q).toFixed(1)}" x2="${x(q).toFixed(1)}" y1="${T - 12}" y2="${HT - B}"/><text class="hxMarkLabel" x="${(x(q) + 6).toFixed(1)}" y="${T - 4}">MODEL Q-DAY ${q}</text>` : "";
  const lines = series.map(s => {
    const d = s.pts.map((p, i) => `${i ? "L" : "M"}${x(p.yr).toFixed(1)},${y(p.p).toFixed(1)}`).join(" ");
    const atQ = s.pts.find(p => p.yr === q);
    return `<path d="${d}" style="fill:none;stroke:${s.color};stroke-width:2;stroke-linejoin:round"${s.k === "unknown_classical" ? ' stroke-dasharray="5 4"' : ""}/>
      ${atQ ? `<circle cx="${x(q).toFixed(1)}" cy="${y(atQ.p).toFixed(1)}" r="3.5" style="fill:${s.color}"><title>${H(hndlClass(s.k))} ${q}: ${PCT(atQ.p * 100)}</title></circle>` : ""}`;
  }).join("");
  const half = model?.q_day_50pct_estimates || {};
  return c3dWrap("curves", {
    qYear: Number.isFinite(q) ? q : null,
    series: series.map(s => ({ k: s.k, label: hndlClass(s.k), color: s.color, dash: s.k === "unknown_classical", half: half[s.k] || null, pts: s.pts })),
  }, `<svg class="hxChart" viewBox="0 0 ${W} ${HT}" role="img" aria-label="Probability each algorithm is broken, by year">${grid}${ticks.join("")}${mark}${lines}
      <text class="hxAxis" x="${W - R}" y="${(y(.5) - 6).toFixed(1)}" text-anchor="end">50% LINE</text></svg>
    <div class="hxLegend">${series.map(s => `<span><i style="background:${s.color}"></i>${H(hndlClass(s.k))}${half[s.k] ? ` <b>50% by ${H(half[s.k])}</b>` : ""}</span>`).join("")}</div>`);
}

/* ==========================================================================
   VIEW: GRAPH — security graph, blast radius, contagion
   ========================================================================== */
/* Blast Radius draws each graph as a blast. The node being examined sits at the
 * centre and whatever depends on it lands on rings by hop count; a shock ring
 * travels out across them and each node flashes as it is reached. What the
 * selection depends on sits to its left, and everything unrelated orbits the
 * outside, dimmed, so the whole estate stays in view. A lone chain with nothing
 * around it opens as a fan from the left edge instead of a mostly empty circle. */
const lgLabel = n => String(n?.label || n?.asset_key || n?.id || "").replace(/^[a-z]+:/, "");
const lgRisk = n => {
  const s = Number(n?.risk_score ?? n?.risk);
  if (Number.isFinite(s)) return clamp(s, 0, 100);
  return ({ critical: 90, high: 70, medium: 45, low: 20 })[String(n?.risk_level || "").toLowerCase()] ?? 0;
};
function layerGraph(key, nodes, edges, { empty = "Graph has no nodes yet — run a scan to populate it" } = {}) {
  const N = (nodes || []).slice(0, 120);
  if (!N.length) return emptyBox(empty, I.network);
  const ids = new Set(N.map(n => n.id));
  const E = (edges || []).map(e => ({ from: e.source ?? e.from, to: e.target ?? e.to, type: e.type || e.edge_type || "" }))
    .filter(e => ids.has(e.from) && ids.has(e.to) && e.from !== e.to).slice(0, 400);
  (S.layerGraphs ||= {})[key] = { nodes: N, edges: E };
  const linked = new Set(E.flatMap(e => [e.from, e.to]));
  const loose = N.filter(n => !linked.has(n.id)).length;
  const ranked = [...N].sort((a, b) => lgRisk(b) - lgRisk(a)).slice(0, 12);
  return `<div class="lgWrap blast" data-lg="${H(key)}">
    <div class="bwStage">
      <canvas role="img" aria-label="Blast radius diagram for ${NUM(N.length)} nodes. Choose a node from the ranked list to move the blast."></canvas>
      <div class="bwKey">
        <span><i class="k-focus"></i>Failure point</span>
        <span><i class="k-hit"></i>Affected</span>
        <span><i class="k-up"></i>Depends on</span>
        <span><i class="k-rest"></i>Unaffected${loose ? ` · ${NUM(loose)} unlinked` : ""}</span>
        <span class="bwHint">Click any node to move the blast</span>
      </div>
    </div>
    <aside class="lgSide">
      <div class="lgFocus" aria-live="polite"></div>
      <div><span class="vendLabel">Ranked by risk</span>
        <ol class="lgRank">${ranked.map(n => `<li><button type="button" data-id="${H(n.id)}">${H(lgLabel(n))}
          <small>${H(TITLE(String(n.type || "node")))}</small><b>${lgRisk(n) ? NUM(lgRisk(n)) : "—"}</b></button></li>`).join("")}</ol></div>
    </aside></div>`;
}

function blastStage(wrap, G, out, inc, pick) {
  const canvas = wrap.querySelector(".bwStage canvas");
  const ctx = canvas.getContext("2d");
  const byId = Object.fromEntries(G.nodes.map(n => [n.id, n]));
  const reduced = matchMedia("(prefers-reduced-motion: reduce)");
  const still = () => reduced.matches || document.body.dataset.motion === "paused" || document.hidden;
  const TAU = Math.PI * 2;
  let W = 0, HT = 0, ratio = 1, raf = 0, last = 0, clock = 0, visible = true, hover = null;
  let orbit = 0, view = null;   // camera sway, and the last projection for hit-testing
  let focusId = null, dist = new Map(), parent = new Map(), upSet = new Set();
  let fan = false, center = { x: 0, y: 0 }, rings = [];
  let from = {}, target = {}, tweenAt = -1e9;
  let P = palette();

  function palette() {
    const s = getComputedStyle(wrap), v = (name, fallback) => s.getPropertyValue(name).trim() || fallback;
    return {
      bad: v("--bad", "#E46E62"), warn: v("--warn", "#D4913F"), info: v("--info", v("--brand", "#7B6BFF")),
      brand: v("--brand", "#7B6BFF"), ink: v("--ink", "#E9EDF4"), ink2: v("--ink2", "#B8C0CC"), ink3: v("--ink3", "#8A94A6"),
      line: v("--line", "#1A2130"), ground: v("--surface", "#0A0E15"),
    };
  }
  const tone = r => (r >= 70 ? P.bad : r >= 45 ? P.warn : r >= 20 ? P.info : P.ink3);
  const ease = k => 1 - Math.pow(1 - k, 3);
  const at = (id, now) => {
    const b = target[id];
    if (!b) return null;
    const a = from[id] || { x: center.x, y: center.y };
    const k = ease(clamp((now - tweenAt) / 480, 0, 1));
    return { x: a.x + (b.x - a.x) * k, y: a.y + (b.y - a.y) * k };
  };

  function layout() {
    if (!W || !focusId) return;
    const next = {};
    const maxHop = Math.max(0, ...dist.values());
    const others = G.nodes.filter(n => n.id !== focusId && !dist.has(n.id) && !upSet.has(n.id));
    const children = new Map();
    parent.forEach((p, id) => { if (!children.has(p)) children.set(p, []); children.get(p).push(id); });
    const leaves = id => { const c = children.get(id) || []; return c.length ? c.reduce((s, k) => s + leaves(k), 0) : 1; };
    fan = maxHop > 0 && !others.length && !upSet.size;
    if (fan) {
      center = { x: Math.max(70, W * .1), y: HT / 2 };
      const reach = Math.max(120, W - center.x - (W < 560 ? 44 : 170));
      rings = Array.from({ length: maxHop }, (_, i) => {
        const rx = reach * (i + 1) / maxHop;
        return { rx, ry: Math.min(rx, HT / 2 - 56) };
      });
    } else {
      center = { x: W / 2, y: HT / 2 + 6 };
      // On a phone the labels go under the nodes, so the rings can use the width.
      const RX = W < 560 ? W / 2 - 46 : Math.max(80, W / 2 - 160), RY = W < 560 ? HT / 2 - 64 : Math.max(60, HT / 2 - 50);
      const inner = others.length ? .72 : 1;
      rings = Array.from({ length: maxHop }, (_, i) => ({ rx: RX * inner * (i + 1) / maxHop, ry: RY * inner * (i + 1) / maxHop }));
      const ups = [...upSet], r1 = rings[0] || { rx: RX * .42, ry: RY * .42 };
      ups.forEach((id, i) => {
        const a = Math.PI + (ups.length === 1 ? 0 : (i / (ups.length - 1) - .5) * Math.PI * .5);
        next[id] = { x: center.x + Math.cos(a) * r1.rx, y: center.y + Math.sin(a) * r1.ry };
      });
      others.forEach((n, i) => {
        const a = -Math.PI / 2 + (i + .5) / others.length * TAU;
        next[n.id] = { x: center.x + Math.cos(a) * RX, y: center.y + Math.sin(a) * RY };
      });
    }
    // Children share their parent's angular sector in proportion to what hangs below them.
    // A full circle is rotated so first-hop nodes sit across the horizontal axis
    // (right and left for two, a triangle for three) where their labels have room.
    const firstHop = (children.get(focusId) || []).length || 1;
    const lo = fan ? -Math.PI * .34 : upSet.size ? -Math.PI * .72 : -Math.PI + (firstHop === 1 ? 0 : Math.PI / firstHop);
    const hi = fan ? Math.PI * .34 : upSet.size ? Math.PI * .72 : lo + TAU;
    const place = (id, a0, a1) => {
      const c = children.get(id) || [];
      const total = c.reduce((s, k) => s + leaves(k), 0) || 1;
      let cursor = a0;
      c.forEach(k => {
        const span = (a1 - a0) * leaves(k) / total, mid = cursor + span / 2, ring = rings[dist.get(k) - 1];
        next[k] = { x: center.x + Math.cos(mid) * ring.rx, y: center.y + Math.sin(mid) * ring.ry };

      });

  }

  function focus(id) {

    dist = new Map(); parent = new Map();

      const cur = queue.shift();

      }
    }
    upSet = new Set();
    const stack = [...(inc.get(id) || [])];

    layout();
    from = snapshot;

  function quad(a, b) {
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2, dx = b.x - a.x, dy = b.y - a.y;

    else {
      ctx.lineWidth = 1; ctx.strokeStyle = P.line; ctx.globalAlpha = .5; ctx.beginPath();
      for (let x = 14; x < W; x += 28) { ctx.moveTo(Math.round(x) + .5, 0); ctx.lineTo(Math.round(x) + .5, HT); }
      for (let y = 14; y < HT; y += 28) { ctx.moveTo(0, Math.round(y) + .5); ctx.lineTo(W, Math.round(y) + .5); }
      ctx.stroke(); ctx.globalAlpha = 1;
    }
    if (!focusId) return;

    const outerRing = rings[rings.length - 1];
    const wave = still() || !outerRing ? -1 : (clock % 2.8) / 2.8;
    const arc = (rx, ry) => { d.beginPath(); fan ? d.ellipse(center.x, center.y, rx, ry, 0, -1.2, 1.2) : d.ellipse(center.x, center.y, rx, ry, 0, 0, TAU); };

    // Hop rings lie on the floor. A fan labels them as a ruler along the bottom;
    // a circle labels them at the upper left, where nodes rarely land.
    floor(true);
    ctx.font = '500 9.5px "IBM Plex Mono", ui-monospace, monospace'; ctx.textBaseline = "middle";
    if (fan && rings.length) {

    }

      ctx.setLineDash([3, 6]); ctx.strokeStyle = P.ink3; ctx.globalAlpha = .38; ctx.lineWidth = 1; arc(r.rx, r.ry); ctx.stroke();

      const a = at(e.from, now), b = at(e.to, now);

      const upstream = (e.to === focusId || upSet.has(e.to)) && upSet.has(e.from);

      ctx.stroke();
      ctx.setLineDash([]);

          const q = c((clock * .5 + i * .17 + offset) % 1);

          ctx.globalAlpha = .95; ctx.fillStyle = P.bad; ctx.beginPath(); ctx.arc(q.x, q.y, 2.4 * q.s, 0, TAU); ctx.fill();

    });
    ctx.globalAlpha = 1; ctx.lineWidth = 1;

    // Nodes: unaffected first, the failure point last so it always sits on top;
    // within a group nearer nodes draw over farther ones.

    const nearness = id => { const p = at(id, now); return p ? pt(p.x, p.y).s : 0; };
    const order = [...G.nodes].sort((a, b) => rank(a.id) - rank(b.id) || nearness(a.id) - nearness(b.id));

    const labelAll = G.nodes.length <= 16 && W >= 560;
    const centerS = pt(center.x, center.y).x;
    order.forEach(n => {
      const p = at(n.id, now);
      if (!p) return;
      const isFocus = n.id === focusId, hop = dist.get(n.id), up = upSet.has(n.id), rest = !isFocus && hop == null && !up;
      const risk = lgRisk(n), exposure = Number(n.exposure_usd) || 0;
      const r = isFocus ? 12 : rest ? 4.5 : 7 + Math.min(4, Math.log10(1 + exposure) / 1.6);
      let flash = 0;

          glow: isFocus || hop != null ? P.bad : null, glowA: isFocus ? .9 : .4 + flash,

        } else if (hop != null) {
          ctx.globalAlpha = .16 + flash * .5; ctx.fillStyle = P.bad;

        }

        ctx.fillStyle = rest ? P.ink3 : isFocus ? P.ground : tone(risk);

      }

      // Labels are placed in screen space around the node's projected position.
      const q = pt(p.x, p.y, g ? z : undefined), rs = r * q.s;
      const name = lgLabel(n), type = TITLE(String(n.type || "node")).toUpperCase();
      const text = name.length > 26 ? name.slice(0, 25) + "…" : name;
      ctx.textBaseline = "middle";
      if (isFocus) {

        const lx = fan ? q.x - 10 : q.x, ly = W < 560 ? q.y - rs - 36 : q.y + rs + 22;

        ctx.textAlign = "center";
        ctx.globalAlpha = rest && hover !== n.id ? .7 : 1;
        ctx.font = '500 8.5px "IBM Plex Mono", ui-monospace, monospace'; ctx.fillStyle = hop != null ? P.bad : P.ink3;
        // Along a fan, alternate below and above so neighbouring hops never share a baseline.

        ctx.font = `${rest ? 500 : 600} 11px "IBM Plex Sans", system-ui, sans-serif`; ctx.fillStyle = rest ? P.ink2 : P.ink;
        const half = ctx.measureText(brief).width / 2 + 4;
        ctx.fillText(brief, clamp(q.x, half, W - half), above ? q.y - rs - 9 : q.y + rs + 24);
        ctx.globalAlpha = 1;

      }
      const caption = hop != null ? `HOP ${hop} · ${type}` : up ? `UPSTREAM · ${type}` : type;
      ctx.font = `${rest ? 500 : 600} 12.5px "IBM Plex Sans", system-ui, sans-serif`;
      const need = Math.max(ctx.measureText(text).width, caption.length * 6) + rs + 14;
      // Prefer the outward side, but never let a label run off the canvas.
      let right = fan || q.x >= centerS;
      if (right && q.x + need > W - 4) right = false;
      else if (!right && q.x - need < 4) right = true;
      ctx.textAlign = right ? "left" : "right";
      const lx = q.x + (right ? rs + 9 : -(rs + 9));
      ctx.globalAlpha = rest && hover !== n.id ? .7 : 1;
      ctx.font = '500 9px "IBM Plex Mono", ui-monospace, monospace'; ctx.fillStyle = hop != null ? P.bad : P.ink3;
      ctx.fillText(caption, lx, q.y - 8);
      ctx.font = `${rest ? 500 : 600} 12.5px "IBM Plex Sans", system-ui, sans-serif`; ctx.fillStyle = rest ? P.ink2 : P.ink;
      ctx.fillText(text, lx, q.y + 7);
      ctx.globalAlpha = 1;
    });
  }

  function frame(now) {
    raf = 0;
    if (!wrap.isConnected) { teardown(); return; }
    if (!last) last = now;
    const dt = Math.min(.1, (now - last) / 1000);
    last = now;
    if (!still()) { clock += dt; orbit += dt; }
    if (W) draw(now);
    const tweening = now - tweenAt < 500;
    // A re-focus tween runs at full rate; the resting sway is paced to ~30fps.
    if (visible && W && tweening) raf = requestAnimationFrame(frame);

    else last = 0;
  }

  function wake() {
    if (blastTimer) { clearTimeout(blastTimer); blastTimer = 0; }
    if (!raf) raf = requestAnimationFrame(frame);
  }
  function fit() {
    const rect = canvas.getBoundingClientRect();
    W = rect.width; HT = rect.height;
    ratio = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.max(1, Math.round(W * ratio));
    canvas.height = Math.max(1, Math.round(HT * ratio));

    from = {};
    tweenAt = -1e9;
    wake();
  }

    const rect = canvas.getBoundingClientRect(), x = ev.clientX - rect.left, y = ev.clientY - rect.top, now = performance.now();

  io.observe(canvas);

}

function wireLayerGraphs(root) {
  root.querySelectorAll(".lgWrap[data-lg]").forEach(wrap => {
    const G = S.layerGraphs?.[wrap.dataset.lg];
    if (!G || wrap.__lg) return;
    wrap.__lg = true;
    const out = new Map(), inc = new Map();
    const push = (m, k, v) => { if (!m.has(k)) m.set(k, []); m.get(k).push(v); };
    G.edges.forEach(e => { push(out, e.from, e.to); push(inc, e.to, e.from); });
    const walk = (start, adj) => {
      const seen = new Set(), stack = [...(adj.get(start) || [])];
      while (stack.length) { const id = stack.pop(); if (id === start || seen.has(id)) continue; seen.add(id); stack.push(...(adj.get(id) || [])); }
      return seen;
    };
    const byId = Object.fromEntries(G.nodes.map(n => [n.id, n]));
    const focusPanel = wrap.querySelector(".lgFocus");
    let stage = null;
    const select = id => {
      const n = byId[id];
      if (!n) return;
      const down = walk(id, out), up = walk(id, inc);
      up.forEach(k => { if (down.has(k)) up.delete(k); });
      stage?.focus(id);
      wrap.querySelectorAll(".lgRank [data-id]").forEach(el => el.classList.toggle("sel", el.dataset.id === id));
      const exposure = [id, ...down].reduce((s, k) => s + (Number(byId[k]?.exposure_usd) || 0), 0);
      const facts = [
        n.key_type ? ["Key", `${n.key_type}${Number(n.key_bits) ? ` ${n.key_bits}` : ""}`] : null,
        n.tls_version ? ["TLS", n.tls_version] : null,
        n.owner ? ["Owner", n.owner] : null,
        n.host_count ? ["Hosts", NUM(n.host_count)] : null,
      ].filter(Boolean);
      focusPanel.innerHTML = `<span class="vendLabel">${H(TITLE(String(n.type || "node")))}${n.risk_level ? ` · ${H(n.risk_level)} risk` : ""}</span>
        <h4>${H(lgLabel(n))}</h4>
        <p>${down.size ? `If this fails, ${NUM(down.size)} dependent node${down.size === 1 ? " is" : "s are"} affected.` : "Nothing recorded downstream depends on this node."}</p>
        <div class="lgReach${exposure ? "" : " three"}">
          <div><b>${NUM(down.size)}</b><span>Affected</span></div>
          <div><b>${NUM(up.size)}</b><span>Depends on</span></div>
          <div><b>${lgRisk(n) ? NUM(lgRisk(n)) : "—"}</b><span>Risk score</span></div>
          ${exposure ? `<div><b>${USD(exposure)}</b><span>Exposure</span></div>` : ""}
        </div>
        ${down.size ? `<ul class="lgList">${[...down].slice(0, 8).map(k => `<li><i style="background:${graphRiskTone(lgRisk(byId[k]))}"></i>${H(lgLabel(byId[k]))}<small>${H(TITLE(String(byId[k].type || "")))}</small></li>`).join("")}</ul>` : ""}
        ${facts.length ? `<dl class="lgFacts">${facts.map(([k, v]) => `<div><dt>${H(k)}</dt><dd>${H(v)}</dd></div>`).join("")}</dl>` : ""}`;
    };
    wrap.addEventListener("click", ev => {
      const el = ev.target.closest(".lgRank [data-id]");
      if (el && wrap.contains(el)) select(el.dataset.id);
    });
    stage = blastStage(wrap, G, out, inc, select);
    // Open on the node whose failure reaches furthest, so the graph starts by answering its own question.
    const start = [...G.nodes].sort((a, b) => walk(b.id, out).size - walk(a.id, out).size || lgRisk(b) - lgRisk(a))[0];
    if (start) select(start.id);
  });
}

/* Canaries read as a ladder: five tripwires in order of the capability it takes
 * to break them, so the first one to trip says how far an attacker has got.
 * Only the tier being read shows its playbook; five expanded playbooks at once
 * made the page a wall nobody would scan during an incident. */
const CANARY_ORDER = ["alpha", "beta", "gamma", "delta", "omega"];
const canaryColor = c => /^#[0-9a-f]{3,8}$/i.test(String(c || "")) ? c : "var(--ok)";
function canaryDetail(k, t) {
  const tone = TONE(t.severity) === "bad" ? "bad" : "warn";
  const deployed = Number(t.deployed) || 0;
  return `<div class="tripDetailHead">
      <div><span class="vendLabel">${H(TITLE(k))} · ${H(t.algo || "")}${k === "omega" ? " · control canary" : ""}</span>
        <h3>${H(vendorText(t.description || ""))}</h3></div>
      ${pill(t.severity)}
    </div>
    ${t.urgency ? `<div class="tripUrgency ${tone}">${I.zap}<span>${H(vendorText(t.urgency))}</span></div>` : ""}
    ${(t.playbook || []).length ? `<span class="vendLabel">If it trips</span>
      <ol class="tripPlaybook">${t.playbook.map(p => `<li>${H(vendorText(p))}</li>`).join("")}</ol>` : ""}
    <div class="row">${actBtn(`Deploy ${TITLE(k)} canary`, "canDeploy", { cls: "btn sm pri", icon: I.plus, data: { tier: k } })}
      <span class="tripNote">${deployed ? `${NUM(deployed)} deployed` : "Not deployed yet"}</span></div>`;
}

/* ==========================================================================
   VIEW: VENDORS — assessments, scorecards, attestations
   ========================================================================== */
/* Third Party renders one ranked readiness matrix rather than a card per vendor:
 * with twenty-odd suppliers the question is "who is behind, and on what", and a
 * wall of identical cards answers neither. Dimension scores become heat cells so
 * a weak column reads across every vendor at once. */
const VENDOR_DIM_SHORT = {
  "Algorithm Support": "Algorithms", "TLS / Key Exchange": "Key exchange", "HSM / KMS Support": "HSM / KMS",
  "Roadmap Clarity": "Roadmap", "Standards Participation": "Standards", "Customer Tooling": "Tooling",
};
const vendorDimShort = label => VENDOR_DIM_SHORT[label] || label;
function vendorDimensions(list) {
  const seen = new Map();
  list.forEach(v => Object.entries(v.scores || {}).forEach(([k, s]) => { if (!seen.has(k)) seen.set(k, s?.label || TITLE(k)); }));
  return [...seen];
}
const vendorScore = (v, k) => { const s = v.scores?.[k]; const n = Number(s?.score ?? s); return Number.isFinite(n) ? n : null; };
const vendorSortValue = (v, key) => key === "name" ? String(v.name || "").toLowerCase()
  : key === "composite" ? Number(v.composite_score) || 0 : vendorScore(v, key) ?? -1;
// Tier colour comes from our tokens, not the server's tier_color, so it holds contrast in both themes.
const vendorTierTone = tier => /ready/i.test(tier || "") ? "tOk" : /progress|partial/i.test(tier || "") ? "tInfo"
  : /early/i.test(tier || "") ? "tWarn" : "tBad";
const vendorHeat = s => s == null ? "" : s >= 90 ? "h4" : s >= 75 ? "h3" : s >= 50 ? "h2" : s >= 35 ? "h1" : "h0";
// Some upstream vendor notes arrive double-encoded (UTF-8 read as Latin-1); repair the common marks.
const vendorText = s => String(s ?? "").replace(/â€”/g, "—").replace(/â€“/g, "–").replace(/â€™/g, "’").replace(/â€œ|â€/g, "\"");
function vendorRows(list, dims) {
  return list.map((v, i) => {
    const tone = vendorTierTone(v.readiness_tier);
    const composite = Number(v.composite_score) || 0;
    return `<tr>
      <td class="num rank">${i + 1}</td>
      <td><b>${H(v.name)}</b><span class="sub">${H(v.category_label || v.category || "")}</span></td>
      <td><span class="tierChip ${tone}"><i></i>${H(v.readiness_tier || "—")}</span></td>
      <td class="num"><span class="vendScore ${tone}"><b>${NUM(composite, 1)}</b><span class="dimMeter"><i style="width:${clamp(composite, 0, 100)}%"></i></span></span></td>
      ${dims.map(([k, label]) => { const s = vendorScore(v, k);
        return `<td class="num vHeat ${vendorHeat(s)}" title="${H(label)}: ${s == null ? "not scored" : NUM(s, 0)}">${s == null ? "—" : NUM(s, 0)}</td>`; }).join("")}
      <td class="num">${actBtn("Detail", "vendDetail", { cls: "btn xs ghost", data: { id: v.id || v.name } })}</td></tr>`;
  }).join("");
}

        : `<tr><td class="vendNone" colspan="${dims.length + 5}">No vendors match this filter.</td></tr>`;
      wire(body);
    };
    $$("[data-sort]", host).forEach(b => { b.onclick = () => {
      const key = b.dataset.sort;
      dir = key === sortKey ? -dir : key === "name" ? 1 : -1;
      sortKey = key;
      $$("th[aria-sort]", host).forEach(th => th.removeAttribute("aria-sort"));
      b.closest("th").setAttribute("aria-sort", dir > 0 ? "ascending" : "descending");
      draw();
    }; });
    $("#vendQ").oninput = e => { q = e.target.value.trim().toLowerCase(); draw(); };
    $$("#vendCats [data-cat]", host).forEach(b => { b.onclick = () => {
      cat = b.dataset.cat;
      $$("#vendCats [data-cat]", host).forEach(x => x.classList.toggle("on", x === b));
      draw();
    }; });
    draw();
  }
  navBadge("vendors", A.filter(x => /pending|sent/i.test(x.status || "")).length || "");
};

ACTIONS.askSend = async () => {
  const input = $("#chatIn"), log = $("#chatLog");
  const q = input.value.trim();
  if (!q) return;
  input.value = "";
  log.insertAdjacentHTML("beforeend", `<div style="justify-self:end;max-width:82%;background:var(--brand);color:#03121a;
    padding:9px 13px;border-radius:0;font-size:12.5px;line-height:1.5">${H(q)}</div>`);
  const id = "a" + Date.now();
  log.insertAdjacentHTML("beforeend", `<div id="${id}" class="sk" style="height:52px;max-width:82%;border-radius:0"></div>`);
  log.scrollTop = log.scrollHeight;
  let r = await safe("/agent/chat", { method: "POST", body: { message: q, question: q } });
  if (!r.ok) r = await safe("/assistant/chat", { method: "POST", body: { message: q, question: q } });
  const node = $("#" + id);
  const text = r.ok ? (r.data.reply || r.data.answer || r.data.response || r.data.message
    || (typeof r.data === "string" ? r.data : JSON.stringify(r.data, null, 2))) : `Assistant unavailable — ${r.err}`;
  node.className = "";
  node.style.cssText = `max-width:82%;background:var(--surface2);border:1px solid var(--line);padding:11px 13px;
    border-radius:0;font-size:12.5px;line-height:1.6;white-space:pre-wrap;${r.ok ? "" : "color:var(--bad)"}`;
  node.textContent = text;
  log.scrollTop = log.scrollHeight;
};

/* ---- Launch readiness: evaluated from what the server actually reports, not a static list. ---- */
function chkRow(state, title, detail) {
  const ic = state === "ok" ? I.check : state === "warn" ? I.alert : I.x;
  return `<div class="chk-row"><span class="chk-ico chk-${state}">${ic}</span>
    <div class="grow"><b>${H(title)}</b><div class="cd">${detail}</div></div></div>`;
}
function readinessPanel(C, cfg, health, e2e, plat) {
  const warns = S.warns || [];
  const hv = health.ok ? health.data : null;
  const probes = Array.isArray(hv?.checks) ? hv.checks : [];
  const failing = probes.filter(p => TONE(p.status) !== "ok");
  const platOff = plat.ok === false || /disabled/i.test(JSON.stringify(plat.data || ""));
  const w = (re) => warns.find(x => re.test(x));

  const authModeWarn = w(/MORROW_AUTH_MODE=headers/i);
  const roleWarn     = w(/MORROW_DEFAULT_ROLE=admin/i);
  const sentryWarn   = w(/SENTRY_DSN/i);
  const hs256Warn    = w(/HS256/i);
  const corsWarn     = w(/CORS/i);
  const redisWarn    = w(/BROKER_URL|redis/i);

  const items = [
    authModeWarn
      ? chkRow("bad", "Authentication mode",
          `Running in <code>headers</code> mode: any caller can choose their own role. Set <code>MORROW_AUTH_MODE=jwt</code> and <code>MORROW_AUTH_REQUIRED=1</code>.`)
      : chkRow("ok", "Authentication mode",
          `<code>${H(C.auth_mode || cfg.mode || "jwt")}</code>${cfg.required ? " and required" : ""}.`),
    roleWarn
      ? chkRow("bad", "Default role for anonymous requests",
          `<code>MORROW_DEFAULT_ROLE=admin</code> — unauthenticated requests inherit admin. Set it to <code>viewer</code>.`)
      : chkRow("ok", "Default role", "Anonymous requests do not inherit admin."),
    hs256Warn
      ? chkRow("warn", "JWT signing algorithm",
          `HS256 is a shared secret. Production expects RS256 with a JWKS URL — see <code>MORROW_AUTH_JWT_ALGORITHMS</code>.`)
      : chkRow("ok", "JWT signing algorithm", `Accepted: <code>${H((cfg.mode === "jwt" ? "configured" : "n/a"))}</code>.`),
    corsWarn
      ? chkRow("bad", "CORS", `Wildcard CORS is set. Restrict <code>MORROW_CORS_ORIGINS</code> to approved domains.`)
      : chkRow("ok", "CORS", "No wildcard origin configured."),
    sentryWarn
      ? chkRow("warn", "Error reporting", `<code>SENTRY_DSN</code> is unset, so runtime exceptions are not reported anywhere.`)
      : chkRow("ok", "Error reporting", "Sentry DSN configured."),
    redisWarn
      ? chkRow("warn", "Broker credentials", `The Celery broker URL has no password. Set <code>REDIS_PASSWORD</code> and include it in the URL.`)
      : chkRow("ok", "Task broker", "Broker URL configured with credentials, or not in use."),
    failing.length
      ? chkRow("warn", `Subsystem probes (${NUM(failing.length)} not OK)`,
          failing.map(p => `<code>${H(p.name)}</code>`).join(" ") + (failing.some(p => p.detail) ? `<br>${H(failing.find(p => p.detail).detail)}` : ""))
      : chkRow("ok", "Subsystem probes", `${NUM(probes.length || 0)} checks reporting healthy.`),
    platOff
      ? chkRow("warn", "Platform admin endpoints",
          `Disabled. Set <code>MORROW_PLATFORM_ADMIN_KEY</code> to enable customer management, incidents and autopatch review.`)
      : chkRow("ok", "Platform admin endpoints", "Enabled."),
    e2e.ok
      ? chkRow("ok", "End-to-end readiness", "The scan-to-remediation cycle reports reachable.")
      : chkRow("warn", "End-to-end readiness", `<code>/readiness/e2e</code> unavailable: ${H(String(e2e.err || "").slice(0, 90))}`),
  ];
  const bad = (items.join("").match(/chk-bad/g) || []).length;
  const warn = (items.join("").match(/chk-warn/g) || []).length;
  const okc = (items.join("").match(/chk-ok/g) || []).length;

  return `<div class="g g4" style="margin-bottom:14px">
      ${kpi("Blocking", NUM(bad), { icon: I.x, tone: "var(--bad)", sub: bad ? "must fix before launch" : "none" })}
      ${kpi("Advisories", NUM(warn), { icon: I.alert, tone: "var(--warn)", sub: "recommended before launch" })}
      ${kpi("Passing", NUM(okc), { icon: I.check, tone: "var(--ok)" })}
      ${kpi("Verdict", bad ? "Not ready" : warn ? "Ready with caveats" : "Launch ready",
        { icon: I.flag, tone: bad ? "var(--bad)" : warn ? "var(--warn)" : "var(--ok)" })}
    </div>
    ${bad ? `<div class="banner bad" style="margin-bottom:14px">${I.alert}<div>
      <b>${NUM(bad)} blocking issue${bad === 1 ? "" : "s"} for a public deployment</b>
      <span class="bx">These let an unauthenticated caller act as an administrator. Fix them before
      exposing this server to a network you do not control.</span></div></div>` : ""}
    ${card("Pre-launch checklist", items.join(""), {
      icon: I.shield, sub: "Derived from this server's own /health advisories and probes",
      act: actBtn("Re-check", "retry", { cls: "btn xs ghost" }) })}
    <div style="height:14px"></div>
    <div class="g g2">
      ${card("Recommended production environment", `<pre class="out" style="--pmax:320px">${H(
`MORROW_ENVIRONMENT=production
MORROW_AUTH_MODE=jwt
MORROW_AUTH_REQUIRED=1
MORROW_DEFAULT_ROLE=viewer
MORROW_AUTH_JWT_ALGORITHMS=RS256
MORROW_AUTH_JWT_ISSUER=https://your-idp/
MORROW_AUTH_JWT_AUDIENCE=morrow
MORROW_AUTH_JWT_JWKS_URL=https://your-idp/.well-known/jwks.json
MORROW_ADMIN_PASSWORD=<strong unique value>
MORROW_VAULT_MASTER_KEY=<Fernet key>
MORROW_PLATFORM_ADMIN_KEY=<random value>
MORROW_CORS_ORIGINS=https://console.example.com
DATABASE_URL=postgresql://...
CELERY_BROKER_URL=redis://:PASSWORD@host:6379/0
SENTRY_DSN=https://...`)}</pre>`,
        { icon: I.terminal, sub: "The server refuses to boot in production without most of these",
          act: `<button class="btn xs" data-copy="MORROW_ENVIRONMENT=production">Copy first line</button>` })}
      ${card("Server advisories", warns.length
        ? `<div class="stack">${warns.map(x => `<div class="banner warn" style="font-size:11.5px;padding:9px 11px">${I.alert}
            <div><span class="bx">${H(x)}</span></div></div>`).join("")}</div>`
        : `<div class="banner ok">${I.check}<div><b>No advisories</b><span class="bx">This server reports no security warnings.</span></div></div>`,
        { icon: I.alert, sub: "Verbatim from GET /health" })}
    </div>`;
}

const GUIDE = [
  { g: "Getting started", items: [
    { id: "start", n: "First run in 5 steps", i: I.play, body: `
      <p>Nothing here needs configuration to try. The fastest path from an empty console to a real
      finding is:</p>
      <div class="stepList">
        <div class="stepItem"><div>Open <b>TLS Scanner</b>. Leave execution mode on <b>Auto</b> — it

        <div class="stepItem"><div>Put one or more of your hostnames in the target box (<code>your-company.com</code>

          <b>Start scan</b>.</div></div>
        <div class="stepItem"><div>When it finishes, read the <b>Posture</b> tab. Each row is one
          endpoint: its risk, TLS version, public-key algorithm, quantum risk score and whether it
          is harvest-now-decrypt-later exposed. Press <b>Detail</b> on any row for the full
          certificate chain, findings and migration plan.</div></div>
        <div class="stepItem"><div>Press <b>Set baseline</b>. From now on every rescan is diffed
          against this snapshot, so <b>Operations › Drift</b> can tell you when something changes
          without a ticket.</div></div>
        <div class="stepItem"><div>Go to <b>Remediation</b> and press <b>Suggest remediations</b>.
          That turns findings into a prioritized fix queue, and — if GitHub is connected — into
          pull requests.</div></div>
      </div>
      <p style="margin-top:14px">Everything else in this console reads from that same scan data.

    { id: "concepts", n: "The five ideas behind it", i: I.atom, body: `
      <p>The whole product rests on a small number of ideas. Understanding them makes every screen
      obvious.</p>
      <ul>
        <li><b>Q-Day</b> — the date a quantum computer can break RSA and elliptic-curve
          cryptography. Nobody knows it; it is a probability distribution, which is why you see a
          range rather than a date.</li>
        <li><b>Harvest now, decrypt later (HNDL)</b> — an adversary records your encrypted traffic
          today and decrypts it after Q-Day. This is why data with a long confidentiality lifetime
          is <em>already</em> at risk, even though nothing is broken yet.</li>
        <li><b>Cryptographic inventory (CBOM)</b> — you cannot migrate what you cannot see. A CBOM
          is a bill of materials for cryptography rather than for software packages.</li>
        <li><b>Crypto-agility</b> — how fast you could change algorithm if you had to. A system that
          takes eighteen months to swap a cipher has a problem no matter which cipher it uses. The
          <b>CryptoFlex score</b> measures this from your own scans, remediations and tooling; it is
          never compared against a sector or industry average, because the platform holds no other
          organization's posture. Until you have scanned something it reads "not enough data yet".</li>
        <li><b>Hybrid key exchange</b> — combining a classical algorithm with a post-quantum one, so
          the connection is safe if <em>either</em> holds. It is the standard migration path,
          because it does not require trusting the new algorithm alone.</li>
      </ul>` },
    { id: "nav", n: "Getting around", i: I.grid, body: `

    { id: "reading-charts", n: "Reading charts", i: I.chart, body: `

    { id: "ask-cipherlens", n: "Ask CipherLens", i: I.zap, body: `

    { id: "notices", n: "Notices and maintenance", i: I.alert, body: `

    { id: "enterprise-ready", n: "Enterprise-ready launch path", i: I.shield, body: `

  { g: "Command", items: [
    { id: "g-overview", n: "Overview", i: I.grid, body: `
      <p><b>What it is:</b> the one screen to open first, and the one to show a leadership team.</p>

    { id: "g-scans", n: "TLS Scanner", i: I.radar, body: `

      <p><b>Baselines:</b> press <b>Set baseline</b> after a scan you consider correct. Later scans

    { id: "g-assets", n: "Asset Inventory", i: I.server, body: `

    { id: "g-cbom", n: "CBOM / SBOM", i: I.layers, body: `

  { g: "Quantum Risk", items: [
    { id: "g-hndl", n: "HNDL Exposure", i: I.hourglass, body: `
      <p><b>What it is:</b> the screen that converts "quantum is scary" into a dollar figure you can

      <p><b>How the model works:</b> exposure = data value × P(broken by Q-Day) × criticality

      <p><b>What it shows:</b> optimistic / median / conservative estimates and a blended CRQC year, a
      cumulative probability curve, migration milestones (CNSA 2.0, NSM-10 and NIST IR 8547 target
      dates), a <b>Threat actors</b> panel, a feed of quantum hardware milestones with sources, and a
      simulation area (<b>Run Q-Day simulation</b>, <b>Emergency response plan</b>).</p>
      <p><b>Where the numbers come from:</b> every Q-Day year in the console comes from one quantum
      model, so this screen, HNDL Exposure and the Overview agree. Panels carry a <b>Model</b> or
      <b>Reference data</b> badge; hover it for the date, sources and assumptions. Milestones are tagged
      <b>published</b>, <b>target date passed</b>, <b>this year</b> or <b>model</b>, so a projection is
      never shown as a done deal. Milestones that ship with the platform are marked <b>reference</b>;
      add your own with <b>Ingest milestone</b>.</p>
      <p><b>Threat actors:</b> the panel only lists actors when the data source provides sourced
      intelligence. Otherwise it says <b>Not provided</b>; the console does not invent attribution.</p>
      <p><b>How to use it:</b> use the <em>conservative</em> date for planning and the
      <em>optimistic</em> one for risk. Compare your migration deadline against the regulatory
      milestones — those are contractual, not speculative.</p>` },
    { id: "g-graph", n: "Blast Radius", i: I.network, body: `
      <p><b>What it is:</b> the relationship map. Cryptographic risk is rarely isolated — one
      certificate authority can underpin hundreds of services.</p>
      <p><b>Three views:</b> <b>Security graph</b> (assets, repositories, remediations),
      <b>Certificate blast radius</b> (what breaks if a CA fails), <b>CA contagion</b> (how a single
      CA compromise spreads across organizations).</p>
      <p><b>How to use it:</b> use <b>Simulate</b> to compromise a node and see what falls over.
      Node size reflects risk score; hover for detail. Add <b>custom edges</b> to model dependencies
      the scanner cannot observe.</p>` },
    { id: "g-canaries", n: "Canaries & QTISN", i: I.bird, body: `
      <p><b>What it is:</b> an early-warning system. A cryptographic canary is a deliberately weak
      key that should never be breakable — if it trips, that capability now exists.</p>
      <p><b>Tripwire ladder:</b> five tiers, Alpha, Beta, Gamma, Delta and Omega (the control tier).
      Each card shows the algorithm, and whether it is <b>Not deployed</b>, <b>Armed</b> or
      <b>Tripped</b>. Select a tier for its detail and its "If it trips" playbook, because the correct response differs by
      tier.</p>
      <p><b>QTISN</b> (quantum threat intelligence sharing network) records canary signals. On this
      server it covers <b>this deployment</b>: the organizations hosted here, not an outside network of
      other companies. <b>Network status</b> shows the threat level and signals in the last 24 hours and
      7 days, <b>Your membership</b> shows how your organization is registered, and <b>Emit a signal</b>
      (<b>Broadcast signal</b>) records a trip. The status panel carries a badge explaining its scope.</p>
      <p><b>How to use it:</b> deploy a tier, then let it sit. Silence is the expected state. If the
      Omega banner ever appears, follow your emergency response runbook.</p>` },
  ]},
  { g: "Act", items: [
    { id: "g-remediation", n: "Remediation", i: I.wrench, body: `
      <p><b>What it is:</b> where findings become changes.</p>
      <p><b>Tabs:</b> <b>Fix queue</b> (lifecycle from proposed to merged) · <b>Next best fix</b>
      (highest-leverage actions) · <b>Migration tasks</b> (owners and due dates) ·
      <b>Playbooks</b> (step-by-step per stack) · <b>Autopilot</b> (proposes changes and opens PRs) ·
      <b>Code generation</b> (hybrid-crypto snippets and hybrid certificates) · <b>Activity feed</b>.</p>
      <p><b>Lifecycle:</b> suggest → approve → validate → create PR → merged. Each step is audited,
      and validation runs in a sandbox before anything reaches a pull request.</p>
      <p><b>Start with</b> Next best fix. It is ordered by risk reduction per unit of effort.</p>` },
    { id: "g-scanners", n: "Deep Scanners", i: I.bug, body: `
      <p><b>What it is:</b> everything beyond TLS. Classical cryptography hides in source code,
      dependencies, binaries, mobile apps and infrastructure definitions.</p>
      <p><b>Scanners:</b> <b>SAST</b> (hardcoded keys, weak primitives) · <b>Secrets</b> (long-lived
      keys in AWS/Azure/Vault/env) · <b>Dependencies</b> (packages with no post-quantum path) ·
      <b>Binaries</b> (embedded certs and linked crypto libraries) · <b>Mobile/IoT</b> (pinned certs
      in APKs and firmware) · <b>IaC</b> (weak TLS policies before deployment) ·
      <b>Developer portal</b> (route findings to the team that owns the code).</p>
      <p><b>Use IaC checks in CI</b> — catching a weak TLS policy in review is far cheaper than
      finding it in production.</p>` },
    { id: "g-operations", n: "Operations", i: I.activity, body: `
      <p><b>What it is:</b> the day-two screen. Posture decays unless something watches it.</p>
      <p><b>Tabs:</b> <b>Observatory</b> (continuous monitoring and alerts) · <b>Drift</b>
      (unauthorized crypto config changes) · <b>SLA</b> (remediation deadlines by severity) ·
      <b>Schedules</b> (recurring scans) · <b>Alerting</b> (PagerDuty, Teams, notifications) ·
      <b>Telemetry</b> · <b>KMS health</b>.</p>
      <p><b>Set this up once:</b> a nightly scan schedule, an SLA policy, and one alert destination.
      That converts the platform from something you visit into something that tells you.</p>` },
  ]},
  { g: "Assure", items: [
    { id: "g-governance", n: "Governance", i: I.scale, body: `
      <p><b>What it is:</b> turning intent into enforcement, and enforcement into evidence.</p>
      <p><b>Tabs:</b> <b>Policies</b> (minimum standards, evaluated against the estate) ·
      <b>Enforcement</b> (pre-merge decisions, circuit breaker, GitHub required checks) ·
      <b>Compliance</b> (control mapping per framework) · <b>Evidence</b> (auditor-ready packs) ·
      <b>Regulatory</b> (regimes with real deadlines and gap analysis) · <b>Maturity</b>
      (weighted 1–5 self-assessment) · <b>Security intents</b> (declarative posture) ·
      <b>Zero-knowledge proofs</b> (prove compliance without disclosing your inventory).</p>
      <p><b>The circuit breaker</b> halts all automation. Use it when something is wrong and you want
      changes to stop immediately.</p>` },
    { id: "g-board", n: "Board & ROI", i: I.briefcase, body: `
      <p><b>What it is:</b> the money screen — for funding conversations rather than engineering ones.</p>
      <p><b>Tabs:</b> <b>Risk score</b> (how the board risk score is built, component by component, plus
      regulatory exposure) · <b>ROI model</b> (enter your sector, asset count, revenue, engineers and
      migration window, then <b>Calculate ROI</b>; nothing is pre-filled) · <b>Peer benchmark</b> ·
      <b>Actuarial</b> (expected-loss models per asset or across the portfolio) · <b>Board pack</b>.</p>
      <p><b>Risk score:</b> the board risk score is computed only from your own assets, remediations
      and drift records. Until at least one asset is on record the tile reads "—" and
      <b>Not enough data yet</b>, and every component shows <b>not measured</b> with its weight still
      visible so you can see how the score would be built. A component with no evidence — validated
      execution before any remediation is tracked, day-2 governance before any drift event — is left
      out and the remaining weights are renormalized, rather than scored as a zero.</p>
      <p><b>Peer benchmark:</b> there is no peer comparison, and there will not be one until a real
      comparison data source exists. The platform receives no other organization's posture, so it
      publishes no percentile, quartile or sector average. The tab says <b>No peer data</b> and the
      <b>Peer benchmark</b> tile shows "—". The console does not generate a simulated peer group.</p>
      <p><b>Actuarial:</b> premiums and losses are an illustrative model built from stated planning
      assumptions, listed under <b>model basis</b> on the response. With no assets on record it
      models nothing and says so, rather than pricing a placeholder asset.</p>
      <p><b>Board pack</b> collects every artifact a board or auditor asks for: readiness report,
      compliance report, CBOM, audit log. The public <b>readiness badge</b> exposes only a score,
      never your inventory.</p>` },
    { id: "g-vendors", n: "Third Party", i: I.truck, body: `
      <p><b>What it is:</b> your suppliers' cryptography is part of your risk surface.</p>
      <p><b>What it does:</b> scores your vendors on post-quantum readiness, sends assessment questionnaires,
      collects signed attestations, and shows a provider capability matrix (what each CDN and cloud
      actually supports today — often the real constraint on your own migration).</p>
      <p><b>Where scores come from:</b> only your own assessments and attestations. The screen starts
      empty (<b>No vendor scores yet</b>); it does not ship with scores for named companies. Press
      <b>New assessment</b> to send a questionnaire, or <b>Invite vendor</b> on the <b>Attestations</b>
      tab to request a signed attestation.</p>
      <p><b>Tabs:</b> <b>Scorecards</b> (readiness split into post-quantum Ready, In Progress, Early Stage and Not
      Started, with averages per dimension; the weakest is in amber) · <b>Assessments</b> ·
      <b>Attestations</b> · <b>Provider capabilities</b>. Use <b>Compare vendors</b> to put scores side
      by side.</p>
      <p><b>Private proofs</b> let a vendor prove compliance without revealing their inventory.</p>` },
  ]},
  { g: "System", items: [
    { id: "g-integrations", n: "Integrations", i: I.plug, body: `
      <p><b>What it is:</b> how the platform reaches into your existing tooling.</p>
      <p><b>Available:</b> GitHub (token or App) for repository sync, PR review and status checks ·
      Cloudflare for edge TLS policy · Slack, Jira, ServiceNow, PagerDuty, Teams · outbound
      webhooks with routing rules · CI/CD gate config generation · findings ingest from other
      scanners · secret backends (Vault, AWS, Azure).</p>
      <p><b>Start with</b> the CI/CD gate and one alert destination. Those two change behaviour;
      the rest is convenience.</p>` },
    { id: "g-knowledge", n: "Knowledge", i: I.book, body: `
      <p><b>What it is:</b> federated search across your estate, plus reference material.</p>
      <p><b>What it has:</b> a knowledge base on post-quantum algorithms and migration, an assistant grounded
      in <em>your</em> data (ask "which assets are most exposed to HNDL?"), FIPS algorithm
      classification, and the provider capability matrix.</p>` },
    { id: "g-admin", n: "Administration", i: I.shield, body: `
      <p><b>What it is:</b> running the platform itself.</p>
      <p><b>Launch readiness</b> is the tab to check before exposing this server to a network you do
      not control. It evaluates the server's own advisories and tells you which are blocking.</p>
      <p><b>Other tabs:</b> Users &amp; access (create users, change roles, deactivate) ·
      Organizations (multi-tenancy, usage, rate limits) · Invitations (see <b>Joining through an
      invite</b>) · Audit trail (hash-chained, CSV exportable) · Support access (see <b>Vendor support
      access</b>) · Platform · Health ·
      Data &amp; isolation (verify no query crosses a tenant boundary).</p>
      <p><b>Roles:</b> <code>viewer</code> reads, <code>operator</code> runs scans and remediations,
      <code>admin</code> manages users and organizations.</p>` },
    { id: "g-api", n: "API Explorer", i: I.terminal, body: `
      <p><b>What it is:</b> direct access to the backend, so nothing in the product is unreachable
      from this console.</p>
      <p><b>How to use it:</b> pick an endpoint from the catalog or type any path, choose a method,
      add a JSON body, and send. Responses are rendered as a table when they are a list of records
      and as raw JSON always. Every request uses your current identity headers.</p>
      <p><b>Note:</b> the catalog is a curated shortlist, not the full route table — this server
      disables <code>/openapi.json</code>, so the console cannot enumerate routes at runtime.</p>` },
  ]},
  { g: "Account & plan", items: [
    { id: "g-invite", n: "Joining through an invite", i: I.inbox, body: `
      <p><b>What it is:</b> how a new colleague joins your organization. An invitation is a link that
      works once, expires, and can only be accepted by someone signed in with the invited email
      address.</p>
      <p><b>If you are an organization admin sending one:</b></p>
      <div class="stepList">
        <div class="stepItem"><div>Open <b>Administration › Invitations</b> and press <b>Invite</b>. Only
          organization admins can create invitations.</div></div>
        <div class="stepItem"><div>Check the <b>Organization ID</b>, enter the person's <b>Email</b>, pick a
          <b>Role</b> (<b>Viewer</b>, <b>Analyst (operator)</b> or <b>Organization admin</b>) and press
          <b>Create invite</b>.</div></div>
        <div class="stepItem"><div>The <b>Invitation created</b> window shows the invite link once, with its
          expiry. Press <b>Copy invite link</b> and send it over a channel you trust, such as your company
          chat or email. You cannot see the link again later.</div></div>
      </div>
      <p><b>If you received one:</b></p>
      <div class="stepList">
        <div class="stepItem"><div>Open the whole link. It ends in <code>#token=</code> followed by a long
          code. The page shows the organization, the role, the invited address (partly hidden) and when
          it expires.</div></div>
        <div class="stepItem"><div>Not signed in? Press <b>Sign in to accept</b>. You sign in to the console
          and come back to the invitation. This server has no self sign-up: if you have no account for the
          invited address, ask the person who invited you.</div></div>
        <div class="stepItem"><div>Press <b>Accept invitation</b>. The console opens with "You joined …".</div></div>
      </div>
      <details class="faq" open><summary>"You're signed in with a different email"</summary>
        <p>The invitation belongs to another address. Press <b>Sign out</b> and sign in with the invited
        address.</p></details>
      <details class="faq"><summary>"This invitation has expired", "already been used" or "was revoked"</summary>
        <p>Ask your administrator for a new invitation. Each link works once.</p></details>
      <details class="faq"><summary>"We couldn't find this invitation"</summary>
        <p>The link is probably incomplete. If your email split it across lines, copy the whole thing into
        the address bar.</p></details>
      <p><b>Why the link is safe to share once:</b> the code after <code>#</code> stays in your browser and
      is not sent to servers or other sites as part of the address. You can also paste the link into
      <b>Administration › Invitations › Accept an invitation</b>.</p>` },
        { id: "g-support-access", n: "Vendor support access", i: I.users, body: `
      <p><b>What it is:</b> with your permission, the vendor's support staff can open a <b>read-only</b>
      view of your workspace to help with a problem, for 5 to 60 minutes at a time, with a reason you can
      see. It is off by default; a customer admin can approve or revoke it at any time.</p>
      <p><b>What support can and cannot do:</b></p>
      <ul>
        <li>They see what a <b>viewer</b> in your organization sees: dashboards, assets, scans, risk views,
          remediation, policies and similar pages.</li>
        <li>They cannot change anything. Buttons that would change data are greyed out, and the server
          refuses changes anyway.</li>
        <li>They cannot see stored credentials or secrets, manage users or passwords, download exports or
          evidence bundles, or reach any other organization.</li>
      </ul>
      <p><b>What the support person sees:</b> a dark orange bar pinned to the top of the console reading
      <b>Support view · read-only</b>, with their name, the reason, a countdown ("ends in mm:ss") and an
      <b>End session</b> button. It cannot be dismissed.</p>
      <p><b>See every visit:</b> open <b>Administration › Support access</b>. <b>Vendor support
      sessions</b> lists when each visit started, who it was (and the ticket, if any), the reason, how long
      it lasted and whether it ended early or at the time limit. Emergency visits carry a red
      <b>break-glass</b> label. <b>Pages viewed</b> opens the full list of every page and data request the
      session made, with times, including requests the server refused. Only your organization's sessions
      are listed. The <b>Audit trail</b> tab also records when a session started, was opened, was revoked or
      expired, and the role-checked data support loaded, under an actor named <code>support:</code> followed
      by the session id.</p>
      <p><b>Turn it off (organization admins):</b></p>
      <div class="stepList">
        <div class="stepItem"><div>Open <b>Administration › Support access</b>.</div></div>
        <div class="stepItem"><div>In <b>Allow vendor support access</b>, press <b>Turn off vendor support
          access</b>. Any session in progress ends immediately.</div></div>
        <div class="stepItem"><div>To allow it again, press <b>Allow vendor support access</b>. The banner shows
          who changed the setting and when.</div></div>
      </div>
      <p>Other roles can see the setting but not change it, and support can never change it. While access is
      off, only a vendor platform owner can override it in an emergency ("break-glass"). That visit is
      recorded as high severity and appears in your list with the break-glass label.</p>` },
    { id: "g-rate-limits", n: "Rate limits", i: I.gauge, body: `
      <p><b>What it is:</b> your organization may have limits on how many API calls it makes per minute and
      how many scans it starts per hour. Limits protect the service for everyone, and one organization
      reaching its limit never slows down another.</p>
      <p><b>What you see when you reach one:</b> the request fails with HTTP <code>429 Too Many
      Requests</code> and a message such as "Organization API rate limit exceeded: … requests per minute …
      Retry after 12 s." or "Organization scan limit exceeded: … scans per hour …". In the console the
      panel shows that message.</p>
      <ul>
        <li><b>Wait the number of seconds given</b> in the message (the <code>Retry-After</code> header),
          then try again. The windows slide: the last 60 seconds for API calls, the last hour for
          scans.</li>
        <li><b>Scripts and integrations</b> can read <code>X-RateLimit-Limit</code> and
          <code>X-RateLimit-Remaining</code> on normal responses and slow down before reaching the limit.
          Retry after the <code>Retry-After</code> delay instead of retrying immediately.</li>
        <li>Signing in has its own separate limit, so a busy script does not lock people out of the
          console.</li>
        <li>Limits come from a limit set for your organization, or
          the platform default. If you regularly hit a limit for legitimate work, ask your account team;
          they can tell you which applies and change it.</li>
      </ul>` },
  ]},
  { g: "Reference", items: [
    { id: "g-auth", n: "Authentication & roles", i: I.lock, body: `
      <p>The console adapts to whatever the server advertises at <code>/auth/config</code> — it never
      offers a sign-in method the server does not support.</p>
      <ul>
        <li><b>headers mode</b> — identity comes from request headers. Convenient locally,
          <b>unsafe in production</b>: any caller can claim any role.</li>
        <li><b>jwt mode</b> — a bearer token carries identity. Set
          <code>MORROW_AUTH_REQUIRED=1</code> to reject unauthenticated requests.</li>
        <li><b>SAML / OIDC</b> — used when an external identity provider is configured.</li>
      </ul>
      <p>Expired access tokens are refreshed transparently once; if that fails you are returned to
      the sign-in screen. The identity chip in the header shows who the <em>server</em> thinks you
      are, which is the only opinion that matters.</p>` },
    { id: "g-trouble", n: "Troubleshooting", i: I.alert, body: `
      <details class="faq" open><summary>A panel says "Endpoint unavailable"</summary>
        <p>That feature is disabled or misconfigured server-side. The message includes the status and
        path. Common causes: <code>/platform/*</code> needs <code>MORROW_PLATFORM_ADMIN_KEY</code>;
        vault-backed features need <code>DATABASE_URL</code> (Postgres) and
        <code>MORROW_VAULT_MASTER_KEY</code>. Panels degrade individually and never take the screen down.</p></details>
      <details class="faq"><summary>"429 · Organization API rate limit exceeded" or "scan limit exceeded"</summary>
        <p>Your organization reached a limit. Wait the number of seconds in the message and try again. See
        <b>Rate limits</b>.</p></details>
      <details class="faq"><summary>Changes answer 503 with a maintenance message</summary>
        <p>The platform is in maintenance mode. Reading still works; try the change again after the
        maintenance banner disappears. See <b>Notices and maintenance</b>.</p></details>
      <details class="faq"><summary>Scans fail or stay queued forever</summary>
        <p>The queued path needs Redis and a running Celery worker. Switch execution mode to
        <b>Auto</b> or <b>Direct</b> to scan in-process instead.</p></details>
      <details class="faq"><summary>Everything is empty</summary>
        <p>There is no scan data yet. Run a scan on the TLS Scanner screen, or import assets in
        Asset Inventory.</p></details>
      <details class="faq"><summary>Changing organization does nothing</summary>
        <p>If your token carries an organization claim, it takes precedence over the header and the
        console will tell you so. Sign in as a user belonging to the other organization instead.</p></details>
      <details class="faq"><summary>"Cross-origin API base" warning</summary>
        <p>The page is served with a Content-Security-Policy that restricts <code>connect-src</code>,
        so the browser blocks requests to other origins. Serve the console from the same origin as
        the API, or widen <code>MORROW_CSP_VALUE</code>.</p></details>
      <details class="faq"><summary>I cannot sign in — password sign-in unavailable</summary>
        <p>With authentication enforced, this server does not exempt <code>/auth/login</code> from the
        auth wall on older builds. Use single sign-on, paste a token from your identity provider, or
        update the server.</p></details>` },
  ]},
];
VIEWS.guide = async (host) => {
  const flat = GUIDE.flatMap(g => g.items);
  host.innerHTML = `
    <div class="banner info" style="margin-bottom:16px">${I.book}<div>
      <b>Everything in this console, explained</b>
      <span class="bx">${NUM(flat.length)} sections covering every screen: what it is, what it shows,
      and how to use it. Nothing here talks to the server, so it works offline.</span></div></div>
    <div class="tocGrid">
      <nav class="toc" aria-label="Guide contents">
        ${GUIDE.map(g => `<div class="tg">${H(g.g)}</div>
          ${g.items.map(x => `<a href="#guide" data-goto="${x.id}">${H(x.n)}</a>`).join("")}`).join("")}
      </nav>
      <div class="doc">
        ${flat.map(x => `<section class="docSec" id="doc-${x.id}">
          <h3 id="${x.id}">${x.i}${H(x.n)}</h3>
          <div style="margin-top:11px;display:grid;gap:11px">${x.body}</div>
        </section>`).join("")}
      </div>
    </div>`;
  /* TOC: smooth scroll + highlight the section currently on screen */
  const links = $$("[data-goto]", host);
  links.forEach(a => a.onclick = (e) => {
    e.preventDefault();
    const t = $("#doc-" + a.dataset.goto, host);
    if (t) t.scrollIntoView({ behavior: "smooth", block: "start" });
  });
  /* Highlight the section on screen. Purely decorative, so skip it where unsupported. */
  if (typeof IntersectionObserver === "function") {
    const obs = new IntersectionObserver((entries) => {
      entries.filter(e => e.isIntersecting).forEach(e => {
        const id = e.target.id.replace(/^doc-/, "");
        links.forEach(a => a.classList.toggle("on", a.dataset.goto === id));
      });
    }, { rootMargin: "-80px 0px -70% 0px" });
    flat.map(x => $("#doc-" + x.id, host)).filter(Boolean).forEach(s => obs.observe(s));
  } else {
    links[0]?.classList.add("on");
  }
  navBadge("guide", "");
};

    <div id="axSpec" style="margin-bottom:16px"></div>

    ${card("Request builder", `

        <label for="axB">Request body (JSON)</label>
        <textarea class="inp" id="axB" placeholder="{}"></textarea></div>`,
      { icon: I.terminal, sub: "Compose any call against the running API" })}

    <div style="height:14px"></div>
    <div id="axOut">${emptyBox("Pick an endpoint from the catalog below or type a path above, then send.", I.terminal, "No request sent")}</div>

    ${sec("Endpoint catalog", `
      <div class="row" style="margin-bottom:12px">
        <input class="inp" id="axQ" placeholder="Filter endpoints…" style="max-width:300px">
        <span class="grow"></span>
        <span class="pill mono" id="axCount"></span>
      </div>
      <div id="axCat">${catalogHtml(CATALOG)}</div>`)}`;

  const m = $("#axM");
  m.onchange = () => $("#axBodyWrap").hidden = m.value === "GET" || m.value === "DELETE";
  $("#axP").onkeydown = (e) => { if (e.key === "Enter") ACTIONS.axSend(); };
  const q = $("#axQ");
  const setCount = (n) => $("#axCount").textContent = `${NUM(n)} of ${NUM(CATALOG_COUNT)} catalogued`;
  setCount(CATALOG_COUNT);
  q.oninput = () => {
    const s = q.value.trim().toLowerCase();
    const filtered = CATALOG.map(([g, list]) => [g, s ? list.filter(p => p.toLowerCase().includes(s)) : list]).filter(([, l]) => l.length);
    $("#axCat").innerHTML = catalogHtml(filtered);
    setCount(filtered.reduce((a, [, l]) => a + l.length, 0));
    wire($("#axCat"));
  };

  /* If the server ever re-enables its schema, enumerate the real route table instead of guessing. */
  const spec = await safe("/openapi.json");
  const box = $("#axSpec");
  if (spec.ok && isObj(spec.data?.paths)) {
    const paths = Object.entries(spec.data.paths);
    const ops = paths.reduce((a, [, v]) => a + Object.keys(v).filter(m => /^(get|post|put|patch|delete)$/.test(m)).length, 0);
    box.innerHTML = `<div class="banner ok">${I.check}<div><b>Live schema available — ${NUM(paths.length)} paths, ${NUM(ops)} operations</b>
      <span class="bx">Enumerated from <span class="mono">/openapi.json</span>, so this is the authoritative route table.</span></div></div>`;
  } else {
    box.innerHTML = `<div class="banner warn">${I.alert}<div><b>Schema endpoint disabled on this server</b>
      <span class="bx"><span class="mono">/openapi.json</span> returned <span class="mono">${H(String(spec.err || "no schema").slice(0, 80))}</span>,
      so route counts cannot be verified from the UI. Set <span class="mono">MORROW_ENABLE_DOCS=1</span> (or equivalent) to enable it.</span></div></div>`;
  }
  wire(box);
  navBadge("api", "");
};
function catalogHtml(cat) {
  return cat.length ? `<div class="g gWide">${cat.map(([g, list]) => `
    <div class="card"><div class="cardHead"><div class="grow"><h3>${I.terminal}${H(g)}</h3>
      <p>${NUM(list.length)} endpoint${list.length === 1 ? "" : "s"}</p></div></div>
      <div class="cardBody tight"><div class="stack" style="gap:4px">${list.map(p => `
        <button class="btn xs ghost" data-act="axPick" data-p="${H(p)}"
          style="justify-content:flex-start;width:100%;font-family:var(--mono);font-size:11px;height:25px">${H(p)}</button>`).join("")}
      </div></div></div>`).join("")}</div>`
    : emptyBox("No endpoints match that filter", I.search);
}
ACTIONS.axPick = (b) => {
  $("#axP").value = b.dataset.p;
  $("#axM").value = "GET";
  $("#axBodyWrap").hidden = true;
  ACTIONS.axSend();
  $("#axOut").scrollIntoView({ behavior: "smooth", block: "center" });
};
ACTIONS.axSend = async () => {
  const method = $("#axM").value;
  let path = $("#axP").value.trim();
  if (!path.startsWith("/")) path = "/" + path;
  if ($("#axV1").checked && !path.startsWith("/v1")) path = "/v1" + path;
  const box = $("#axOut");
  box.innerHTML = skel(3, 34);
  let body;
  if (method !== "GET" && method !== "DELETE") {
    const raw = ($("#axB").value || "").trim();
    if (raw) { try { body = JSON.parse(raw); } catch { box.innerHTML = errBox("Request body is not valid JSON"); return; } }
    else body = {};
  }
  const t0 = performance.now();
  const r = await safe(path, { method, body });
  const ms = Math.round(performance.now() - t0);
  const d = r.ok ? r.data : null;
  const list = r.ok ? rows(d) : [];
  box.innerHTML = card(`${method} ${path}`, `
    <div class="row" style="margin-bottom:14px">
      <span class="pill ${r.ok ? "ok" : "bad"}"><i class="pd"></i>${r.ok ? "200 OK" : H(String(r.err).slice(0, 44))}</span>
      <span class="pill mono">${ms} ms</span>
      ${r.ok ? `<span class="pill mono">${H(typeof d === "string" ? `${d.length} chars` : `${JSON.stringify(d).length} bytes`)}</span>` : ""}
      ${list.length ? `<span class="pill mono">${NUM(list.length)} records</span>` : ""}
      <span class="grow"></span>
      ${r.ok ? `<button class="btn xs" data-copy='${H(JSON.stringify(d))}'>Copy response</button>` : ""}
      <a class="btn xs ghost" href="${H(S.base + path)}" target="_blank" rel="noopener">Open raw</a>
    </div>
    ${!r.ok ? errBox(r.err, path)
      : list.length && isObj(list[0]) ? autoTable(list)
      : isObj(d) ? autoKV(d, { limit: 44 }) : ""}
    <div style="height:${r.ok ? "12px" : "0"}"></div>
    ${r.ok ? `<pre class="out" style="--pmax:480px">${H(typeof d === "string" ? d.slice(0, 40000) : JSON.stringify(d, null, 2))}</pre>` : ""}`,
    { icon: I.terminal, lift: false });
  wire(box);
};
/** Build a table from an array of like-shaped objects. */
function autoTable(list) {
  const sample = list.slice(0, 24);
  const keys = [...new Set(sample.flatMap(o => Object.keys(o)))]
    .filter(k => sample.some(o => o[k] !== null && o[k] !== "" && !isObj(o[k]) && !Array.isArray(o[k])))
    .slice(0, 8);
  if (!keys.length) return "";
  return table(keys.map(k => ({
    h: TITLE(k),
    num: sample.every(o => o[k] == null || typeof o[k] === "number"),
    f: (r) => {
      const v = r[k];
      if (v == null || v === "") return "—";
      if (typeof v === "number") return `<span class="mono">${NUM(v, v % 1 ? 2 : 0)}</span>`;
      if (typeof v === "boolean") return v ? `<span class="pill ok">true</span>` : `<span class="pill">false</span>`;
      const s = String(v);
      if (/^\d{4}-\d{2}-\d{2}T/.test(s)) return `<span style="font-size:11px">${H(AGO(s))}</span>`;
      if (TONE(s) && s.length < 24) return rawPill(s);
      return `<span class="${s.length > 26 ? "mono" : ""}" style="font-size:11.5px">${H(s.slice(0, 50))}</span>`;
    },
  })), list.slice(0, 200), { max: "420px" });
}
