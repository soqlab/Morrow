      <p><b>Sign in with SSO (production default)</b></p>
      <div class="stepList"><div class="stepItem"><div>Open <code>/vendor-admin/</code>. When SSO is configured, the screen shows <b>Sign in with SSO</b>. The key sign-in is folded underneath.</div></div><div class="stepItem"><div>Press <b>Sign in with SSO</b> and sign in at your company identity provider.</div></div><div class="stepItem"><div>Back in the console, access is granted only if your email is on the operator roster (<code>MORROW_ADMIN_OPERATOR_ROLES</code>) with a role, or, when no roster is set, in an allowed domain. Anyone else sees "Your account is not an authorized platform operator. Ask an owner to add you to the operator roster."</div></div><div class="stepItem"><div>If MFA is required (always in production and staging unless explicitly turned off), the console asks for an authenticator code. See below.</div></div></div>
      <p>Console sessions end after 30 minutes without activity (<code>MORROW_ADMIN_SESSION_IDLE_SECONDS</code>) and 8 hours after sign-in at the latest (<code>MORROW_ADMIN_SESSION_ABSOLUTE_SECONDS</code>). <b>Sign out</b> in the operator menu ends the session on the server too. SSO sessions live in a secure cookie that page scripts cannot read; nothing is stored in the tab. <b>Remember for this tab</b> only applies to key sign-in.</p>
      <p><b>MFA enrolment and recovery codes</b></p>
      <ul><li><b>First sign-in:</b> the screen <b>Set up your authenticator</b> shows a QR code and a text key (<b>Or type this key</b>). Scan it with an authenticator app (Google Authenticator, Microsoft Authenticator, 1Password, Okta Verify), enter the 6-digit code and press <b>Verify</b>.</li><li><b>Save your recovery codes:</b> 10 recovery codes appear once. Store them in a password manager, then press <b>I saved them — continue</b>. Each code works once.</li><li><b>Later sign-ins:</b> <b>Enter your authenticator code</b>. Lost your phone? Press <b>Use a recovery code</b>. Case and the dash don't matter.</li><li><b>New codes:</b> <b>Access › Operators &amp; roles › Multi-factor authentication › Regenerate recovery codes</b> (needs a current authenticator code). The old codes stop working.</li><li><b>Everything lost:</b> another <b>owner</b> opens <b>Reset another operator's MFA</b>, presses <b>Reset MFA…</b> and gives a reason. The person's console sessions end and they enrol again at next sign-in. Owners cannot reset their own MFA.</li><li><b>Wrong codes:</b> after 5 failed attempts in 5 minutes the identity must wait ("Too many MFA attempts. Wait five minutes and try again."). Attempts are recorded.</li></ul>
      <p>MFA secrets are encrypted with <code>MORROW_VAULT_MASTER_KEY</code>, so that key must be set for MFA to work.</p>
      <p><b>Step-up prompts</b></p>
      <p>Some actions ask for a fresh code when your last one is older than 15 minutes (<code>MORROW_ADMIN_STEP_UP_SECONDS</code>). This applies to SSO sessions and named operator keys with MFA enrolled; if MFA is required and you have not enrolled, the action is refused until you do. The shared key has no identity and is never asked. The dialog <b>Confirm with your authenticator</b> accepts a 6-digit code or a recovery code; after <b>Verify and continue</b> the action carries on. Actions that ask:</p>
      <ul><li>purge an organization</li><li>run a deleting retention pass</li><li>revoke every session in an organization</li><li>rotate an API key</li><li>change a customer's plan</li><li>migrate platform state</li><li>reset another operator's MFA</li></ul>
      <p><b>Named operator keys</b></p>
      <p>Scripts, Traffic Lens and people without SSO use named operator keys (<code>MORROW_PLATFORM_OPERATORS</code>, a JSON list of <code>name</code>, <code>role</code> and the key's <code>key_sha256</code>; create an entry with <code>cd backend &amp;&amp; python -m services.platform_operators --name alice --role operator</code>). The role is bound to the key and every audit event records the operator name.</p>
      <p>Open <b>Use an operator key</b> (it reads <b>Use a named operator key</b> when the shared key is disabled), paste the key into <b>Platform admin key</b> and press <b>Connect</b>. When MFA is required, or once the key has enrolled MFA, the key must be verified with a code before use; a verification lasts 8 hours (the absolute session length). The console handles enrolment and verification after you connect, through the MFA card on <b>Operators &amp; roles</b>.</p>
      <p><b>The shared key and break-glass, per environment</b></p>
      <ul><li><code>local</code> (the default) and any value other than those below: <b>Shared <code>MORROW_PLATFORM_ADMIN_KEY</code></b> Accepted, as <b>Shared platform key</b>, up to the ceiling <code>MORROW_PLATFORM_ADMIN_KEY_ROLE</code>. A request that does not ask for a role runs as auditor.. <b>MFA default</b> Off unless <code>MORROW_ADMIN_REQUIRE_MFA=1</code></li><li><code>production</code>, <code>prod</code>, <code>staging</code>, <code>stage</code>: <b>Shared <code>MORROW_PLATFORM_ADMIN_KEY</code></b> Refused ("The shared platform key is disabled in production. Sign in with SSO…") unless <code>MORROW_ALLOW_BREAK_GLASS_KEY=1</code>. <b>MFA default</b> On unless <code>MORROW_ADMIN_REQUIRE_MFA=0</code></li></ul>
      <p>Break-glass rules:</p>
      <ul><li>Use it only when SSO is down and nobody can sign in otherwise.</li><li>Turn it on with <code>MORROW_ALLOW_BREAK_GLASS_KEY=1</code> and a restart, then sign in with the shared key.</li><li>Every change, and the first read of each page per minute, is recorded as <code>platform.break_glass_used</code> with severity high. The bell shows a critical <b>Break-glass platform key used</b> notification for 24 hours, and the operator menu warns "Break-glass access: every request is audited with severity high."</li><li>The go-live gate fails <b>Shared key is break-glass only</b> while the flag is on.</li><li>Afterwards: remove the flag, restart, and rotate the shared key.</li></ul>
      <p><b>The operator menu and sessions</b></p>
      <p>The operator menu (top right) shows who you are, your role, <b>Signed in with</b> (SSO, Named operator key, Shared platform key or Break-glass shared key), your MFA status and, for SSO, when the session expires. <b>Access › Sessions › Operator console sessions</b> lists everyone signed in with SSO (role, method, MFA, last active, expiry); <b>Revoke…</b> with a reason signs that person out on their next request.</p>
      </details>
      <details class="faq"><summary>2. Navigation map</summary>
      <p>The top bar has dropdown menus, a search box (<b>Ctrl K</b> or <b>Cmd K</b>), the notifications bell and the operator menu. On narrow screens the menus move into a drawer behind the menu button.</p>
      <ul><li><b>Dashboard</b>: KPIs, trends and what needs attention.</li><li><b>Customers</b><ul><li><b>Organizations</b>: every tenant with status, plan, risk and activity; <b>New customer</b>; <b>Export visible rows</b>.</li><li><b>Customer 360</b>: one organization in depth.</li><li><b>Users</b>: tenant directory, role changes, deactivation, <b>Add organization member</b>.</li><li><b>Invitations</b>: single-use, expiring invitations.</li><li><b>Support sessions</b>: read-only view-as-customer sessions and revocation.</li><li><b>Onboarding</b>: activation risk and per-tenant checklists.</li><li><b>Customer feedback</b>: bugs, ideas and questions to triage.</li></ul></li><li><b>Product</b><ul><li><b>Usage &amp; adoption</b>: which features organizations use.</li><li><b>Feature flags</b>: catalogue and per-organization overrides.</li><li><b>Announcements</b>: banners in the customer console.</li></ul></li><li><b>Access</b><ul><li><b>API keys</b>: issue, rotate and revoke organization keys.</li><li><b>Sessions</b>: customer sign-in sessions, <b>Revoke access</b>, operator console sessions.</li><li><b>Operators &amp; roles</b>: operator roster, your session, MFA, MFA resets.</li><li><b>Rate limits</b>: per-organization overrides and 429 pressure.</li></ul></li><li><b>Operations</b><ul><li><b>Service health</b>: dependencies, telemetry, request observability, Traffic Lens summary, log storage.</li><li><b>Traffic Lens</b>: request metadata by source IP and route (its own page, <code>/vendor-admin/traffic.html</code>, same top bar).</li><li><b>Incidents &amp; abuse</b>: errors, slow requests and rate-limit pressure.</li><li><b>Background jobs</b>: scheduled work with last and next runs and failures.</li><li><b>Alert routing</b>: Slack, email, PagerDuty and webhook alerts, with a delivery log.</li><li><b>Maintenance mode</b>: pause customer writes with a message.</li><li><b>Autopatch</b>: governed fix intake and draft PRs.</li><li><b>Notifications</b> (also <b>View all notifications</b> in the bell).</li></ul></li><li><b>Security</b><ul><li><b>Launch readiness</b>: go-live gate and production readiness checks.</li><li><b>Security truth</b>: external findings and write-path guardrails.</li><li><b>Tenant isolation &amp; RLS</b>: cross-tenant probe and row-level security plan.</li><li><b>Audit log</b>: tenant audit logs, admin audit, authentication events.</li><li><b>Data &amp; retention</b>: retention runs, state coverage, customer data exports.</li></ul></li><li><b>Help</b>: <b>Administrator guide</b> (opens <code>/enterprise-admin</code>), <b>Support</b>, <b>Public website</b>.</li></ul>
      <p>The search palette finds pages, quick actions (<b>Create customer</b>, <b>New announcement</b>, <b>Turn maintenance on or off</b>, <b>Check launch gate</b>, <b>Verify tenant isolation</b>, <b>Create API key</b>, <b>Revoke access</b>, <b>Search admin audit</b>, <b>Refresh data</b>, <b>Sign out</b>) and, after two characters, records such as organizations and users.</p>
      <p>Roles: <b>Owner</b> can do everything, including purge, the operator roster and state migration. <b>Operator</b> can change customers, keys, sessions, flags, maintenance and announcements. <b>Support</b> and <b>Auditor</b> are read-only in the console (write controls are disabled); support can additionally start support sessions.</p>
      <p>Traffic Lens uses your console sign-in: if you signed in with SSO in this browser, it detects the session and loads without a key (writes such as <b>Clear Buffer</b> carry the session's CSRF token, and <b>Sign out</b> ends the session). If the session still waits for an MFA code, it sends you back to <code>/vendor-admin/</code> to finish signing in. Without a session, type a named operator key or, locally, the platform key.</p>
      </details>
      <details class="faq"><summary>3. Dashboard</summary>
      <p>Pick a range with <b>24h</b>, <b>7d</b>, <b>30d</b> or <b>90d</b>. Quick actions: <b>Create customer</b>, <b>New announcement</b>, <b>Maintenance</b>, <b>Check launch gate</b>.</p>
      <p><b>KPI tiles</b></p>
      <p>Each tile shows the value for the range, a change against the previous period of the same length, the previous value and a sparkline. Hover a tile to see its source.</p>
      <ul><li>Organizations: All organizations now; previous = organizations created before the range start</li><li>Active organizations: Organizations with a successful sign-in or a signed-in request in the range</li><li>New organizations: Organizations created in the range</li><li>Users: Sign-in accounts now; previous = accounts created before the range start</li><li>Active users: Distinct users with a successful sign-in (password or SAML) or a signed-in request</li><li>New users: Accounts created in the range</li><li>Successful logins / Failed logins: Authentication journal: login.success and saml.success / login.failure and saml.failure</li><li>API requests: Requests in the request journal</li><li>Server error rate (5xx) %: 5xx responses ÷ all requests</li><li>p95 latency (ms): 95th percentile response time (nearest rank). Across summarised days it is an estimate from a latency histogram</li><li>Rate-limited requests (429): Responses with status 429</li><li>Scans: Scans created in the range</li><li>Assets: Current inventory; no previous value (assets have no creation date)</li><li>Open remediations: Remediations not rejected or verified-closed; no history, so no previous value</li><li>Open feedback: Feedback with status new or triaged</li><li>Autopatches awaiting approval: Autopatch items in needs_review</li><li>Active API keys: Keys not revoked and not expired; previous = as of range start</li><li>Active sessions: Built-in sign-in sessions not yet expired; no previous value</li><li>Admin actions: Platform administration events in the range</li></ul>
      <p>Tile footers mean:</p>
      <ul><li><b>no prior data</b>: the previous period has no usable value to compare with.</li><li><b>new this period</b>: the previous value was zero.</li><li><b>no prior period</b>: the previous period is older than the raw journals and not covered by daily summaries. Hover for the reason.</li><li><b>Not tracked</b>: this server does not produce the metric.</li><li><b>No data in range</b>: the metric exists but has no value, for example an error rate with no requests.</li></ul>
      <p><b>Charts and lists</b></p>
      <ul><li><b>Signups</b>, <b>Active users</b>, <b>API requests</b> (stacked: successful, client errors 4xx, rate limited 429, server errors 5xx), <b>Latency</b> (p50 and p95), <b>Sign-ins</b>, <b>Scans</b>.</li><li><b>Top organizations by activity</b>: requests, sign-ins and scans per organization; open one for its Customer 360.</li><li><b>Routes by errors</b>: route templates with the most 5xx responses.</li><li><b>Needs attention</b>: open notifications, most severe first.</li><li><b>Plans</b>: organizations by plan.</li><li><b>Platform status</b>: go-live verdict, health, alerts, at-risk customers, traffic events and capture policy.</li><li><b>Maintenance &amp; announcements</b>: what customers see right now.</li></ul>
      <p><b>Coverage, "unavailable" and how history extends</b></p>
      <ul><li>Raw request records are kept for 7 days (<code>MORROW_TRAFFIC_RETENTION_DAYS</code>, maximum 30) and sign-in records for 90 days (<code>MORROW_AUTH_LOG_RETENTION_DAYS</code>, maximum 365).</li><li>Before raw records expire, the <b>Daily usage rollups</b> job saves a summary of each finished UTC day per organization: requests, client errors, server errors, rate-limited requests, signed-in requests, a latency profile, successful and failed sign-ins, and scans. Active users are stored as salted hashes, never user ids. It runs at start-up (catching up every complete day still in the raw log) and then every hour (<code>MORROW_USAGE_ROLLUP_INTERVAL_SECONDS</code>). Summaries are kept 400 days (<code>MORROW_USAGE_ROLLUP_RETENTION_DAYS</code>).</li><li>The dashboard reads a finished day from its summary as soon as that day is summarised, and the raw log only for today and for any day not summarised yet. A summary is built from exactly the raw rows of that day, so the numbers are the same either way; it is simply much faster than re-reading millions of raw rows on every load. Summaries also hold per-route request and error counts, which is where <b>Routes by errors</b> gets its finished days. After an upgrade that changes what a summary holds, the job rebuilds every day still in the raw log before the dashboard uses them again. If you later raise <code>MORROW_TRAFFIC_RETENTION_DAYS</code>, the days whose raw rows were already deleted under the old setting keep answering from their summary instead of showing a gap.</li><li>A period not covered by raw data or summaries is <b>blank</b>, never zero. Charts say "Request data is retained from …; earlier buckets are unknown and left blank." until the summaries cover the range.</li><li>History starts at the last 7 days of raw data on the day the feature is deployed. A fresh deployment reaches full 30-day charts after about 30 days and full 90-day comparisons after about 180 days. Days are UTC; today always comes from the raw log, and so does yesterday until the hourly job has summarised it.</li><li>If the API is down for more than 7 days, those days stay unknown.</li><li>Request attribution to organizations started with this release; older requests stay unattributed. Anonymous requests, rejected tokens and operator traffic to <code>/platform</code> and <code>/vendor-admin</code> are logged without an organization. Request bodies, query strings, tokens and key secrets are never stored.</li><li><b>Unavailable metrics</b> (bottom of the page) lists every metric this server cannot produce and why.</li></ul>
      </details>
      <details class="faq"><summary>4. Customer 360</summary>
      <p>Open it from <b>Customers › Organizations</b>, a dashboard row, or search.</p>
      <ul><li><b>Header</b>: status, plan, created date, last activity. Actions: <b>View as customer (read-only)</b>, <b>Manage…</b> (plan, status, lifecycle stage, renewal, account owner, notes, rename, suspend, resume, archive, purge, feature flags), <b>Suspend</b>, <b>Resume</b>, <b>Archive…</b>, <b>Export</b> (<b>GDPR export (JSON)</b>, <b>Audit package (ZIP)</b>, <b>Tenant audit log (CSV)</b>).</li><li><b>KPIs</b>: Risk score (activation risk), Scans, Assets, Users, Open remediations, Recent sign-ins. The risk score is an onboarding signal built only from observed facts about this customer — no sign-in on record, no scan, no active user in 7 days, and subscription status — weighted by the platform. It is not a security score and says nothing about their cryptography.</li><li><b>Charts</b>: Sign-ins, API requests (here 429s are counted inside client errors), Scans. These reflect the organization's own signed-in traffic.</li><li><b>Cards</b>: Members, Feature adoption, Recent activity, Onboarding checklist, API keys, Sessions, Feature flags, Account &amp; notes, <b>Active support sessions</b>.</li><li>The rate-limit state for the organization is in <b>Manage…</b> under <b>Users &amp; access</b>: the saved values and whether they are enforced.</li></ul>
      </details>
      <details class="faq"><summary>5. Usage &amp; adoption</summary>
      <ul><li><b>Adoption</b>: the share of organizations using each feature in the range.</li><li><b>Features</b> table: organizations using the feature (out of all organizations), event volume, change against the previous period, a trend sparkline and when it was last used.</li><li>A feature counts as used by an organization when that organization has at least one event for it in the range, counted from the product's own records (scans, assets, remediations, webhooks and so on), not from page views.</li></ul>
      </details>
      <details class="faq"><summary>6. Rate limits</summary>
      <p><b>Access › Rate limits</b> stores two numbers per organization: <b>API calls per minute</b> (every signed-in request from that organization) and <b>Scans per hour</b> (requests that start a scan: TLS, SSH, SAST, dependency, binary, mobile/IoT, supply-chain, secrets and CI-gate scans, running a scan schedule or collection, crypto discovery). Choose the organization, set both, give a <b>Reason</b> and press <b>Save overrides</b>.</p>
      <p><b>Which limit applies</b></p>
      <p>For each organization, in this order:</p>
      <div class="stepList"><div class="stepItem"><div><b>Override</b> saved on this page (both values come from it).</div></div><div class="stepItem"><div><b>Platform default</b>: <code>MORROW_ORG_DEFAULT_API_CALLS_PER_MIN</code> and <code>MORROW_ORG_DEFAULT_SCANS_PER_HOUR</code> (0 = none).</div></div></div>
      <p>The page note and <b>Customer 360 › Rate limits</b> say which one is in force: <b>operator override</b>, <b>platform default</b>, or <b>not limited</b>. The API returns it as <code>limit_source</code> (<code>override</code>, <code>plan</code>, <code>default</code>, <code>none</code>) with <code>limit_source_label</code>.</p>
      <p>With none of these, the organization is not limited per organization; per-IP limits still apply. The page then shows the suggested values (100 per minute, 60 per hour) and says "The values shown are the suggested defaults. Save them to enforce them." There is no button to delete an override once saved; lower or raise it instead.</p>
      <p><code>MORROW_ORG_RATE_LIMITS_ENABLED=0</code> switches enforcement off; values are then stored only.</p>
      <p><b>Behaviour</b></p>
      <ul><li>Windows slide: the last 60 seconds for API calls, the last hour for scans. A scan request counts toward both limits, even if the scan is then rejected for bad input.</li><li>Over the limit: HTTP 429 with <code>Retry-After</code>, <code>X-RateLimit-Limit</code>, <code>X-RateLimit-Remaining: 0</code> and a message naming the limit. Allowed responses to a limited organization carry <code>X-RateLimit-Limit</code> and <code>X-RateLimit-Remaining</code>.</li><li>One organization hitting its limit never affects another.</li><li><b>Exempt</b>: <code>/platform</code> and <code>/vendor-admin</code>, health and status checks, the web UI and static files, API docs, public pages, all <code>/auth</code> routes (they have their own limit, <code>MORROW_RATE_LIMIT_AUTH</code>, default 10/minute) and anonymous requests.</li><li>A saved change applies at once on the server that saved it and within 15 seconds elsewhere (<code>MORROW_ORG_RATE_LIMIT_CACHE_SECONDS</code>).</li></ul>
      <p><b>Redis</b></p>
      <p>With <code>REDIS_URL</code> or <code>CELERY_BROKER_URL</code> set, all API servers share one count. Without Redis each server counts on its own, so N servers allow up to N times the limit. If Redis fails, servers fall back to local counting and requests are not blocked.</p>
      <p><b>Seeing 429s</b></p>
      <p><b>Rate-limit pressure</b> on this page and <b>Operations › Incidents &amp; abuse</b> list recent blocks by organization and route (sources <code>org_api_calls_per_min</code> and <code>org_scans_per_hour</code>). That list is in each server's memory and resets on restart. The request journal is the durable record and feeds the "Rate-limited requests (429)" KPI.</p>
      </details>
      <details class="faq"><summary>7. Alert routing</summary>
      <p><b>Operations › Alert routing</b> sends the same items as the notifications bell to your on-call tools. Owners and operators change channels, and every change needs a reason; support and auditors can view channels and the delivery log.</p>
      <p><b>What can be alerted</b></p>
      <ul><li><code>sla_breach</code>: <b>When</b> A remediation passed its SLA and is still open. <b>Severity</b> critical for high/critical findings, otherwise warn</li><li><code>failed_login_spike</code>: <b>When</b> At least 10 failed sign-ins in the last hour and at least 3× the hourly average of the previous 24 hours. <b>Severity</b> critical</li><li><code>maintenance_overdue</code> / <code>maintenance</code>: <b>When</b> Maintenance still on after its end time / maintenance on. <b>Severity</b> critical / warn</li><li><code>go_live_blockers</code>: <b>When</b> The go-live gate has failing required checks or warnings. <b>Severity</b> warn</li><li><code>incident</code>: <b>When</b> API errors or slow requests in the live window. <b>Severity</b> critical if any are high severity, otherwise warn</li><li><code>abuse</code>: <b>When</b> Rate-limit or abuse signals in the live window. <b>Severity</b> warn</li><li><code>security_finding</code>: <b>When</b> An open critical or high external security finding. <b>Severity</b> critical / warn</li><li><code>api_key_expiring</code>: <b>When</b> An organization API key expires within 7 days. <b>Severity</b> warn</li><li><code>org_suspended</code>: <b>When</b> An organization is suspended. <b>Severity</b> warn</li><li><code>feedback</code>: <b>When</b> New customer feedback. <b>Severity</b> warn for a rating of 2 or lower, otherwise info</li><li><code>autopatch_pending</code>: <b>When</b> An autopatch awaits approval. <b>Severity</b> warn</li><li><code>break_glass</code>: <b>When</b> The shared platform key was used as break-glass in production or staging (shown for 24 hours). <b>Severity</b> critical</li><li><code>support_session</code>: <b>When</b> Vendor support is viewing a customer's console. <b>Severity</b> info, warn for break-glass</li></ul>
      <p>Every kind can be chosen in <b>Only these kinds</b>, and PagerDuty resolves each of them when the item clears. The list in the channel editor comes from the server (<code>notification_kinds</code> in <code>GET /platform/alert-channels</code>), which reads the same catalogue the notifications use.</p>
      <p><b>Add a channel</b></p>
      <p>Press <b>Add channel</b>, choose a <b>Type</b>, a <b>Name</b>, the target, <b>Minimum severity</b> (<b>Critical only</b>, <b>Warn and critical</b>, <b>Everything (info, warn, critical)</b>), optionally <b>Only these kinds</b>, <b>Enabled</b>, and optional quiet hours (<b>From</b>, <b>Until</b>, <b>Time zone (IANA)</b>, <b>Still send critical</b>). Give a reason and press <b>Save channel</b>. Then press <b>Send test</b> on the row; the message is marked <b>[TEST]</b> and the result appears above the list and in the delivery log.</p>
      <ul><li><b>Slack incoming webhook</b>: in Slack, enable Incoming Webhooks for an app, add a webhook for the channel, paste the <code>https://hooks.slack.com/services/...</code> URL.</li><li><b>Email</b>: needs platform email (<code>MORROW_SMTP_HOST</code> and <code>MORROW_SMTP_FROM</code>, or <code>MORROW_PLATFORM_SMTP_ORG_ID</code>). Up to 20 comma-separated addresses. Plain-text messages with subjects like <code>[Morrow] [CRITICAL] …</code>.</li><li><b>PagerDuty Events API v2</b>: in PagerDuty add the Events API v2 integration to a service and paste its integration (routing) key. The dedup key is the notification id; when the item clears, the incident is resolved. The test opens and immediately resolves a test incident.</li><li><b>Generic webhook (JSON)</b>: an <code>https://</code> URL; each alert is a JSON POST with <code>source</code>, <code>event</code>, <code>severity</code>, <code>subject</code>, <code>text</code>, <code>link</code>, <code>sent_at</code> and a <code>notifications</code> list.</li></ul>
      <p>Slack, PagerDuty and webhook targets are encrypted with <code>MORROW_VAULT_MASTER_KEY</code>; without it those types cannot be saved. After saving, only a hint is shown; leave the target empty when editing to keep it. Webhook URLs must be <code>https</code>, contain no username or password and point at a public address; private, loopback, link-local, carrier-grade NAT and reserved addresses are refused on save and on every send, and redirects are not followed.</p>
      <p><b>Dedupe, renotify, rate cap</b></p>
      <ul><li>The dispatcher runs inside the API every 60 seconds (<code>MORROW_ALERT_DISPATCH_INTERVAL_SECONDS</code>). With several API servers only one dispatches at a time.</li><li><b>Dedupe</b>: each channel remembers what it sent; an open item is not re-sent every run.</li><li><b>Renotify</b>: an item still open 24 hours after it was last sent (<code>MORROW_ALERT_RENOTIFY_HOURS</code>) is sent again, prefixed "Still open:".</li><li><b>Resolve</b>: when an item disappears PagerDuty gets a resolve event; Slack, email and webhooks get nothing. Nothing is resolved from a run in which that source failed to load.</li><li><b>Deleting or disabling a PagerDuty channel</b> resolves every incident that channel still has open first, one resolve per incident (dedup key = notification id), before its routing key is discarded. The response and the delivery log say which incidents were resolved and which were not. A resolve PagerDuty did not accept is kept — with the key, still encrypted — and retried by the dispatcher, up to 10 attempts with a growing wait (<code>MORROW_ALERT_RESOLVE_MAX_ATTEMPTS</code>); after that the delivery log says to close the incident in PagerDuty. Alerts that went out inside a digest message share one incident whose dedup key is not stored, so those are reported rather than resolved. Re-enabling a channel before a queued resolve goes out drops it: the incident is open again.</li><li><b>Rate cap</b>: at most 20 messages per channel in 10 minutes (<code>MORROW_ALERT_RATE_CAP</code>, <code>MORROW_ALERT_RATE_WINDOW_MINUTES</code>). If more are due, the most severe go individually and the last slot becomes one digest. A channel already at its cap waits, and the log shows one "rate limited" entry.</li><li><b>Failures</b> are logged and retried on the next run.</li><li><code>MORROW_ALERT_DISPATCH_ENABLED=0</code> stops automatic sending; <b>Send test</b> still works.</li></ul>
      <p>The <b>Delivery log</b> lists every attempt (time, channel, event, status, notification, HTTP status, latency, error), filterable by channel, status and event, kept 30 days (<code>MORROW_ALERT_DELIVERY_RETENTION_DAYS</code>). Error text never contains the URL or key. Deleting a channel keeps its past log entries, including the resolve it sent for each incident it had open.</p>
      </details>
      <details class="faq"><summary>8. Support sessions</summary>
      <p>Lets support open a customer's console <b>read-only</b>, for a limited time, with a reason the customer sees.</p>
      <p><b>Starting one</b></p>
      <div class="stepList"><div class="stepItem"><div><b>Customers › Customer 360</b> for the organization, then <b>View as customer (read-only)</b>. Requires the owner, operator or support role; auditors can only list sessions and read journals.</div></div><div class="stepItem"><div>Fill in <b>Reason</b> (at least 10 characters; the customer sees it), <b>Duration</b> (5, 15, 30, 45 or 60 minutes; default 30) and <b>Ticket reference (optional)</b>.</div></div><div class="stepItem"><div>Press <b>Start read-only session</b>. The customer console opens in a new tab. The launch link works once, within 60 seconds; if the browser blocked the tab, Customer 360 shows the link for that minute.</div></div></div>
      <p>The tab shows a dark orange <b>Support view · read-only</b> bar with your name, the reason, a countdown and <b>End session</b>.</p>
      <p><b>Limits and what is blocked</b></p>
      <ul><li>The session behaves like a <b>viewer</b> in that organization. Change buttons are greyed out ("Read-only support view: changes are disabled"), and the server refuses every write except ending the session.</li><li>Anything not on the allow-list of read-only pages is refused, and always: stored credentials and secrets (vault, API key material, webhook, Slack, Jira, ServiceNow, email and Cloudflare settings), user, password and token management, bulk exports and downloads (audit CSV, GDPR export, CBOM and scan exports, evidence bundles, readiness and blast-radius exports, installers, generated CI scripts), every <code>/platform</code>, <code>/admin</code> and vendor admin route, and any other organization.</li><li>Suspended or archived organization: only an owner can start a session, and most customer pages still refuse requests.</li><li>Requires <code>MORROW_AUTH_JWT_SECRET</code>; without it, starting a session answers 503.</li></ul>
      <p><b>Ending</b></p>
      <p><b>End session</b> in the bar; the time limit; <b>Revoke…</b> from <b>Active support sessions</b> in Customer 360 or <b>Customers › Support sessions</b> (reason required; the pass stops working within 5 seconds, at once on the server that handled it, and the open tab notices within about 20 seconds); or the customer turning access off (ends immediately).</p>
      <p><b>Customer opt-in and revocation</b></p>
      <p>Customer organization admins control <b>Administration › Support access › Allow vendor support access</b> in their console. It is off unless an organization admin explicitly approves access. Platform owners cannot override a customer denial. Turning access off blocks further support requests and revokes active sessions.</p>
      <p><b>Audit</b></p>
      <p><b>Customers › Support sessions</b> lists every session, filterable by organization, status and operator or ticket, with a <b>Request journal</b> of every request made. The customer's audit log records start, launch, revoke and expiry, plus role-checked data loaded under the actor <code>support:&lt;session id&gt;</code>. The customer also sees every request the session made (path and time, from the same journal) in <b>Administration › Support access › Pages viewed</b>; <code>GET /org/support-access/history</code> returns only the caller's own organization's sessions and requests. Expiry is recorded the next time someone lists sessions, opens notifications, loads the customer's history or uses the expired pass.</p>
      </details>
      <details class="faq"><summary>9. Invitations</summary>
      <p><b>Customers › Invitations</b>: choose the <b>Organization</b>, the <b>Role</b> (viewer, analyst (operator), org admin (admin)), the <b>Email</b>, <b>Expires after (hours)</b> (1 to 720, default 72) and a <b>Reason</b>, then <b>Create invitation</b>. The <b>Invitation created</b> dialog shows the invite link once; use <b>Copy invite link</b> and send it over a trusted channel. If platform email is configured, each pending invitation has <b>Email the invite</b>, which sends the link to the invited address only.</p>
      <p>The link looks like <code>https://&lt;public URL&gt;/invite#token=…</code> (base from <code>MORROW_PUBLIC_BASE_URL</code>, otherwise the request origin). The code after <code>#</code> is not sent to servers, so it stays out of logs and Referer headers. The invite page shows organization, role, the masked address, expiry and status, and handles "not signed in", "different email", expired, used, revoked and not-found cases. The server enforces: signed in with the matching email, one use, not expired or revoked; lookups are rate limited with the sign-in limit (<code>MORROW_RATE_LIMIT_AUTH</code>).</p>
      <p>Customer organization admins can also invite from their console (<b>Administration › Invitations › Invite</b>) and get the same link.</p>
      </details>
      <details class="faq"><summary>10. Announcements and maintenance</summary>
      <ul><li><b>Product › Announcements</b>: <b>Title</b>, <b>Message</b>, <b>Severity</b> (info, warn, critical), <b>Audience</b> (<b>All customers</b> or <b>Selected organizations</b> by id), optional <b>Starts</b> and <b>Ends</b> (local time), then <b>Publish announcement</b>. The list shows active, scheduled and expired notices. In the customer console info and warn notices can be dismissed per browser (they reappear if edited); critical notices cannot.</li><li><b>Operations › Maintenance mode</b>: <b>Customer message</b>, <b>Expected end (local time)</b>, <b>Reason</b>, then <b>Turn maintenance on…</b> or <b>Turn maintenance off</b>. While on, customer requests other than GET, HEAD and OPTIONS answer 503 with your message; sign-in, reads, health, status and platform administration keep working. The expected end is informational: writes stay paused until an operator turns maintenance off, and an overdue window raises a critical notification. Customers see a <b>Maintenance in progress</b> banner that cannot be dismissed. Pair it with an announcement.</li></ul>
      </details>
      <details class="faq"><summary>11. Background jobs</summary>
      <p><b>Operations › Background jobs</b> lists each job with kind, status, last run, next run, runs in 24 hours and the last error: Scheduled scans, Remediation validation, Digest snapshots, Drift sentinel snapshots, Data retention, Webhook deliveries, <b>Daily usage rollups</b> (days summarised and range), Request journal writer, Maintenance state cache, Async worker (Celery), <b>Alert routing dispatcher</b> (last run, last error, attempts and failures in 24 hours, whether the loop is running, and any PagerDuty resolves from a deleted or disabled channel still waiting to be retried).</p>
      </details>
      <details class="faq"><summary>12. Notifications</summary>
      <p>The bell groups items by <b>Critical</b>, <b>Warning</b> and <b>Info</b>, refreshes every 60 seconds while the tab is visible, and links each item to the page that deals with it. <b>Mark all read</b> is remembered for this tab only. <b>Operations › Notifications</b> shows the full list.</p>
      </details>
      <details class="faq"><summary>13. Audit and exports</summary>
      <ul><li><b>Security › Audit log</b>:<ul><li><b>Tenant audit log</b>: one organization's tamper-evident log, filter by actor, action and decision, <b>Export CSV</b>.</li><li><b>Admin Audit</b>: every platform administration change with operator, role, organization, reason and time; search, filter by organization, action prefix, operator and dates; <b>Export CSV</b>.</li><li><b>Authentication events</b>: real outcomes (password and SAML sign-ins, refreshes, revocations, rejected tokens, rate limiting). Identity-provider failures need the provider's own logs.</li></ul></li><li><b>Customer 360 › Export</b> and <b>Security › Data &amp; retention › Customer data export</b>: GDPR export (JSON; owner or operator) and audit package (ZIP). Every export is recorded.</li><li><b>Data &amp; retention</b>: preview (<b>Preview (dry run)</b>) then <b>Delete matching rows…</b> for aged operational records; audit logs are never deleted.</li><li><b>Traffic Lens</b>: filter by IP and route and export up to 5,000 matching requests as NDJSON or OTEL JSON.</li></ul>
      </details>
      <details class="faq"><summary>14. Launch readiness (go-live gate)</summary>
      <p><b>Security › Launch readiness › Go-Live Gate</b> returns <b>go</b> only when every required check passes and no blocking warning stands; advisories are reported but do not block. The required checks include environment, auth mode and auth required, default role, JWT config and issuer, CORS, allowed hosts, platform admin key checks, production demo lockout, security headers, traffic monitor and persistence, security journal, state backend scaling, observability, Airlock signing and agent signatures, retention policy, Postgres, RLS, database role, secrets and queue, plus three operator sign-in checks:</p>
      <ul><li><b>Operator SSO</b>: issuer, client id and a roster or allowed domains are configured.</li><li><b>Operator MFA required</b>: set <code>MORROW_ENVIRONMENT=production</code> and do not set <code>MORROW_ADMIN_REQUIRE_MFA=0</code>.</li><li><b>Shared key is break-glass only</b>: fails while <code>MORROW_ALLOW_BREAK_GLASS_KEY=1</code>.</li></ul>
      <p>The gate also lists manual exit criteria (real GitHub App pilot, tenant isolation via POST <code>/platform/tenant-isolation/verify</code>, backup and restore drill, audit package review, dashboards checked during pilot traffic, CI security workflow, threat model sign-off). <code>scripts/check-go-live-gate.ps1</code> runs the same gate from a shell.</p>
      <p>The gate reads settings. It cannot tell you whether the accounts behind them work, because it never calls them. <code>scripts/check-integrations.py</code> does, and it is the check to run before you hand the URL to a customer:</p>
      <ul><li><code>.\scripts\check-integrations.ps1</code> checks SSO, alert channels, Redis, Postgres, the vault key and the AI provider.</li><li><code>.\scripts\check-integrations.ps1 -Offline</code> checks configuration only, with no network call at all.</li><li><code>.\scripts\check-integrations.ps1 -SendTest</code> also sends ONE labelled test message to each enabled alert channel.</li></ul>
      <p>Each area comes back <b>CONFIGURED</b>, <b>MISSING</b> or <b>ERROR</b> with a one-line fix, and it exits <code>0</code> when nothing is broken, <code>1</code> when something configured is failing, <code>2</code> when a required production setting is missing. It never prints a secret value, and nothing is sent to a customer: the alert test message is the only outbound write, it needs <code>-SendTest</code>, and it is labelled as a test. Section 1a of [PRODUCTION_DEPLOYMENT_RUNBOOK.md](PRODUCTION_DEPLOYMENT_RUNBOOK.md) lists what each area checks.</p>
      </details>
      <details class="faq"><summary>15. Runbook: onboard a new customer</summary>
      <div class="stepList"><div class="stepItem"><div><b>Create the organization.</b> <b>Customers › Organizations › New customer</b>: <b>Organization id</b> (for example <code>acme-bank</code>), <b>Display name</b>, <b>Plan</b>, <b>Initial status</b> (active or trial), <b>Reason</b> (for example the order form reference), <b>Create customer</b>.</div></div><div class="stepItem"><div><b>Invite the customer admin.</b> <b>Customers › Invitations</b>: organization, role <b>org admin (admin)</b>, their email, expiry, reason, <b>Create invitation</b>. Copy the link and send it over a trusted channel, or use <b>Email the invite</b>. The person must be able to sign in with that email (through the customer's configured SSO or JWT identity, or a built-in account): there is no self sign-up.</div></div><div class="stepItem"><div><b>Set limits.</b> If this organization needs limits other than the platform default, <b>Access Rate limits</b>: choose the organization, <b>API calls per minute</b>, <b>Scans per hour</b>, reason, <b>Save overrides</b>. Leave it alone to use the plan or platform default.</div></div><div class="stepItem"><div><b>Verify in Customer 360.</b> Refresh the organization: <b>Members</b> shows the admin once they accept; <b>Manage… › Users &amp; access</b> shows the rate-limit enforcement state; <b>Onboarding checklist</b> shows the next activation steps; <b>Recent activity</b> shows your admin changes.</div></div><div class="stepItem"><div><b>Tell the customer</b> that support access requires their explicit approval and where to control it (<b>Administration › Support access</b>).</div></div></div>
      </details>
      <details class="faq"><summary>16. Runbook: an alert arrives</summary>
      <div class="stepList"><div class="stepItem"><div><b>Acknowledge</b> in your on-call tool so nobody else starts the same work. A message beginning "Still open:" is a 24-hour reminder, not a new problem.</div></div><div class="stepItem"><div><b>Open the console</b> and the bell or <b>Operations › Notifications</b>. Each item links to the page that deals with it.</div></div><div class="stepItem"><div><b>Triage by kind:</b><ul><li><code>incident</code>: <b>Operations › Incidents &amp; abuse</b> and <b>Service health</b> (request observability shows recent errors and slow requests); check <b>Background jobs</b> for failing jobs.</li><li><code>abuse</code> or 429s: <b>Incidents &amp; abuse</b> and <b>Access › Rate limits › Rate-limit pressure</b>; decide whether a limit is too low or a client misbehaves. Use <b>Traffic Lens</b> for source IPs and routes.</li><li><code>failed_login_spike</code>: <b>Security › Audit log › Authentication events</b>; consider <b>Access › Sessions › Revoke access</b> for affected users or organizations.</li><li><code>maintenance_overdue</code>: finish the work or <b>Turn maintenance off</b>.</li><li><code>go_live_blockers</code>: <b>Security › Launch readiness</b>.</li><li><code>security_finding</code>: <b>Security › Security truth</b>.</li><li><code>api_key_expiring</code>: <b>Access › API keys</b>; rotate with a grace period.</li><li><code>org_suspended</code>, <code>sla_breach</code>, <code>feedback</code>, <code>autopatch_pending</code>: open the linked customer, remediation, feedback or autopatch.</li><li><b>Break-glass platform key used</b> (bell): confirm the emergency is real; when over, remove <code>MORROW_ALLOW_BREAK_GLASS_KEY</code>, restart and rotate the shared key.</li></ul></div></div><div class="stepItem"><div><b>Communicate</b> if customers are affected: publish an announcement, and use maintenance mode if writes must stop.</div></div><div class="stepItem"><div><b>Resolve</b> the cause. The item clears from notifications on its own; PagerDuty incidents resolve automatically for the kinds in section 7. Resolve other incidents in PagerDuty yourself.</div></div><div class="stepItem"><div><b>Check delivery</b> if an expected alert never came: <b>Alert routing › Delivery log</b> (failed, suppressed during quiet hours, or rate limited) and the <b>Alert routing dispatcher</b> job.</div></div><div class="stepItem"><div><b>Record</b> what happened; admin changes are already in <b>Admin Audit</b>.</div></div></div>
      </details>
      <details class="faq"><summary>17. Rotating the vault master key</summary>
      <p><code>MORROW_VAULT_MASTER_KEY</code> encrypts stored integration credentials, gateway site keys, operators' MFA secrets, GitHub sign-in tokens and alert channel targets. <code>scripts/rotate-vault-master-key.py</code> re-encrypts all five.</p>
      <div class="stepList"><div class="stepItem"><div>Schedule a maintenance window and back up the databases.</div></div><div class="stepItem"><div>Put the current key in <code>MORROW_VAULT_MASTER_KEY</code> and the new one in <code>MORROW_VAULT_MASTER_KEY_NEW</code> in the shell only, or pass <code>--generate-new-key-file &lt;path&gt;</code> to create one (written only to that owner-only file, never shown).</div></div><div class="stepItem"><div>Rehearse (default, changes nothing): <code>backend/.venv/Scripts/python.exe scripts/rotate-vault-master-key.py</code>. If any value cannot be decrypted with the current key, it stops and changes nothing.</div></div><div class="stepItem"><div>Apply: add <code>--apply</code>. Values are verified with the new key before commit.</div></div><div class="stepItem"><div>Store the new key as <code>MORROW_VAULT_MASTER_KEY</code> in the secret manager, restart every server and worker, and check integrations, gateways and MFA sign-in.</div></div><div class="stepItem"><div>Press <b>Send test</b> on one Slack, PagerDuty or webhook alert channel to confirm its target decrypts with the new key.</div></div><div class="stepItem"><div>Destroy the old key and the key file.</div></div></div>
      <p>Also: SAML users sign in again; evidence signed with the vault key (when no <code>MORROW_EVIDENCE_SIGNING_KEY</code> is set) no longer verifies, so set a dedicated evidence key first; and, if <code>MORROW_USAGE_ACTOR_SALT</code> is unset, distinct-user counting restarts.</p>
      </details>
      <details class="faq"><summary>18. Environment variable reference</summary>
      <p>Names and defaults as read by the code; <code>.env.prod.example</code> carries a commented section for each group.</p>
      <p><b>Operator sign-in</b></p>
      <ul><li><code>MORROW_ENVIRONMENT</code>: <b>Default</b> <code>local</code>. <b>Meaning</b> <code>production</code>, <code>prod</code>, <code>staging</code> and <code>stage</code> are strict: shared key refused, MFA on</li><li><code>MORROW_ADMIN_OIDC_ISSUER</code>: <b>Default</b> none. <b>Meaning</b> Identity provider issuer URL</li><li><code>MORROW_ADMIN_OIDC_CLIENT_ID</code>: <b>Default</b> none. <b>Meaning</b> OIDC client id</li><li><code>MORROW_ADMIN_OIDC_CLIENT_SECRET</code>: <b>Default</b> empty. <b>Meaning</b> Leave empty for a public PKCE client</li><li><code>MORROW_ADMIN_OIDC_REDIRECT_URI</code>: <b>Default</b> <code>{MORROW_PUBLIC_BASE_URL}/vendor-admin/sso/callback</code>. <b>Meaning</b> Must match the IdP registration</li><li><code>MORROW_ADMIN_OPERATOR_ROLES</code>: <b>Default</b> none. <b>Meaning</b> Roster: <code>email=role</code> pairs (owner, operator, support, auditor)</li><li><code>MORROW_ADMIN_OIDC_ALLOWED_DOMAINS</code>: <b>Default</b> none. <b>Meaning</b> Allowed email domains</li><li><code>MORROW_ADMIN_OIDC_DOMAIN_ROLE</code>: <b>Default</b> <code>auditor</code>. <b>Meaning</b> Role for domain members when no roster is set</li><li><code>MORROW_ADMIN_OIDC_SCOPES</code>: <b>Default</b> <code>openid email profile</code>. <b>Meaning</b> Requested scopes</li><li><code>MORROW_ADMIN_OIDC_EMAIL_CLAIM</code>: <b>Default</b> <code>email</code>. <b>Meaning</b> Claim holding the email</li><li><code>MORROW_ADMIN_OIDC_REQUIRE_EMAIL_VERIFIED</code>: <b>Default</b> <code>1</code>. <b>Meaning</b> Require <code>email_verified=true</code></li><li><code>MORROW_ADMIN_SESSION_ABSOLUTE_SECONDS</code>: <b>Default</b> <code>28800</code>. <b>Meaning</b> Longest console session; also how long a named key's MFA verification lasts</li><li><code>MORROW_ADMIN_SESSION_IDLE_SECONDS</code>: <b>Default</b> <code>1800</code>. <b>Meaning</b> Inactivity timeout</li><li><code>MORROW_ADMIN_REQUIRE_MFA</code>: <b>Default</b> on in production/staging. <b>Meaning</b> Require TOTP</li><li><code>MORROW_ADMIN_STEP_UP_SECONDS</code>: <b>Default</b> <code>900</code>. <b>Meaning</b> How recent a code must be for risky actions</li><li><code>MORROW_ALLOW_BREAK_GLASS_KEY</code>: <b>Default</b> off. <b>Meaning</b> Accept the shared key in production/staging</li><li><code>MORROW_PLATFORM_ADMIN_KEY</code>: <b>Default</b> none. <b>Meaning</b> Shared key (break-glass in production)</li><li><code>MORROW_PLATFORM_ADMIN_KEY_ROLE</code>: <b>Default</b> <code>owner</code>. <b>Meaning</b> Ceiling for the shared key</li><li><code>MORROW_PLATFORM_OPERATORS</code>: <b>Default</b> none. <b>Meaning</b> Named operator keys (JSON list with <code>key_sha256</code>)</li><li><code>MORROW_VAULT_MASTER_KEY</code>: <b>Default</b> none. <b>Meaning</b> Required for MFA secrets and encrypted alert targets</li><li><code>MORROW_VAULT_MASTER_KEY_NEW</code>: <b>Default</b> none. <b>Meaning</b> Only for a rotation run</li></ul>
      <p><b>Usage rollups and rate limits</b></p>
      <ul><li><code>MORROW_USAGE_ROLLUPS_ENABLED</code>: <b>Default</b> <code>1</code>. <b>Meaning</b> Daily summaries on or off</li><li><code>MORROW_USAGE_ROLLUP_INTERVAL_SECONDS</code>: <b>Default</b> <code>3600</code>. <b>Meaning</b> Check interval (minimum 60)</li><li><code>MORROW_USAGE_ROLLUP_RETENTION_DAYS</code>: <b>Default</b> <code>400</code>. <b>Meaning</b> Summary retention (35 to 3650)</li><li><code>MORROW_USAGE_ACTOR_SALT</code>: <b>Default</b> derived from <code>MORROW_VAULT_MASTER_KEY</code> or <code>MORROW_AUTH_JWT_SECRET</code>. <b>Meaning</b> Salt for active-user hashes; set a long random value and keep it stable</li><li><code>MORROW_TRAFFIC_RETENTION_DAYS</code>: <b>Default</b> <code>7</code> (max 30). <b>Meaning</b> Raw request records</li><li><code>MORROW_AUTH_LOG_RETENTION_DAYS</code>: <b>Default</b> <code>90</code> (max 365). <b>Meaning</b> Raw sign-in records</li><li><code>MORROW_ORG_RATE_LIMITS_ENABLED</code>: <b>Default</b> <code>1</code>. <b>Meaning</b> Per-organization enforcement</li><li><code>MORROW_ORG_RATE_LIMIT_CACHE_SECONDS</code>: <b>Default</b> <code>15</code>. <b>Meaning</b> Override cache per server</li><li><code>MORROW_ORG_DEFAULT_API_CALLS_PER_MIN</code>: <b>Default</b> <code>0</code>. <b>Meaning</b> Default per-minute limit (0 = none)</li><li><code>MORROW_ORG_DEFAULT_SCANS_PER_HOUR</code>: <b>Default</b> <code>0</code>. <b>Meaning</b> Default hourly scan limit (0 = none)</li><li><code>REDIS_URL</code> / <code>CELERY_BROKER_URL</code>: <b>Default</b> none. <b>Meaning</b> Shared rate-limit counters across servers</li><li><code>MORROW_RATE_LIMIT_AUTH</code>: <b>Default</b> <code>10/minute</code>. <b>Meaning</b> Sign-in and invite lookups</li></ul>
      <p><b>Support sessions</b></p>
      <ul><li><code>MORROW_AUTH_JWT_SECRET</code>: <b>Default</b> none. <b>Meaning</b> Required; without it sessions answer 503</li><li><code>MORROW_SUPPORT_SESSION_CACHE_SECONDS</code>: <b>Default</b> <code>5</code> (capped at 5). <b>Meaning</b> How long a server trusts a cached session status</li></ul>
      <p><b>Alert routing and platform email</b></p>

/* Two-column rows hold a hole open whenever one card is much shorter than its
 * partner. CSS cannot measure that, so do it once after a view renders.
 *
 * Two remedies, because stacking is not always the better one: a card whose
 * content is narrow (a timeline, a list) turns a vertical gap into a wider
 * horizontal one when it goes full width. So the first move is to give the
 * taller card the wider column, which lets its content reflow shorter, and the
 * row only stacks when the mismatch is too big for that to close.
 *
 * Classes are cleared before measuring so a row is always judged on its natural
 * proportions and can never oscillate. */
const ROW_PAIRS = ".g-2-1, .g-1-2, .g-3-2, .g-2-3, .warRoom";

  rows.forEach(g => g.classList.remove("rowStacked", "rowSwapped"));
  for (const grid of rows) {
    const [first, second] = [...grid.children].map(el => el.getBoundingClientRect());
    const tall = Math.max(first.height, second.height);
    const short = Math.min(first.height, second.height);
    if (!tall) continue;
    const gap = (tall - short) / tall;
    if (gap > 0.5) { grid.classList.add("rowStacked"); continue; }
    // The taller card is in the narrower column: widen it instead of stacking.
    const tallerIsNarrower = first.height > second.height

let demoRadarStop = null;
/** Rings are environments (production innermost); a sweep lights each endpoint in its status colour. */
function startDemoRadar() {
  const cv = $("#dgCanvas");
  if (!cv) return;
  const ctx2 = cv.getContext("2d");
  const out = $("#dgReadout");
  const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  const ring = { p: 0.42, s: 0.68, d: 0.9 };
  const envName = { p: "production", s: "staging", d: "development" };
  const pts = [], GAP = 0.8;
  for (const env of ["p", "s", "d"]) {
    const list = DEMO_ESTATE.filter((e) => e[1] === env);
    list.forEach((e, i) => {
      // Spread round the ring but leave a gap at 12 o'clock for the ring labels.
      const a = -Math.PI / 2 + GAP / 2 + ((i + (env === "s" ? 0.5 : env === "d" ? 0.25 : 0)) / list.length) * (Math.PI * 2 - GAP);
      const jitter = ((e[0].length * 37) % 11 - 5) / 220;   // stable, so nodes never jump between frames
      pts.push({ e, a, r: ring[env] + jitter, lit: -1e9 });
    });

    const w = cv.clientWidth, h = cv.clientHeight;

    if (cv.width !== Math.round(w * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }

    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, w, h);
    c.lineWidth = 1;
    c.strokeStyle = line;
    for (const k of ["p", "s", "d"]) { c.beginPath(); c.arc(cx, cy, ring[k] * R, 0, Math.PI * 2); c.stroke(); }
    c.setLineDash([2, 4]);

    c.setLineDash([]);
    c.fillStyle = ink3;
    c.font = `600 9px ${css("--mono") || "monospace"}`;
    c.textAlign = "center";
    for (const k of ["p", "s", "d"]) c.fillText(envName[k].toUpperCase(), cx, cy - ring[k] * R + 12);

    }

    for (const p of pts) {
      const ang = ((p.a % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
      if (sweep !== null) {
        const d = (sweep - ang + Math.PI * 2) % (Math.PI * 2);
        if (d < 0.05 && now - p.lit > 1000) { p.lit = now; newest = p; }
      }
      const age = still ? 0 : (now - p.lit) / 1000;
      const glow = still ? 1 : Math.max(0, 1 - age / 4.5);

}

function openConn() {
  modal("Connection", `
    <div class="col">
      <div class="field"><label for="cfgBase">API base URL</label>

      <div id="cfgWarn"></div>
      <div class="banner info">${I.info}<div><b>Same-origin is the safe default</b>
        <span class="bx">This page is served with a Content-Security-Policy that restricts
        <span class="mono">connect-src</span>, so the browser will <b>block</b> requests to other origins —
        you'll see a CSP violation, not a server error. To target a remote API, serve this page from that
        origin or widen <span class="mono">MORROW_CSP_VALUE</span> on the server.
        <span id="cspLive"></span></span></div></div>
      <div class="row"><button class="btn ghost" data-act="openLogin" type="button">${I.lock}Sign-in &amp; identity…</button></div>
    </div>`,
    `<button class="btn" data-close type="button">Cancel</button>
     <button class="btn pri" data-act="connSave" type="button">Save &amp; reload</button>`);
  const inp = $("#cfgBase");
  const check = () => {
    let same = true;
    try { same = new URL(inp.value || location.origin, location.href).origin === location.origin; } catch { same = false; }
    $("#cfgWarn").innerHTML = same ? "" : `<div class="banner warn">${I.alert}<div>
      <b>Cross-origin — the browser will block these requests</b>
      <span class="bx">Requests to this origin will fail with a CSP <span class="mono">connect-src</span> violation,
      not a server error.</span></div></div>`;
  };
  inp.oninput = check; check();
  /* Show the policy this server is actually sending, rather than asserting one. */
  (async () => {
    try {
      const res = await fetch(S.base + "/health", { method: "GET", headers: headers() });
      const csp = res.headers.get("content-security-policy") || "";
      const m = csp.match(/connect-src[^;]*/i);
      const el = $("#cspLive");
      if (el && m) el.innerHTML = `<br><br>This server currently sends: <span class="mono">${H(m[0])}</span>`;
    } catch {}
  })();
}

function openCmd() {
  const items = CMDS();
  let sel = 0, view = items;
  const close = overlay(`<div class="scrim"><div class="cmd" role="dialog" aria-modal="true" aria-label="Command palette">

  </div></div>`);
  const paint = () => {
    $("#cmdL").innerHTML = view.length
      ? view.map((c, i) => `<div class="cmdItem ${i === sel ? "on" : ""}" data-i="${i}" role="option" aria-selected="${i === sel}">
          ${c.icon}<span>${H(c.label)}</span><span class="cg">${H(c.hint)}</span></div>`).join("")
      : `<div class="empty" style="padding:26px">${I.search}<b>No matches</b></div>`;
    $$("#cmdL .cmdItem").forEach(el => {
      el.onmouseenter = () => { sel = +el.dataset.i; paint(); };
      el.onclick = () => { close(); view[+el.dataset.i].run(); };
    });
    $("#cmdL .cmdItem.on")?.scrollIntoView({ block: "nearest" });
  };
  const q = $("#cmdQ");
  q.oninput = () => {
    const s = q.value.trim().toLowerCase();
    view = s ? items.filter(c => (c.label + " " + c.hint).toLowerCase().includes(s)) : items;
    sel = 0; paint();
  };
  q.onkeydown = (e) => {
    if (e.key === "ArrowDown") { e.preventDefault(); sel = (sel + 1) % Math.max(1, view.length); paint(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); sel = (sel - 1 + view.length) % Math.max(1, view.length); paint(); }
    else if (e.key === "Enter" && view[sel]) { e.preventDefault(); close(); view[sel].run(); }
  };
  paint(); q.focus();
}

/** Operator announcements and maintenance mode, published from the vendor admin portal.
    Info and warning notices can be dismissed until they are edited; critical ones and maintenance stay. */
async function loadNotices() {
  const box = $("#notices"); if (!box) return;
  const out = [];
  const left = demoSecondsLeft();
  if (left !== null) {
    if (left <= 0) {
      S.token = ""; S.org = ""; saveAuth();
      return showAuthGate();
    }
    const at = new Date(Date.now() + left * 1000).toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
    out.push(`<div class="banner info" role="status">${I.info}<div><b>Demo workspace</b>
      <span class="bx">Example Financial Group is fictional sample data. This workspace and everything you change in it
      is deleted at ${H(at)} (in ${Math.max(1, Math.round(left / 60))} min). Scanning and integrations are off.
      <a href="${H(S.demo.source)}" target="_blank" rel="noopener">Self-host Morrow ↗</a></span></div></div>`);
  }
  const r = await safe("/announcements/active");
  if (!r.ok || !r.data) { box.innerHTML = out.join(""); box.hidden = !out.length; return; }
  const hidden = new Set(LS.get("pq_dismissed_notices", "").split("|").filter(Boolean));
  const m = r.data.maintenance || {};
  if (m.enabled) {
    const until = m.ends_at ? ` Expected back ${H(fmtNoticeTime(m.ends_at))}.` : "";
    out.push(`<div class="banner warn" role="status">${I.alert}<div><b>Maintenance in progress</b>
      <span class="bx">${H(m.message || "Changes are paused for a short time; reading data still works.")}${until}</span></div></div>`);
  }
  for (const a of r.data.items || []) {
    const key = `${a.id}@${a.updated_at || ""}`;
    if (a.severity !== "critical" && hidden.has(key)) continue;
    const tone = a.severity === "critical" ? "bad" : a.severity === "warn" ? "warn" : "info";
    out.push(`<div class="banner ${tone}" role="${tone === "bad" ? "alert" : "status"}">${I.alert}<div><b>${H(a.title)}</b>
      ${a.body ? `<span class="bx">${H(a.body)}</span>` : ""}</div>
      ${a.severity !== "critical" ? `<button class="noticeX" type="button" data-act="dismissNotice" data-key="${H(key)}" aria-label="Dismiss notice" title="Dismiss">&times;</button>` : ""}</div>`);
  }
  box.innerHTML = out.join("");
  box.hidden = !out.length;
  wire(box);
}
function fmtNoticeTime(v) {
  const d = new Date(v);
  return isNaN(d) ? String(v) : d.toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });
}

async function loadOrgs() {
  const orgs = await safe("/organizations");
  const list = orgs.ok ? rows(orgs.data) : [];
  const sel = $("#orgSel");
  const fallbackOrg = S.org ? `Org: ${String(S.org).slice(0, 8)}` : "No organizations";
  sel.innerHTML = list.length
    ? list.map(o => `<option value="${H(o.id)}" ${o.id === S.org ? "selected" : ""}>${H(o.name || o.id)}</option>`).join("")
    : `<option value="${H(S.org)}">${H(fallbackOrg)}</option>`;
  sel.onchange = async () => {
    S.org = sel.value; saveAuth();
    await loadAuth(); paintIdentity();

/* ---------------------------------------------------------------- boot */
function setConsoleNav(open, restoreFocus = true) {
  const app = $("#app"), mobile = matchMedia("(max-width:1024px)").matches;
  const wasOpen = app.classList.contains("navOpen");
  app.classList.toggle("navOpen", Boolean(open && mobile));
  $("#navBackdrop").hidden = !(open && mobile);
  $(".main").inert = Boolean(open && mobile);
  $("#consoleSidebar").inert = Boolean(mobile && !open);
  $("#navToggle").setAttribute("aria-expanded", String(mobile ? open : !app.classList.contains("collapsed")));
  if (open && mobile) $("#navClose").focus();
  else if (wasOpen && restoreFocus) $("#navToggle").focus();
}
function boot() {
  applyTheme();
  paintNav();
  verifyOperator();
  $("#themeBtn").onclick = toggleTheme;
  $("#cmdOpen").onclick = openCmd;
  $("#cfgBtn").onclick = openConfig;
  $("#refreshBtn").onclick = retry;
  $("#navToggle").onclick = () => {
    const a = $("#app");
    if (matchMedia("(max-width:1024px)").matches) setConsoleNav(!a.classList.contains("navOpen"));
    else { a.classList.toggle("collapsed"); setConsoleNav(false); }
  };
  $("#navClose").onclick = () => setConsoleNav(false);
  $("#navBackdrop").onclick = () => setConsoleNav(false);
  matchMedia("(max-width:1024px)").addEventListener("change", () => setConsoleNav(false));
  setConsoleNav(false, false);
  wire(document.body);
  document.addEventListener("keydown", (e) => {
    if ($("#app").classList.contains("navOpen")) {
      if (e.key === "Escape") { e.preventDefault(); setConsoleNav(false); return; }
      if (e.key === "Tab") {
        const focusable = $$("button:not(:disabled), select, a[href]", $("#consoleSidebar")).filter(el => el.getClientRects().length);
        const first = focusable[0], last = focusable[focusable.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
      return;
    }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); openCmd(); }
    else if (e.key === "/" && !/input|textarea|select/i.test(document.activeElement?.tagName || "")) { e.preventDefault(); openCmd(); }
    else if (e.key.toLowerCase() === "r" && !e.ctrlKey && !e.metaKey && !/input|textarea|select/i.test(document.activeElement?.tagName || "")) retry();
  });
  window.addEventListener("popstate", () => go(location.hash.slice(1) || "overview", { push: false }));
  if (crossOrigin()) {
    toast(`API base ${S.base} is a different origin than this page — the browser's CSP will block those requests.`,
      "bad", "Cross-origin API base");
  }
  /* Establish identity BEFORE rendering a view. Rendering first fires a screen's worth of requests
     that all 401, and the resulting onAuthLost() would race the auth bootstrap — the gate would
     then be built from an empty /auth/config and hide sign-in methods the server does offer.
     Gate on a real 401 rather than on `auth_config.required`: that flag is true even in headers
     mode, where unauthenticated requests are served normally. The rejection is the ground truth. */
  (async () => {
    if (SUPPORT.active && !(await supportBoot())) return;   // vendor support view: exchange the launch code first
    await loadAuth();
    paintIdentity();
    try {   // a one-time message handed over by another page (e.g. /invite after accepting)
      const flash = JSON.parse(sessionStorage.getItem("pq_flash") || "null");
      sessionStorage.removeItem("pq_flash");
      if (flash?.message) toast(String(flash.message).slice(0, 200), flash.kind === "ok" ? "ok" : "info", String(flash.title || "").slice(0, 80));
    } catch {}
    if (/[?&]signin=invite(&|$)/.test(location.search) && inviteReturnPath()) {
      await showAuthGate();             // came from /invite: sign in, then afterGateAuth returns there
      return;
    }
    if (!S.ctx?.authenticated && !S.token && !S.key) {
      const probe = await safe("/assets");
      if (probe.status === 401) {
        await showAuthGate();
        await Promise.all([health(), loadOrgs()]);
        return;                       // nothing to render behind the gate
      }
    }
    await Promise.all([health(), loadOrgs(), loadNotices()]);
    go(location.hash.slice(1) || "overview", { push: false });
  })();
  setInterval(() => { health(); loadNotices(); }, 60000);
}

const MISSION_LIVE_MS = 20000;
async function startMissionLive(seed) {
  if (S.livePoll) { clearInterval(S.livePoll); S.livePoll = null; }
  let ctx = seed;
  let inFlight = false;
  const tick = async () => {
    const host = $("#missionLive");
    // The node is gone once the user navigates: stop rather than poll into the void.
    if (!host || S.route !== "overview") { clearInterval(S.livePoll); S.livePoll = null; return; }
    if (document.hidden || inFlight) return;
    inFlight = true;
    try {
    const [hndl, board, kpis, obs, agility, assets, repos, rem, fix, scans] = await all([
      "/hndl/dashboard", "/board-risk/weather", "/telemetry/kpis", "/observatory/dashboard",
      "/crypto-agility", "/assets", "/repositories", "/remediations", "/fix-next", "/scans?limit=12",
    ]);
    if (S.route !== "overview" || !host.isConnected) return;
    // A failed endpoint keeps its previous value rather than blanking the panel:
    // a transient 503 should not redraw the estate as empty.
    const AS = assets.ok ? rows(assets.data) : ctx.assets;
    const RP = repos.ok ? rows(repos.data) : ctx.repos;
    const RM = rem.ok ? rows(rem.data) : ctx.rems;
    const FX = fix.ok ? rows(fix.data) : ctx.fixes;
    const SC = scans.ok ? rows(scans.data) : ctx.scans;
    ctx = { ...ctx, assets: AS, repos: RP, rems: RM, fixes: FX, scans: SC,
      HN: hndl.ok ? hndl.data : ctx.HN, W: board.ok ? board.data : ctx.W,
      K: kpis.ok ? kpis.data : ctx.K, O: obs.ok ? obs.data : ctx.O,
      A: agility.ok ? agility.data : ctx.A };
    const next = missionRiskMapCard(AS, RP, RM, FX, SC) + evidenceTelemetryCard(ctx);
    // Only touch the DOM when something actually changed, so the entrance
    // animations do not restart every 20s and the graph stops flickering.
    if (next !== host.innerHTML) { host.innerHTML = next; wire(host); }
    const freshness = $("#missionFreshness");
    if (freshness) {
      const unavailable = [hndl, board, kpis, obs, agility, assets, repos, rem, fix, scans].filter(r => !r.ok).length;
      freshness.dataset.state = unavailable ? "partial" : "current";
      freshness.textContent = unavailable
        ? `${unavailable} sources unavailable - retaining last available values`
        : `Risk panels updated ${new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}`;
    }
    } finally { inFlight = false; }
  };
  S.livePoll = setInterval(tick, MISSION_LIVE_MS);
}

async function rawBytesPost(path, filename, text) {
  const h = headers(false);
  h["x-filename"] = filename;
  const res = await fetch(S.base + path, { method: "POST", headers: h, body: text });
  const ct = res.headers.get("content-type") || "";
  const payload = ct.includes("json") ? await res.json().catch(() => null) : await res.text();
  if (!res.ok) {
    const msg = isObj(payload) ? (payload.detail || payload.message || JSON.stringify(payload)) : String(payload || "");
    throw new Error(`${res.status} - ${msg}`);
  }
  return payload;
}

ACTIONS.requestFormGo = async () => {
  const form = S.pendingForm;
  if (!form) return;
  const values = {};
  for (const f of form.fields) {
    const el = $(`#${form.id}-${f.name}`);
    if (f.type === "file") {
      values[f.name] = el?.files?.[0] || null;
      if (!values[f.name] && f.required !== false) { el?.focus(); return err(`${f.label} is required`); }
      continue;
    }
    const v = String(el?.value ?? "").trim();
    if (!v && f.required !== false) { el?.focus(); return err(`${f.label} is required`); }
    values[f.name] = v;
  }
  let job;
  try { job = form.run(values); } catch (e) { return err(e.message || "Check the values you entered"); }
  $("#overlay").innerHTML = "";
  S.pendingForm = null;
  try { await job; } catch (e) { err(e.message || String(e)); }
};

function scanLiveData(scanRow, results, assets) {
  const seen = new Map();
  const keyOf = name => String(name).toLowerCase().replace(/:443$/, "");
  (results || []).forEach(r => {
    const name = rTarget(r);
    const text = [r.tls_version, r.cipher_name, r.key_type, r.key_detail, JSON.stringify(r.tls_support_map || "")].join(" ");
    const state = r.error ? "error"
      : /mlkem|ml-kem|kyber/i.test(text) ? "hybrid"
      : r.classical_crypto_dependency || /rsa|ec|dsa/i.test(String(r.key_type || r.classical_algorithm || "")) ? "classical" : "unknown";
    seen.set(keyOf(name), { name, state, risk: String(r.risk_level || r.risk || "").toLowerCase(),
      detail: r.error ? String(r.error).slice(0, 60) : [r.tls_version, r.key_type, r.risk_level].filter(Boolean).join(" · ") });
  });
  (assets || []).forEach(a => {
    const name = a.asset_key || a.hostname || a.host || a.name;
    if (typeof name !== "string" || !HOSTLIKE.test(name.trim()) || seen.has(keyOf(name))) return;
    seen.set(keyOf(name), { name, state: "unscanned", detail: "in inventory · not in the latest scan" });
  });
  return {
    endpoints: [...seen.values()].slice(0, 40),
    scanId: scanRow?.id || "", when: scanRow ? AGO(scanRow.created_at) : "",
    score: scanRow?.summary?.quantum_risk_score ?? null, level: scanRow?.summary?.quantum_risk_level || "",
  };
}
function blastLiveData(graph) {
  const nodes = rows(graph || {}, "nodes").map(n => ({
    id: n.id, label: lgLabel(n), type: n.type || "node", risk: lgRisk(n), usd: Number(n.exposure_usd) || 0,
    key: n.key_type ? `${n.key_type}${Number(n.key_bits) ? ` ${n.key_bits}` : ""}` : "",
  }));
  const edges = (graph?.edges || []).map(e => ({ from: e.source ?? e.from, to: e.target ?? e.to }));
  return { nodes, edges, exposure: nodes.reduce((s, n) => s + n.usd, 0) };
}
function hndlLiveData(dash) {
  return {
    qday: dash?.q_day_year ?? null,
    assets: (dash?.priority_queue || []).map(r => ({
      name: r.asset_key || `${r.host}:${r.port}`, usd: Number(r.exposure_usd) || 0, p: Number(r.p_broken) || 0,
      cls: hndlClass(r.algo_class), pq: /pq/i.test(String(r.algo_class || "")),
    })),
  };
}
function pipelineLiveData(remediations, tasks, fixes) {
  const stageOf = s => /verified|closed|done|complete|resolved/i.test(s) ? "done"
    : /merged/i.test(s) ? "merged"
    : /progress|review|pending|proposed|pr[_ ]?open|approved|in_pr/i.test(s) ? "progress" : "open";
  const items = [
    ...(tasks || []).map(x => ({ kind: "task", name: x.asset_key || x.repository_name || `task #${x.id}`, status: String(x.status || "open").replace(/_/g, " "), stage: stageOf(String(x.status || "")) })),
    ...(remediations || []).map(x => ({ kind: "fix", name: x.asset_key || x.repository || `remediation #${x.id}`, status: String(x.status || "open").replace(/_/g, " "), stage: stageOf(String(x.status || "")) })),
  ];
  const next = (fixes || [])[0];
  return { items, next: next ? { name: next.asset_key || next.host || "—", priority: next.priority_score ?? null } : null };
}

ACTIONS.startScan = async () => {
  const targets = targetList();
  if (!targets.length) return err("Add at least one target host");
  const mode = $("#scMode")?.value || "auto";
  const wrap = $("#progWrap");

  /* --- queued path (Celery worker) --- */
  if (mode !== "direct") {
    const r = await safe("/scans", { method: "POST", body: { targets } });
    if (r.ok) {
      const id = r.data.id || r.data.scan_id;
      S.scan.id = id; LS.set("pq_scan", id);
      ok(`Queued ${targets.length} target${targets.length > 1 ? "s" : ""} to the worker`, "Scan started");
      if (wrap) wrap.hidden = false;
      pollScan(id);
      renderScanPane(id);
      return;
    }
    if (mode === "queue") return err(r.err, "Queue unavailable");
    toast("Worker queue unavailable — running the scan directly instead.", "info", "Falling back to direct mode");
  }

  /* --- direct path: synchronous scan, then persist as a real scan row --- */
  if (wrap) {
    wrap.hidden = false;
    $("#pState").className = "pill info";
    $("#pState").textContent = "Scanning directly";
    $("#pPct").textContent = `0% (0/${targets.length})`;
    $("#pBar").style.width = "6%";
    $("#pId").textContent = "direct mode — no queue";
  }
  const live = await safe("/scan", { method: "POST", body: { targets }, timeout: 180000 });
  if (!live.ok) return err(live.err, "Direct scan failed");
  const results = rows(live.data, "results");
  if (!results.length) return err("Scanner returned no results");
  if (wrap) { $("#pBar").style.width = "70%"; $("#pPct").textContent = `70% (${results.length}/${targets.length})`; }

  /* persist so the inventory, CBOM, HNDL and remediation pipelines all see it */
  const saved = await safe("/scans/synthetic", { method: "POST", body: { results, auto_close_merged: true } });
  const savedId = saved.ok ? (saved.data?.scan?.id || saved.data?.id || saved.data?.scan_id) : null;
  if (saved.ok && savedId) {
    const id = savedId;
    S.scan.id = id; LS.set("pq_scan", id);
    if (wrap) {
      $("#pBar").style.width = "100%";
      $("#pPct").textContent = `100% (${results.length}/${results.length})`;
      $("#pState").className = "pill ok";
      $("#pState").textContent = "Completed";
      $("#pId").textContent = id;
    }
    ok(`Scanned ${results.length} target${results.length > 1 ? "s" : ""} and saved to inventory`, "Scan complete");
    renderScanPane(id);
  } else {
    /* couldn't persist — still show the live results rather than losing them */
    if (wrap) { $("#pBar").style.width = "100%"; $("#pState").className = "pill warn"; $("#pState").textContent = "Not persisted"; }
    toast(`Results shown but not saved to inventory${saved.err ? `: ${saved.err}` : ""}`, "info", "Scan complete");
    renderLiveResults(results);
  }
};

function pollScan(id) {
  if (S.poll) clearInterval(S.poll);
  const tick = async () => {
    const r = await safe(`/scans/${encodeURIComponent(id)}`);
    if (!r.ok) { clearInterval(S.poll); S.poll = null; return; }
    const s = r.data, p = s.progress || {};
    const wrap = $("#progWrap");
    if (wrap) {
      wrap.hidden = false;
      $("#pState").className = "pill " + TONE(s.status);
      $("#pState").textContent = TITLE(s.status);
      $("#pPct").textContent = `${p.percent ?? 0}% (${p.done ?? 0}/${p.total ?? 0})`;
      $("#pBar").style.width = clamp(p.percent ?? 0, 0, 100) + "%";
      $("#pId").textContent = id;
    }
    if (/^(done|completed|complete|failed|error)$/i.test(s.status || "")) {
      clearInterval(S.poll); S.poll = null;
      toast(`Scan ${s.status}`, /fail|error/i.test(s.status) ? "bad" : "ok", "Scan finished");
      renderScanPane(id);
    }
  };
  tick();
  S.poll = setInterval(tick, 1500);
}
async function renderScanPane(id) {
  const pane = $("#scanPane");
  if (!pane) return;
  S.scan.id = id; LS.set("pq_scan", id);
  const work = $("#scanWork");
  if (work) work.dataset.pane = "result";
  pane.innerHTML = skel(3, 90);
  const [res, diff] = await all([`/scans/${encodeURIComponent(id)}/results`, `/scans/${encodeURIComponent(id)}/diff`]);
  if (!res.ok) { pane.innerHTML = errBox(res.err, `/scans/${id}/results`); return; }
  S.scan.results = res.data.results || [];
  pane.innerHTML = scanResultBlocks(res.data, diff, id);
  wire(pane);
}

   ========================================================================== */
/* The CBOM view answers what a reviewer asks first — how much of this is
 * quantum-vulnerable — before listing components, and shows the supply-chain
 * inputs (imports, webhook ingests) that feed it instead of only counting them. */
const CBOM_Q = {
  classical: ["Quantum-vulnerable", "tBad"],
  pq: ["Post-quantum", "tOk"],
  na: ["No algorithm recorded", "tNa"],
};
function cbomQuantum(c) {
  const s = JSON.stringify(c).toLowerCase();
  if (/ml-kem|mlkem|kyber|dilithium|ml-dsa|slh-dsa|sphincs|falcon|hybrid|x25519kyber/.test(s)) return "pq";
  if (/\brsa|ecdsa|ecdh|\bdh\b|\bdsa\b|x25519|p-256|p-384|secp|ed25519/.test(s)) return "classical";
  return "na";
}

VIEWS.cbom = async (host) => {
  const [cbom, imports, hook] = await all(["/cbom", "/sbom/imports", "/cbom/webhook/ingests"]);
  const C = cbom.ok ? cbom.data : null;
  const comps = C?.components || [];
  const counts = { classical: 0, pq: 0, na: 0 };
  comps.forEach(c => { counts[cbomQuantum(c)]++; });
  const byType = {};
