# Lint configuration, enforced by .github/workflows/ci.yml.
#
# The CI job previously passed `--select E,F,W --ignore E501` on the command line and reported 441
# errors, so it failed on every run and therefore signalled nothing. The rules kept below are the
# ones that catch actual defects, and the codebase is clean against them; the ones ignored are
# stylistic or unsafe to enforce here, each for a stated reason.
#
# This ruleset has already earned its place: it found `_GITHUB_TOKEN` (an undefined name that
# raised NameError inside a broad except, so an AI-agent health check reported an error instead of
# status), a missing `Optional` import, and two duplicate dictionary keys — one of which silently
# discarded the npm entry for `jsonwebtoken`, so that package was never flagged in any package.json.

line-length = 120

[lint]
select = ["E", "F", "W"]

ignore = [
    # Line length. Long dictionary literals of crypto metadata and long SQL strings dominate here,
    # and wrapping them harms readability more than it helps.
    "E501",
    # Module import not at top of file. app.py accounts for 105 of these: it registers routers and
    # imports optional subsystems after the FastAPI app object exists, which is deliberate. Enforcing
    # this would mean restructuring a 770KB module for no defect caught.
    "E402",
    # Multiple statements on one line. `if not x: return None` guard clauses are used consistently
    # throughout; this is a house style, not a fault.
    "E701",
    "E702",
]

[lint.per-file-ignores]
# app.py imports many names it does not reference itself. Routers reach into this module by name at
# runtime (`getattr(app_module, name)`), and endpoints are registered by decorator, so "unused" here
# is not a reliable signal and removing an import risks breaking an endpoint that no test covers.
# F401 is enforced everywhere else.
"app.py" = ["F401"]
# Tests import fixtures and modules for their side effects (registering routes, seeding schema).
"conftest.py" = ["F401"]
"tests/conftest.py" = ["F401"]
