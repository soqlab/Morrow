[pytest]
filterwarnings =
    ignore:Using `httpx` with `starlette\.testclient` is deprecated; install `httpx2` instead\.:DeprecationWarning
    ignore:pkg_resources is deprecated as an API.*:DeprecationWarning:opentelemetry.instrumentation.dependencies
markers =
    real_services: needs the deploy/e2e container stack (skipped unless MORROW_E2E_BASE_URL is set)
