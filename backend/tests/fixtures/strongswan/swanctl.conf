# Responder configuration used only by test_ike_scanner_strongswan.py.
# Proposal 1: AES-256-GCM / PRF-SHA384 / Curve25519 plus an RFC 9370 additional key exchange (ML-KEM-768).
# Proposal 2: AES-256-CBC / HMAC-SHA256 / MODP-2048, purely classical.
# The scanner never authenticates, so the pre-shared key below is never used.
connections {
  pq {
    version = 2
    proposals = aes256gcm16-prfsha384-x25519-ke1_mlkem768, aes256-sha256-modp2048
    local {
      auth = psk
      id = responder
    }
    remote {
      auth = psk
    }
    children {
      c {
        esp_proposals = aes256gcm16
      }
    }
  }
}
secrets {
  ike-1 {
    secret = "never-used-by-the-scanner"
  }
}
