# PQ-required responder used only by test_ike_scanner_strongswan.py: every IKE proposal carries an
# RFC 9370 additional key exchange (ML-KEM-768 or ML-KEM-1024), so a classical-only offer is refused.
# The scanner never authenticates, so the pre-shared key below is never used.
connections {
  pq {
    version = 2
    proposals = aes256gcm16-prfsha384-x25519-ke1_mlkem768-ke1_mlkem1024
    local {
      auth = psk
      id = responder
    }
    remote {
      auth = psk
    }
    children {
      c {
        esp_proposals = aes256gcm16
      }
    }
  }
}
secrets {
  ike-1 {
    secret = "never-used-by-the-scanner"
  }
}
