# Classical-only responder used only by test_ike_scanner_strongswan.py: no ML-KEM anywhere,
# a weak MODP-1024 group still accepted. Alpine's strongSwan is built without IKEv1, so the
# IKEv1 probe gets an IKEv2 INVALID_MAJOR_VERSION answer.
connections {
  classic {
    version = 2
    proposals = aes128-sha1-modp2048, aes256-sha256-modp1024
    local {
      auth = psk
      id = responder
    }
    remote {
      auth = psk
    }
    children {
      c {
        esp_proposals = aes128-sha1
      }
    }
  }
}
secrets {
  ike-1 {
    secret = "never-used-by-the-scanner"
  }
}
